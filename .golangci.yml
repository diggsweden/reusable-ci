#
# Linter config adapted from gommitlint's set, trimmed to what this
# repo's layout supports. Adding a linter requires an explanation in
# the comment column; removing one too. Tighten over time.
version: 2

run:
  timeout: 5m

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true
  path-prefix: ""

issues:
  uniq-by-line: true

linters:
  default: none
  enable:
    # Correctness
    - asasalint            # `...` mistakes
    - asciicheck           # non-ASCII identifiers
    - bidichk              # bidirectional unicode chars
    - bodyclose            # http response body close
    - containedctx         # context stored in struct
    - contextcheck         # ctx not propagated
    - copyloopvar          # loop var copies (Go 1.22+)
    - durationcheck        # time.Duration math
    - errcheck             # unchecked errors
    - errchkjson           # JSON err handling
    - errname              # error variable naming
    - errorlint            # errors.Is/As usage
    - exhaustive           # exhaustive switches
    - exptostd             # experimental stdlib
    - fatcontext           # nested context.WithValue
    - forcetypeassert      # safe type assertion
    - ginkgolinter         # (no ginkgo here, harmless)
    - gocheckcompilerdirectives
    - gochecknoinits       # init() — explicit setup
    - gochecksumtype       # sumtype completeness
    - gosec                # security
    - govet                # std vet
    - ineffassign          # unused assignments
    - intrange             # range over int (Go 1.22+)
    - loggercheck          # slog/zap key-value pairs
    - makezero             # make() with zero len + append
    - mirror               # bytes/strings mismatches
    - misspell             # typos
    - nakedret             # naked returns
    - nilerr               # returning nil after err
    - noctx                # net/http without ctx
    - perfsprint           # cheaper alternatives to Sprintf
    - prealloc             # slice prealloc
    - predeclared          # shadow builtins
    - reassign             # global mutation
    - rowserrcheck         # sql.Rows
    - sqlclosecheck        # sql close
    - staticcheck          # main static analysis suite
    - testifylint          # testify usage (no-op until we adopt it)
    - testableexamples     # examples that don't compile
    - thelper              # t.Helper() in test helpers
    - unconvert            # unnecessary conversions
    - unparam              # unused params
    - unused               # unused code
    - usestdlibvars        # http.MethodGet over "GET" etc.
    - usetesting           # testing.T over os
    - wastedassign         # dead assignments
    - zerologlint          # (no zerolog, harmless)

    # Style — opted in deliberately, smaller set than gommitlint to
    # respect the codebase's existing shape.
    - decorder             # declaration ordering
    - dogsled              # too many blank identifiers
    - errname              # ErrFoo / FooError naming
    - gocritic             # opinionated checks
    - godot                # comment terminator
    - goprintffuncname     # Print-like funcs end in f
    - importas             # alias enforcement (config below)
    - misspell             # comments
    - perfsprint
    - protogetter          # (no proto here)
    - revive               # configurable golint

  settings:
    exhaustive:
      default-signifies-exhaustive: true

    go-vet:
      enable:
        - shadow

    gosec:
      # G304 (file inclusion) — we deliberately take paths from
      # user-controlled inputs in many subcommands; reviewed in code.
      excludes:
        - G304

    govet:
      enable:
        - shadow

    perfsprint:
      strconcat: false   # %s+%s composition stays readable in builders

    revive:
      ignore-generated-header: true
      severity: warning
      confidence: 0.8
      rules:
        - name: exported
          disabled: false
          exclude:
            # Name() methods on rule structs are obvious — skip.
            - Name

  exclusions:
    presets:
      - common-false-positives
    rules:
      # Test files: don't enforce dupl / paralleltest / ireturn.
      - path: '_test\.go'
        linters:
          - dupl
          - forcetypeassert    # tests cast type-checked fakes
          - gosec              # test fixtures contain literal secrets
      # The generated CLI-reference command is short and obvious.
      - path: 'cmd/gen-cli-reference/'
        linters:
          - gochecknoglobals
      # Sentinel error vars predate the fluent builder; keep them.
      - path: 'internal/domain/errs/errs\.go'
        linters:
          - gochecknoglobals
      # The composition root necessarily has slightly higher cognitive
      # complexity than typical use-case code.
      - path: 'internal/cli/deps/deps\.go'
        linters:
          - cyclop
          - funlen
