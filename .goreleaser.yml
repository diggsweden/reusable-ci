#
# goreleaser config for reusable-ci.
#
# Produces linux/darwin × amd64/arm64 archives plus a checksums file.
# Cosign signing + SBOM emission are gated behind env-only secrets — set
# COSIGN_PRIVATE_KEY / COSIGN_PASSWORD on the release runner to enable.
#
# See docs/migration-history.md (Distribution) for the rationale.

version: 2

project_name: reusable-ci

before:
  hooks:
    - go mod tidy

builds:
  - id: reusable-ci
    main: ./cmd/reusable-ci
    binary: reusable-ci
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      # .CommitDate (not .Date) so the embedded timestamp is derived
      # from the git commit, not the build wall-clock — required for
      # byte-identical rebuilds (SOURCE_DATE_EPOCH semantics).
      - -X main.date={{.CommitDate}}
    # mod_timestamp pins the binary's mtime to the commit time, the
    # last remaining wall-clock source in the standard go build. The
    # archive's mtime: below propagates this to the tarball entries.
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      # Flat dir — LICENSES/**/* matches nothing here; LICENSES/* ships the
      # EUPL-1.2 / GPL-3.0-or-later / CC0-1.0 texts (GPL-3 requires conveying
      # the license with the binary).
      - LICENSES/*
      - README.md

checksum:
  name_template: 'checksums.txt'

# Per-archive Software Bill of Materials via syft. One CycloneDX
# document per tarball, included in checksums.txt — so the cosign
# signature on checksums.txt (below) transitively covers every SBOM
# via SHA-256. Consumers can enumerate inputs without an additional
# verification step.
#
# Requires syft on PATH (release-binary.yml installs it before
# goreleaser runs).
sboms:
  - id: archives
    artifacts: archive
    documents:
      - '${artifact}.cdx.sbom.json'
    cmd: syft
    # sbom args use env-style expansion ($artifact, $document), NOT Go
    # templates — `{{ .Document }}` errors with "map has no entry for key
    # Document". $document expands to the documents: entry above.
    args:
      - scan
      - '$artifact'
      - --output
      - 'cyclonedx-json=$document'

# Sigstore-keyless signing of the release. cosign signs the
# checksums.txt — one bundle covers every per-arch tarball AND every
# SBOM because checksums.txt is the integrity anchor (a per-artifact
# signature would be redundant and noisier in the release UI). The
# bundle carries the Fulcio cert + Rekor proof; consumers verify via
# `cosign verify-blob --bundle checksums.txt.bundle`.
#
# Requires:
#   - cosign on PATH (release-binary.yml installs it before goreleaser)
#   - id-token: write permission on the calling workflow (granted in
#     release-binary.yml so cosign can mint the GHA OIDC token)
signs:
  - id: checksums
    cmd: cosign
    signature: '${artifact}.bundle'
    artifacts: checksum
    args:
      - 'sign-blob'
      - '--yes'
      - '--bundle=${signature}'
      - '${artifact}'
    output: true

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}'

release:
  github:
    owner: diggsweden
    name: reusable-ci
  draft: false
  prerelease: auto

changelog:
  disable: true
