# Tool versions for mise (https://mise.jdx.dev/)
# Install all tools: mise install
# Activate in shell: eval "$(mise activate bash)"

[settings]
experimental = true  # Enable experimental features
pipx.uvx = true      # Install pipx: backend tools via uv (uvx), never pipx

# Supply-chain quarantine: refuse to install a tool release published within
# the last 7 days, so a freshly-poisoned release has time to be noticed before
# it lands here. git-provider-lab sets the same, and calls it "as in the sibling
# repos" -- this repo was the sibling that did not.
minimum_release_age = "7d"

[env]
# Proxy configuration - available during tool installation AND runtime
HTTP_PROXY = "{{ get_env(name='HTTP_PROXY', default='') }}"
HTTPS_PROXY = "{{ get_env(name='HTTPS_PROXY', default='') }}"
NO_PROXY = "{{ get_env(name='NO_PROXY', default='') }}"
http_proxy = "{{ get_env(name='http_proxy', default='') }}"
https_proxy = "{{ get_env(name='https_proxy', default='') }}"
no_proxy = "{{ get_env(name='no_proxy', default='') }}"

# Pip/pipx configuration
PIP_INDEX_URL = "{{ get_env(name='PIP_INDEX_URL', default='') }}"

[tools]
# Lint/security orchestrator — derives a verify plan from the repo and
# runs the configured checks. See nanolinter.toml for the plan.
"forgejo:itiquette/nanolinter" = "0.8.5"

# Per-check tools nanolinter delegates to. Inline comments name the
# nanolinter check ID each tool backs.
"aqua:casey/just" = "1.55.1"
"aqua:rvben/rumdl" = "v0.2.28"
"aqua:google/yamlfmt" = "v0.21.0"             # yaml
"aqua:rhysd/actionlint" = "v1.7.12"
"aqua:zricethezav/gitleaks" = "v8.30.1"       # secrets
"forgejo:itiquette/gommitlint" = "0.9.12"
"aqua:koalaman/shellcheck" = "v0.11.0"        # shell
"aqua:mvdan/sh" = "v3.13.1"
"aqua:hadolint/hadolint" = "v2.14.0"          # container
"aqua:lycheeverse/lychee" = "0.24.2"          # links
"aqua:opengrep/opengrep" = "1.25.0"
"aqua:google/osv-scanner" = "2.4.0"
"aqua:tamasfe/taplo" = "0.10.0"               # toml
"aqua:aquasecurity/trivy" = "0.72.0"
"aqua:crate-ci/typos" = "1.48.0"

# Not a lint tool: syft is a RUNTIME dependency of the product. `sbom
# generate` and `container ledger sign` shell out to it, so the live tier
# needs it on PATH the same way it needs cosign. It was undeclared until a
# live run died five minutes in with `exec: "syft": executable file not
# found`, which reads as a broken product rather than a missing tool.
#
# 1.49.0 rather than the current 1.50.0: the latter was published a day before
# this pin, and git-provider-lab quarantines releases younger than 7d so a
# freshly-poisoned one has time to be noticed. That setting is absent here (see
# [settings]), so the age is honoured by choosing the version.
"aqua:anchore/syft" = "1.49.0"

# uv provides the Python tool runner (uvx) that backs the pipx: tools
# above — with pipx.uvx=true mise routes those installs through uv, so
# pipx is never required.
"aqua:astral-sh/uv" = "0.11.27"

# Misc dev-loop utilities (not bound to a nanolinter check).
"aqua:sharkdp/fd" = "v10.4.2"
"aqua:BurntSushi/ripgrep" = "15.1.0"
"aqua:tldr-pages/tlrc" = "v1.13.1"
yq = "4.53.3"
"pipx:reuse" = "6.2.0"                        # license
