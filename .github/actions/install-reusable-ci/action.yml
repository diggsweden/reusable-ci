#
# Install the reusable-ci binary on plain/macOS runners (where the runtime
# container — which ships the binary pre-baked — is not used).
#
# This is a thin wrapper over scripts/bootstrap/install-reusable-ci.sh. It
# replaces the two-step "sparse actions/checkout of scripts/bootstrap + run the
# script" dance that every plain-runner job otherwise repeats. Because the whole
# reusable-ci repository is fetched when this action is resolved, the wrapped
# script and its install-common.sh sibling are present under github.action_path
# — no separate checkout, and no node (the underlying script is pure bash).
#
# MUST be referenced by full path with a STATIC ref (a `uses:` ref cannot be a
# ${{ }} expression, and a local `./` ref inside a reusable workflow resolves
# against the *caller's* checkout, not reusable-ci's):
#
#   - name: Install reusable-ci
#     uses: diggsweden/reusable-ci/.github/actions/install-reusable-ci@v3.0.0
#     with:
#       ref: ${{ inputs['reusable-ci-binary-ref'] }}
#
# The action version (the @ref above) pins the install *script*; `ref` (this
# input) selects which reusable-ci *binary* version to install. Keep the @ref in
# step with the runtime-image defaults the rest of the workflow already pins.
#
# Ref resolution (see the wrapped script for detail):
#   vX.Y.Z[(-suffix)] → cosign + SHA-256 verified release tarball (no Go needed)
#   local / .         → go install ./cmd/reusable-ci (working copy)
#   SHA / branch      → go install github.com/diggsweden/reusable-ci/...@<ref>
name: Install reusable-ci
description: "Install the cosign/SHA-256-verified reusable-ci binary onto a plain or macOS runner."
inputs:
  ref:
    description: "reusable-ci version/ref to install (vX.Y.Z release tag, a SHA/branch for go install, or local). Defaults to v3.0.0."
    required: false
    default: "v3.0.0"
runs:
  using: composite
  steps:
    # Tagged refs (vN.N.N) install from GitHub Releases with cosign + SHA-256
    # verification — no Go toolchain needed. Branch/SHA refs require Go on the
    # runner; the script errors with an actionable message if it is absent. The
    # script prepends its install dir to GITHUB_PATH, so the binary is on PATH
    # for every later step in the job.
    - name: Install reusable-ci binary
      shell: bash
      env:
        REUSABLE_CI_BINARY_REF: ${{ inputs.ref }}
      run: bash "${GITHUB_ACTION_PATH}/../../../scripts/bootstrap/install-reusable-ci.sh" "$REUSABLE_CI_BINARY_REF"
