# Release Prerequisites Validator
# 
# Purpose: Validates that all requirements for a successful release are met before
# attempting the actual release process. Prevents failed releases by checking
# credentials, permissions, and configuration early in the process.
#
# How it works:
# 1. Validates tag follows semantic versioning (vX.Y.Z)
# 2. Verifies tag is cryptographically signed (GPG or SSH)
# 3. Checks tag version matches project version (pom.xml/package.json)
# 4. Validates all required secrets are present and valid
# 5. Tests authentication to target registries (Maven Central, ghcr.io)
# 6. Verifies GPG keys are valid and not expired
# 7. Checks user authorization for non-SNAPSHOT releases (if configured)
# 8. Generates detailed validation report
#
# Security controls:
# - Requires cryptographically signed tags (GPG or SSH) for all releases
# - Never logs secret values, only validation status
# - Checks GPG key expiration dates
# - Validates user is in authorized developers list (if enabled)
# - Verifies registry credentials before attempting publish
#
# Required Secrets (depending on configuration):
#   RELEASE_TOKEN: For version bump/release operations
#   RELEASE_GPG_PRIVATE_KEY: For signed release commits/artifacts
#   RELEASE_GPG_PASSPHRASE: For signed release commits/artifacts
#   RELEASE_GPG_PUBLIC_KEY: For tag/public-key validation
#   MAVEN_CENTRAL_USERNAME: For Maven Central auth check
#   MAVEN_CENTRAL_PASSWORD: For Maven Central auth check
#
# Required Permissions:
#   contents: read   # Read version files
#   packages: read   # Verify package registry access
#
# Usage:
# Called as the first step in release-orchestrator.yml. The orchestrator
# passes typed plan JSON plus plan-derived booleans for target-specific
# prerequisite gates.
name: Validate Release Prerequisites
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      config-plan-json:
        description: "Typed config-plan-json emitted by config parse-artifacts."
        required: true
        type: string
      has-cargo-publish-target:
        description: "Whether Cargo prerequisite checks should run. True when any cargo artefact is planned (either build-mode)."
        required: false
        default: false
        type: boolean
      publish-stage-plan-json:
        description: "Typed publish-stage plan used for per-artifact prerequisite checks."
        required: true
        type: string
      has-maven-central-publish-target:
        description: "Whether Maven Central credential checks should run."
        required: false
        default: false
        type: boolean
      has-jvm-artefact:
        description: "Whether the plan includes a Maven/Gradle/Gradle-Android artefact. Enables the JVM reproducibility check (warns when pom.xml lacks project.build.outputTimestamp or build.gradle lacks preserveFileTimestamps/reproducibleFileOrder)."
        required: false
        default: false
        type: boolean
      container-registry:
        description: "Container registry"
        required: false
        default: "ghcr.io"
        type: string
      sign-artifacts:
        description: "Whether artifacts will be GPG signed"
        required: false
        default: true
        type: boolean
      require-allowlisted-signer:
        description: "Require the tag signer to be allowlisted in .reusable-ci/allowed_signers (SSH) or .reusable-ci/allowed_gpg_keys.asc (GPG). When true, a missing/empty allowlist or an unverifiable signature fails closed with EX_NOPERM (77)."
        required: false
        default: false
        type: boolean
      branch:
        description: "Target branch for release (default: main)"
        required: false
        default: "main"
        type: string
      runtime-image:
        description: "reusable-ci runtime image. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:v3.0.0"
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    # validate-release-prerequisites probes every release-time secret
    # the orchestrator will subsequently need, so this declaration is
    # the canonical union for "what does a release flow need?"
    secrets:
      MAVEN_CENTRAL_USERNAME:
        description: "Sonatype OSSRH portal username (validates the Maven Central path will work)"
        required: false
      MAVEN_CENTRAL_PASSWORD:
        description: "Sonatype OSSRH portal token"
        required: false
      NPM_TOKEN:
        description: "npm registry publish token"
        required: false
      RELEASE_GPG_PRIVATE_KEY:
        description: "Armored OpenPGP private key used by `release sign`"
        required: false
      RELEASE_GPG_PASSPHRASE:
        description: "Passphrase for RELEASE_GPG_PRIVATE_KEY"
        required: false
      RELEASE_GPG_PUBLIC_KEY:
        description: "Public half of RELEASE_GPG_PRIVATE_KEY (committed to the repo as documentation)"
        required: false
      RELEASE_TOKEN:
        description: "Token with contents:write for release creation"
        required: false
      CODE_SCANNING_TOKEN:
        description: "Token with security-events:write for SARIF upload"
        required: false
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  validate:
    name: Validate Prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ inputs['runtime-image'] }}
    # ============================================================================
    # This job validates all prerequisites required for a successful release:
    #   1. Tag Validation - Format, signature, uniqueness, commit availability
    #   2. Authorization - User permissions for non-SNAPSHOT releases
    #   3. Secrets & Credentials - GPG keys, tokens, publishing credentials
    #   4. Summary Generation -  validation report
    # ============================================================================
    steps:
      # Defense-in-depth: refuse PR-context triggers. This validator
      # probes every release-time secret (GPG, Maven Central, NPM) and
      # must never run with PR-HEAD code. reusable-ci is pre-baked.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Debug - List checked out files
        env:
          ACTION_REPOSITORY: ${{ github.action_repository }}
          ACTION_REF: ${{ github.action_ref }}
        run: reusable-ci platform debug-workspace
      - name: Import GPG key
        id: import-gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GIT_USER_SIGNINGKEY: "true"
          GIT_COMMIT_GPGSIGN: "true"
          REUSABLE_CI_GIT_CONFIG_GLOBAL: "true"
        run: reusable-ci release gpg import
      - name: Fetch all tags
        run: git fetch --tags --force
      # All prerequisite validators run concurrently inside one Go
      # invocation. The orchestrator owns ordering, output capture, and
      # aggregate failure reporting. Replaces ~10 sequential workflow
      # steps with one — saves ~30-50s wall-clock per release run.
      - name: Validate Release Prerequisites
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          TARGET_BRANCH: ${{ inputs.branch }}
          REPOSITORY: ${{ github.repository }}
          REQUIRE_ALLOWLISTED_SIGNER: ${{ inputs['require-allowlisted-signer'] }}
          SIGN_ARTIFACTS: ${{ inputs['sign-artifacts'] }}
          HAS_MAVEN_CENTRAL_TARGET: ${{ inputs['has-maven-central-publish-target'] }}
          HAS_CARGO_TARGET: ${{ inputs['has-cargo-publish-target'] }}
          HAS_JVM_TARGET: ${{ inputs['has-jvm-artefact'] }}
          PUBLISH_STAGE_PLAN_JSON: ${{ inputs['publish-stage-plan-json'] }}
          CONFIG_PLAN_JSON: ${{ inputs['config-plan-json'] }}
          # Secrets stay in env — never passed via argv.
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: reusable-ci validate prerequisites
      # Secrets-presence summary stays as a separate step — it reports a
      # different shape (which secrets are configured, regardless of
      # whether they were exercised by the validators above).
      - name: Generate Validation Summary
        if: always()
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          CONFIG_PLAN_JSON: ${{ inputs['config-plan-json'] }}
          CONTAINER_REGISTRY: ${{ inputs['container-registry'] }}
          SIGN_ARTIFACTS: ${{ inputs['sign-artifacts'] }}
          REQUIRE_ALLOWLISTED_SIGNER: ${{ inputs['require-allowlisted-signer'] }}
          JOB_STATUS: ${{ job.status }}
          HAS_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
          HAS_RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE != '' }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          HAS_RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY != '' }}
          HAS_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' }}
          HAS_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD != '' }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          HAS_CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN != '' }}
        run: reusable-ci report status prerequisites
      - name: Cleanup GPG key
        if: always()
        env:
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
        run: reusable-ci release gpg cleanup
