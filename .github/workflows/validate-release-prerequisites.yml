# Release Prerequisites Validator
# 
# Purpose: Validates that all requirements for a successful release are met before
# attempting the actual release process. Prevents failed releases by checking
# credentials, permissions, and configuration early in the process.
#
# How it works:
# 1. Validates tag follows semantic versioning (vX.Y.Z)
# 2. Verifies tag is cryptographically signed (GPG or SSH)
# 3. Checks tag version matches project version (pom.xml/package.json)
# 4. Validates all required secrets are present and valid
# 5. Tests authentication to target registries (Maven Central, NPM, ghcr.io)
# 6. Verifies GPG keys are valid and not expired
# 7. Checks user authorization for non-SNAPSHOT releases (if configured)
# 8. Generates detailed validation report
#
# Security controls:
# - Requires cryptographically signed tags (GPG or SSH) for all releases
# - Never logs secret values, only validation status
# - Checks GPG key expiration dates
# - Validates user is in authorized developers list (if enabled)
# - Verifies registry credentials before attempting publish
#
# Required Secrets (depending on configuration):
#   GPG_SECRET_KEY: For signature validation
#   GPG_PASSPHRASE: For signature validation
#   MAVEN_CENTRAL_USERNAME: For Maven Central auth check
#   MAVEN_CENTRAL_PASSWORD: For Maven Central auth check
#   NPM_TOKEN: For NPM registry auth check
#   AUTHORIZED_DEVELOPERS: Comma-separated list of authorized users
#
# Required Permissions:
#   contents: read   # Read version files
#   packages: read   # Verify package registry access
#
# Usage:
# Called as the first step in release-orchestrator.yml. The orchestrator
# passes the parsed artifacts JSON array; type-specific gates (cargo
# prerequisites, Maven Central credentials) trigger on the per-target
# arrays being non-empty.
name: Validate Release Prerequisites
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      artifacts:
        description: "Parsed artifacts JSON array (from parse-artifacts-config). Type-specific checks gate on derived per-target arrays below."
        required: true
        type: string
      cargo-artifacts:
        description: "Per-ecosystem cargo artifacts JSON array. Drives Cargo prerequisite checks when non-empty."
        required: false
        default: "[]"
        type: string
      mavencentral-artifacts:
        description: "Per-target maven-central publish artifacts JSON array. Drives Maven Central credential checks when non-empty."
        required: false
        default: "[]"
        type: string
      container-registry:
        description: "Container registry"
        required: false
        default: "ghcr.io"
        type: string
      sign-artifacts:
        description: "Whether artifacts will be GPG signed"
        required: false
        default: true
        type: boolean
      check-authorization:
        description: "Check if user is authorized for non-SNAPSHOT releases"
        required: false
        default: false
        type: boolean
      branch:
        description: "Target branch for release (default: main)"
        required: false
        default: "main"
        type: string
      runtime-image:
        description: "reusable-ci runtime image. Pin to a digest or version tag; default tracks main."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:main"
        type: string
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  validate:
    name: Validate Prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ inputs['runtime-image'] }}
    # ============================================================================
    # This job validates all prerequisites required for a successful release:
    #   1. Tag Validation - Format, signature, uniqueness, commit availability
    #   2. Authorization - User permissions for non-SNAPSHOT releases
    #   3. Secrets & Credentials - GPG keys, tokens, publishing credentials
    #   4. Summary Generation -  validation report
    # ============================================================================
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Debug - List checked out files
        env:
          ACTION_REPOSITORY: ${{ github.action_repository }}
          ACTION_REF: ${{ github.action_ref }}
        run: reusable-ci ci debug-workspace
      - name: Verify Triggered by Tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: reusable-ci validate ref-type "$REF_TYPE" "$REF_NAME" "$REF"
      - name: Import GPG key
        id: import-gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GIT_USER_SIGNINGKEY: "true"
          GIT_COMMIT_GPGSIGN: "true"
          GIT_CONFIG_GLOBAL: "true"
        run: reusable-ci release gpg-import
      - name: Fetch all tags
        run: |
          printf "Fetching all tags to ensure we have tag objects...\n"
          git fetch --tags --force
      - name: Validate Tag Format
        if: ${{ github.ref_type == 'tag' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: reusable-ci validate tag-format "$REF_NAME"
      - name: Validate Tag Signature
        if: ${{ github.ref_type == 'tag' }}
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
        run: reusable-ci validate tag-signature "$REF_NAME" "$REPOSITORY"
      - name: Validate Tag Uniqueness
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: reusable-ci validate tag-uniqueness "$TAG_NAME"
      - name: Validate Tag Commit Availability
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: reusable-ci validate tag-commit "$TAG_NAME" "$TARGET_BRANCH"
      # ============================================================================
      # SECTION 2: Authorization Validation
      # Checks if user is authorized for non-SNAPSHOT releases
      # ============================================================================
      - name: Check Release Authorization
        if: ${{ inputs['check-authorization'] }}
        env:
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RELEASE_AUTHORIZED_USERS: ${{ secrets.RELEASE_AUTHORIZED_USERS }}
        run: |
          reusable-ci validate authorization \
            "$REF_NAME" \
            "$ACTOR" \
            "$RELEASE_AUTHORIZED_USERS"
      # ============================================================================
      # SECTION 3: Secrets and Credentials Validation
      # Validates GPG keys, GitHub tokens, and publishing credentials
      # Note: GPG key was already imported above for tag validation
      # ============================================================================
      - name: Validate GPG Public Key
        if: ${{ inputs['sign-artifacts'] }}
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
        run: reusable-ci validate gpg-public-key
      - name: Validate Release Token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: reusable-ci validate token
      - name: Validate Release Token Permissions
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: reusable-ci validate bot-permissions "${{ github.repository }}"
      - name: Validate Maven Central Credentials
        if: ${{ inputs['mavencentral-artifacts'] != '[]' }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: reusable-ci validate maven-central-credentials
      # NOTE: NPM publishing to npmjs.org not yet implemented in v2
      # NPM packages are attached to GitHub Release as tarballs
      # This validation will be re-enabled when NPM publishing is added
      - name: Validate Cargo Project Prerequisites
        if: ${{ inputs['cargo-artifacts'] != '[]' }}
        run: |
          # Cargo.lock should be checked in (reproducibility, deterministic
          # SBOM generation in sbom-cargo.yml). rust-toolchain.toml is the
          # recommended pin (the cargo workflows auto-detect it) but not strictly
          # required — release without one is allowed but warned.
          set -euo pipefail
          status=0
          if [[ ! -f Cargo.lock ]]; then
            printf "::error::Cargo.lock not found at repo root\n"
            printf "::error::Cargo.lock must be committed for reproducible releases\n"
            status=1
          else
            printf "::notice::Cargo.lock present\n"
          fi
          if [[ ! -f rust-toolchain.toml && ! -f rust-toolchain ]]; then
            printf "::warning::No rust-toolchain.toml or rust-toolchain pin found\n"
            printf "::warning::Recommended: pin the toolchain so CI and local dev match\n"
          else
            printf "::notice::Toolchain pin present\n"
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            printf "::error::cargo is not installed on the runner\n"
            status=1
          else
            cargo --version
          fi
          exit "$status"
      # ============================================================================
      # SECTION 4: Summary Generation
      # Creates  validation report
      # ============================================================================
      - name: Generate Validation Summary
        if: always()
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          ARTIFACTS: ${{ inputs.artifacts }}
          CONTAINER_REGISTRY: ${{ inputs['container-registry'] }}
          SIGN_ARTIFACTS: ${{ inputs['sign-artifacts'] }}
          CHECK_AUTHORIZATION: ${{ inputs['check-authorization'] }}
          ACTOR: ${{ github.actor }}
          JOB_STATUS: ${{ job.status }}
          HAS_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
          HAS_RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE != '' }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          HAS_RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY != '' }}
          HAS_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' }}
          HAS_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD != '' }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          HAS_CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN != '' }}
        run: reusable-ci summary prerequisites
      - name: Cleanup GPG key
        if: always()
        env:
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
        run: reusable-ci release gpg-cleanup
