# Maven Builder
# 
# Purpose: Builds Maven projects (applications or libraries) and uploads artifacts
# for subsequent publishing steps. Separates build logic from registry-specific publishing.
#
# Build Types:
#   - app: Standard application JAR (no sources/javadoc)
#   - lib: Library with sources and javadoc JARs (required for Maven Central)
#
# Outputs:
#   - Artifacts uploaded as '<artifact-name>-build-artifacts' or 'maven-build-artifacts' for use by publish-* workflows
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build Maven
on:
  workflow_call:
    inputs:
      build-type:
        description: "Build type: app (application) or lib (library with sources/javadoc)"
        required: true
        type: string
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      skip-tests:
        description: "Skip tests during build"
        required: false
        default: false
        type: boolean
      branch:
        description: "Branch to checkout"
        required: false
        default: "main"
        type: string
      profile:
        description: "Maven profile to activate (e.g., central-release for libraries)"
        required: false
        default: ""
        type: string
      artifact-name:
        description: "Logical artifact name for upload naming (defaults to 'maven-build-artifacts' when empty)"
        required: false
        default: ""
        type: string
      enable-build-sbom:
        description: "Run the cyclonedx plugin step (false skips Build SBOM generation entirely; derived from per-artefact 'sboms' when called from release-build-stage)"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "reusable-ci runtime image carrying JDK + Maven. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-java-25:v3.0.0"
        type: string
permissions:
  contents: read
env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
jobs:
  build-maven:
    name: Build Maven Project
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - name: Cache Maven dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles(format('{0}/pom.xml', inputs['working-directory']), format('{0}/**/pom.xml', inputs['working-directory'])) }}
          restore-keys: maven-
      - name: Install dependencies for multi-module projects
        working-directory: ${{ inputs['working-directory'] }}
        run: |
          printf "Installing project modules to local repository...\n"
          # shellcheck disable=SC2086
          mvn $MAVEN_CLI_OPTS install -DskipTests
      - name: Get version info
        id: version-info
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci build maven metadata
      - name: Build application
        if: ${{ inputs['build-type'] == 'app' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
        run: reusable-ci build maven application
      - name: Build library with sources and javadoc
        if: ${{ inputs['build-type'] == 'lib' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          MAVEN_PROFILE: ${{ inputs['profile'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
        run: reusable-ci build maven library
      - name: Generate Build SBOM
        id: sbom
        if: ${{ inputs['enable-build-sbom'] }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-maven-plugin
          CYCLONEDX_MAVEN_VERSION: "2.9.1"
        run: |
          # shellcheck disable=SC2086
          mvn $MAVEN_CLI_OPTS "org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_MAVEN_VERSION}:makeAggregateBom"
      - name: Write SBOM status to step summary
        if: always()
        env:
          ECOSYSTEM: maven
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: reusable-ci report status build-sbom
      - name: Upload Maven artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-artifacts', inputs['artifact-name']) || 'maven-build-artifacts' }}
          path: |
            ${{ inputs['working-directory'] }}/target/*.jar
            ${{ inputs['working-directory'] }}/target/*.war
            ${{ inputs['working-directory'] }}/target/*.pom
            ${{ inputs['working-directory'] }}/**/target/*.jar
            ${{ inputs['working-directory'] }}/**/target/*.war
            ${{ inputs['working-directory'] }}/**/target/*.pom
            !${{ inputs['working-directory'] }}/target/original-*.jar
            !${{ inputs['working-directory'] }}/**/target/original-*.jar
          retention-days: 7
          if-no-files-found: error
      # Build SBOM is a separate compliance deliverable; keeping it in its
      # own artifact means a broken SBOM plugin can't take down the code
      # artifact and downstream consumers can fetch just what they need.
      - name: Upload Maven Build SBOM
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-sbom', inputs['artifact-name']) || 'maven-build-sbom' }}
          path: |
            ${{ inputs['working-directory'] }}/target/bom.json
            ${{ inputs['working-directory'] }}/**/target/bom.json
          retention-days: 7
          if-no-files-found: warn
      - name: Generate build summary
        env:
          BUILD_TYPE: ${{ inputs['build-type'] }}
          GROUP_ID: ${{ steps.version-info.outputs.group-id }}
          ARTIFACT_ID: ${{ steps.version-info.outputs.artifact-id }}
          VERSION: ${{ steps.version-info.outputs.version }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          IS_SNAPSHOT: ${{ steps.version-info.outputs.is-snapshot }}
          JAVA_VERSION: "25"
        run: reusable-ci report build maven
