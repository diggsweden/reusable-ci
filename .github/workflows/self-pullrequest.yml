# ⚠️ INTERNAL USE ONLY - PR validation workflow for reusable-ci itself
# This workflow validates pull requests to reusable-ci using pullrequest-orchestrator.
# For templates to use in YOUR project, see examples/ directory.
name: Self Pull Request
on:
  pull_request:
    branches:
      - main
      - feat/**
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/pullrequest-orchestrator.yml
    permissions:
      contents: read
      packages: read
    with:
      project-type: npm
      reusable-ci-binary-ref: ${{ github.head_ref }}
      # This repo dogfoods nanolinter via the dedicated `lint` job below,
      # which sets up Go for the go-* checks. Disable the orchestrator
      # lint engine so it doesn't run a second, Go-less `nanolinter verify`
      # that would fail. Consumer projects take the default (lint-engine: nanolinter).
      lint-engine: none
  lint:
    name: Lint (nanolinter verify)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # gitleaks and commits checks walk full history; default
          # shallow checkout would yield false negatives.
          fetch-depth: 0
      - name: Install mise and project tools
        run: |
          source ./scripts/bootstrap/install-mise.sh
          install_mise
          mise install
          # Expose mise-managed binaries to subsequent steps.
          printf '%s\n' "${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims" >>"$GITHUB_PATH"
          dirname "$(command -v mise)" >>"$GITHUB_PATH"
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: nanolinter doctor (tool health)
        run: nanolinter doctor
      - name: nanolinter verify (full plan from nanolinter.toml)
        run: just lint
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install mise and project tools
        run: |
          source ./scripts/bootstrap/install-mise.sh
          install_mise
          mise install
          # Expose mise-managed binaries to subsequent steps.
          printf '%s\n' "${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims" >>"$GITHUB_PATH"
          dirname "$(command -v mise)" >>"$GITHUB_PATH"
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Validate reusable workflow input defaults
        run: go run ./cmd/reusable-ci validate workflow input-defaults
      - name: Run tests
        run: just test
  integration-testsuite:
    # Gate every engine change on the companion black-box suite
    # (diggsweden/reusable-ci-blackbox-tests): real toolchains, real git/gpg/ssh,
    # externally-observable behaviour. Without this edge the suite only ran
    # on its own pushes plus a daily drift schedule — an engine commit could
    # land green here and break the suite a day later.
    #
    # The suite is pinned by commit and bumped deliberately (same follow
    # philosophy as consumers pinning this repo); its own CI keeps floating
    # against this repo's default branch for drift detection, so the two
    # directions stay deliberately asymmetric — no circular pin.
    name: Integration testsuite (black-box)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: reusable-ci
      - name: Checkout companion testsuite (pinned)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci-blackbox-tests
          ref: 1f3ea0967192584cb570ce90ed356000834fed34
          path: reusable-ci-blackbox-tests
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: reusable-ci/go.mod
          check-latest: true
      # TestMain builds the engine from the sibling checkout itself (the
      # sibling wins over the REUSABLE_CI override), so no prebuild step.
      - name: Run the black-box suite against this checkout
        run: go test -tags integration -timeout 20m ./tests/integration/
        working-directory: reusable-ci-blackbox-tests

  go:
    name: Go (build, test, lint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go build
        run: go build -o /tmp/reusable-ci ./cmd/reusable-ci
      - name: go test
        run: go test -race -timeout 120s ./...
      - name: go test e2e
        run: just test-e2e
      - name: go test fuzz seed corpora
        run: just test-fuzz
      - name: go vet
        run: go vet ./...
      - name: smoke — --version
        run: /tmp/reusable-ci --version
