# ⚠️ INTERNAL USE ONLY - PR validation workflow for reusable-ci itself
# This workflow validates pull requests to reusable-ci using pullrequest-orchestrator.
# For templates to use in YOUR project, see examples/ directory.
name: Self Pull Request
on:
  pull_request:
    branches:
      - main
      - feat/**
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/pullrequest-orchestrator.yml
    permissions:
      contents: read
      packages: read
    with:
      project-type: npm
      reusable-ci-binary-ref: ${{ github.head_ref }}
      # This repo dogfoods nanolinter via the dedicated `lint` job below,
      # which sets up Go for the go-* checks. Disable the orchestrator
      # nanolinter route so it doesn't run a second, Go-less `just lint`
      # that would fail. Consumer projects take the default (nanolinter: true).
      linters.nanolinter: false
  lint:
    name: Lint (nanolinter verify)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # gitleaks and commits checks walk full history; default
          # shallow checkout would yield false negatives.
          fetch-depth: 0
      - name: Install mise and project tools
        run: |
          source ./scripts/bootstrap/install-mise.sh
          install_mise
          mise install
          # Expose mise-managed binaries to subsequent steps.
          printf '%s\n' "${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims" >>"$GITHUB_PATH"
          dirname "$(command -v mise)" >>"$GITHUB_PATH"
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: nanolinter doctor (tool health)
        run: nanolinter doctor
      - name: nanolinter verify (full plan from nanolinter.toml)
        run: just lint
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install mise and project tools
        run: |
          source ./scripts/bootstrap/install-mise.sh
          install_mise
          mise install
          # Expose mise-managed binaries to subsequent steps.
          printf '%s\n' "${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims" >>"$GITHUB_PATH"
          dirname "$(command -v mise)" >>"$GITHUB_PATH"
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Validate reusable workflow input defaults
        run: go run ./cmd/reusable-ci validate workflow input-defaults
      - name: Run tests
        run: just test
  go:
    name: Go (build, test, lint)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go build
        run: go build -o /tmp/reusable-ci ./cmd/reusable-ci
      - name: go test
        run: go test -race -timeout 120s ./...
      - name: go test e2e
        run: just test-e2e
      - name: go test fuzz seed corpora
        run: just test-fuzz
      - name: go vet
        run: go vet ./...
      - name: smoke — --version
        run: /tmp/reusable-ci --version
