name: Lint Misc
on:
  workflow_call:
    inputs:
      runtime-image:
        description: "reusable-ci runtime image. Base image is sufficient because mise is baked in."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:v3.0.0"
        type: string
permissions:
  contents: read
jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Needed for commit linting
      - name: Install project tools
        env:
          SHELLCHECK_OPTS: --exclude=SC2086
        run: |
          mise install
          mise list
          eval "$(mise activate bash)"
          just lint
