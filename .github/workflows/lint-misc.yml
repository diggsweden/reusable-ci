name: Verify Mise And Just
env:
  # Tool updates can require verification metadata newer than mise's bundled registry.
  MISE_AQUA_BAKED_REGISTRY: "false"
on: [workflow_call]
permissions:
  contents: read
jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Needed for commit linting
      - name: Setup mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.9.18"
          install: true
          cache: true
          experimental: true # Required for go backend tools
      - name: Install mise tools
        run: |
          mise install
          mise list
      - name: Just Verify
        env:
          SHELLCHECK_OPTS: --exclude=SC2086
        run: |
          activate_mise() {
            eval "$(mise activate bash)"
          }

          activate_mise
          just lint
