name: Verify Mise And Just
env:
  # Tool updates can require verification metadata newer than mise's bundled registry.
  MISE_AQUA_BAKED_REGISTRY: "false"
on: [workflow_call]
permissions:
  contents: read
jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # Needed for commit linting
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.9.18"
          install: true
          cache: true
          experimental: true # Required for go backend tools
      - name: Install mise tools
        run: |
          mise install
          mise list
      - name: Just Verify
        env:
          SHELLCHECK_OPTS: --exclude=SC2086
        run: |
          activate_mise() {
            eval "$(mise activate bash)"
          }

          activate_mise
          just lint
