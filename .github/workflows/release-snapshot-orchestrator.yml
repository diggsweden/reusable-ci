# Release Snapshot Orchestrator
# 
# Purpose: Lightweight orchestrator for development builds. Provides fast
# feedback loops by keeping the production control-plane shape while skipping
# release-only features such as signing and GitHub Release creation.
#
# How it works:
# 1. Triggers on pushes to development branches (develop, feature/*)
# 2. Builds configured artifact-first ecosystems
# 3. Optionally publishes NPM package to GitHub Packages (snapshot tag)
# 4. Optionally generates SBOMs when the `sboms` input opts in
# 5. Skips release-only features (SLSA, signing, GitHub releases)
#
# Note: the snapshot flow builds no containers. A container is built ONCE on
# the release path and promoted to :dev by the build-once/promote-many ladder
# (promote-stage.yml); the snapshot flow is npm/SBOM-only.
#
# Security controls:
# - Minimal - focused on speed over security for development
# - Packages clearly marked with -snap namespace / snapshot tag
# - No production attestations or signing
#
# Registry Authentication:
#   GitHub Packages (default): Uses GITHUB_TOKEN (no secrets needed)
#   Other registries: Set use-ci-token=false and provide registry-password secret
#
# Required Secrets:
#   registry-password: Required when use-ci-token=false (for npmjs.org, etc)
#
# Required Permissions:
#   contents: read   # Read source code
#   packages: write  # Push images to ghcr.io and packages to GitHub Packages
#
# Differences from Production:
#   - Snapshot tags (0.5.9-snapshot-feat-name-abc1234) vs version tags
#   - No SLSA attestation
#   - SBOM generation defaults to none; opt in with `sboms`
#   - No vulnerability scanning
#   - No artifact signing
#   - No GitHub release
#   - ~3-5 min vs ~12-15 min build time
name: Orchestrate Snapshot Release
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      artifacts-config:
        description: "Path to the artifacts config file. Defaults to .reusable-ci/artifacts.yml. The snapshot release reads containers and per-artefact configuration from this file; auto-derives when the file is absent and the repo has exactly one root manifest."
        required: false
        default: ".reusable-ci/artifacts.yml"
        type: string
      project-type:
        description: "Project type override. Optional — defaults to the first artefact's project-type from artifacts.yml."
        required: false
        default: ""
        type: string
      registry:
        description: "Registry forwarded to the snapshot plan context (default ghcr.io). The snapshot flow is npm/SBOM-only and builds no containers."
        required: false
        default: "ghcr.io"
        type: string
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      java-version:
        description: "Java version (for maven/gradle)"
        required: false
        default: "25"
        type: string
      node-version:
        description: "Node.js version (for npm)"
        required: false
        default: "24"
        type: string
      rust-toolchain:
        description: "Rust toolchain (for cargo). Ignored when working-directory contains rust-toolchain.toml."
        required: false
        default: "stable"
        type: string
      publish-npm:
        description: "Publish NPM package to registry (npm projects only)"
        required: false
        default: true
        type: boolean
      publish-gradle:
        description: "Publish Gradle/Android-library SNAPSHOTs to the forge registry or Maven Central (gradle projects only). Defaults false: unlike the other snapshot legs this one needs registry credentials and a signing key, so it is opt-in rather than something a caller inherits by upgrading. The published version is whatever the branch's gradle.properties declares, and the job refuses to deploy a non-SNAPSHOT."
        required: false
        default: false
        type: boolean
      npm-registry:
        description: "NPM registry URL"
        required: false
        default: "https://npm.pkg.github.com"
        type: string
      package-scope:
        description: "Required NPM package scope, e.g. @<github-repository-owner> (@diggsweden for DiggSweden repositories)"
        required: false
        default: ""
        type: string
      use-ci-token:
        description: "Use GITHUB_TOKEN for GitHub Packages authentication. Set false for external NPM registries."
        required: false
        default: true
        type: boolean
      reusable-ci-binary-ref:
        description: "reusable-ci ref/version passed to downstream plain-runner jobs (defaults to v3.0.0)"
        required: false
        default: "v3.0.0"
        type: string
      runtime-image:
        description: "reusable-ci base runtime image for control-plane jobs. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:v3.0.0"
        type: string
      runtime-image-full:
        description: "reusable-ci full runtime image for SBOM-capable snapshot publish jobs. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime:v3.0.0"
        type: string
      runtime-image-java:
        description: "reusable-ci Java runtime image for Maven/Gradle jobs. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-java-25:v3.0.0"
        type: string
      runtime-image-node:
        description: "reusable-ci Node runtime image for NPM jobs. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-node-24:v3.0.0"
        type: string
      runtime-image-rust:
        description: "reusable-ci Rust runtime image for Cargo build + SBOM jobs (build-cargo.yml for artefact-first, sbom-cargo.yml for container-first). Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-rust-stable:v3.0.0"
        type: string
      runtime-image-go:
        description: "reusable-ci Go runtime image for Go build/SBOM jobs. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-go-1.26:v3.0.0"
        type: string
      runtime-image-android:
        description: "reusable-ci Android runtime image for Gradle Android jobs. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-android-35:v3.0.0"
        type: string
      sboms:
        description: "SBOMs to generate: all | none | comma-list of build,analyzed-artifact,analyzed-container (default: none for snapshot speed; set to 'all' to test SBOM wiring)"
        required: false
        default: "none"
        type: string
    # Snapshot orchestrator: forwards to release-snapshot-build-stage (which
    # may need Android/iOS signing secrets via gradle-android /
    # xcode-ios leaves) and release-snapshot-publish-stage (GITHUB_TOKEN
    # auto-provided, the external registry-password, and — only when
    # publish-gradle is on — the Maven Central credentials and signing key).
    # All `required: false` — `secrets: inherit` callers unchanged.
    secrets:
      registry-password:
        description: "External NPM registry token (required when use-ci-token=false)"
        required: false
      MAVEN_CENTRAL_USERNAME:
        description: "Sonatype Central portal username (publish-gradle to maven-central only)"
        required: false
      MAVEN_CENTRAL_PASSWORD:
        description: "Sonatype Central portal token (publish-gradle to maven-central only)"
        required: false
      RELEASE_GPG_PRIVATE_KEY:
        description: "Armored OpenPGP private key used to sign published snapshots (publish-gradle to maven-central only)"
        required: false
      RELEASE_GPG_PASSPHRASE:
        description: "Passphrase for RELEASE_GPG_PRIVATE_KEY (publish-gradle to maven-central only)"
        required: false
      ANDROID_KEYSTORE:
        description: "Base64-encoded Android signing keystore"
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: "Password for ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_ALIAS:
        description: "Alias of the signing key inside ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_PASSWORD:
        description: "Password for the key referenced by ANDROID_KEY_ALIAS"
        required: false
      SECRETS_PROPERTIES_BASE64:
        description: "Base64-encoded Android secrets.properties"
        required: false
      IOS_SIGNING_CERTIFICATE_BASE64:
        description: "Base64-encoded .p12 code-signing certificate"
        required: false
      IOS_SIGNING_CERTIFICATE_PASSPHRASE:
        description: "Passphrase for IOS_SIGNING_CERTIFICATE_BASE64"
        required: false
      PROVISIONING_PROFILE_BASE64:
        description: "Base64-encoded provisioning profile"
        required: false
      KEYCHAIN_PASSWORD:
        description: "Ephemeral macOS keychain password"
        required: false
      XCCONFIG_BASE64:
        description: "Base64-encoded xcconfig file"
        required: false
    outputs:
      npm-package-name:
        description: "Published NPM package name (if published)"
        value: ${{ fromJson(jobs.execute-snapshot-publish-stage.outputs['artifacts-json'] || '{}').npm_package_name }}
      npm-package-version:
        description: "Published NPM package version (if published)"
        value: ${{ fromJson(jobs.execute-snapshot-publish-stage.outputs['artifacts-json'] || '{}').npm_package_version }}
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  # ===== Stage 0: Configuration And Policy =====
  # Single Setup job mirroring release-orchestrator.yml's parse-config shape.
  # Conditionally parses artifacts.yml when `artifacts-config` is set
  # (multi-artefact path); always composes the snapshot control-plane interface
  # consumed by every later stage.
  setup-snapshot:
    name: Setup
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      config-plan-json: ${{ steps.parse.outputs.config-plan-json }}
      snapshot-release-plan-json: ${{ steps.plan.outputs.snapshot-release-plan-json }}
      snapshot-build-stage-plan-json: ${{ steps.plan.outputs.snapshot-build-stage-plan-json }}
      snapshot-publish-stage-plan-json: ${{ steps.plan.outputs.snapshot-publish-stage-plan-json }}
      artifact-transfer-plan-json: ${{ steps.plan.outputs.artifact-transfer-plan-json }}
    steps:
      # Defense-in-depth gate at the top of the snapshot-release pipeline.
      # Every downstream job depends on setup-snapshot via `needs:`, so
      # refusal here aborts the whole snapshot release. reusable-ci is
      # pre-baked in the runtime image; no install step needed.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context
      - name: Checkout caller repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: reusable-ci platform checkout
      - name: Parse artifacts.yml
        id: parse
        run: reusable-ci config parse-artifacts
        env:
          ARTIFACTS_CONFIG: ${{ inputs['artifacts-config'] }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Plan snapshot release
        id: plan
        env:
          CONFIG_PLAN_JSON: ${{ steps.parse.outputs.config-plan-json }}
          PROJECT_TYPE: ${{ inputs['project-type'] }}
          BRANCH: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          JAVA_VERSION: ${{ inputs['java-version'] }}
          NODE_VERSION: ${{ inputs['node-version'] }}
          RUST_TOOLCHAIN: ${{ inputs['rust-toolchain'] }}
          REGISTRY: ${{ inputs.registry }}
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
          NPM_REGISTRY: ${{ inputs['npm-registry'] }}
          PACKAGE_SCOPE: ${{ inputs['package-scope'] }}
          SBOMS: ${{ inputs.sboms }}
          PUBLISH_NPM: ${{ inputs['publish-npm'] }}
          PUBLISH_GRADLE: ${{ inputs['publish-gradle'] }}
          USE_CI_TOKEN: ${{ inputs['use-ci-token'] }}
        run: reusable-ci plan snapshot-release

  # ===== Stage 1: Build =====
  execute-snapshot-build-stage:
    name: Build
    needs: [setup-snapshot]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
      IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSPHRASE: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSPHRASE }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
    uses: ./.github/workflows/release-snapshot-build-stage.yml
    with:
      snapshot-release-plan-json: ${{ needs.setup-snapshot.outputs.snapshot-release-plan-json }}
      snapshot-build-stage-plan-json: ${{ needs.setup-snapshot.outputs.snapshot-build-stage-plan-json }}
      reusable-ci-binary-ref: ${{ inputs['reusable-ci-binary-ref'] }}
      runtime-image: ${{ inputs['runtime-image'] }}
      runtime-image-java: ${{ inputs['runtime-image-java'] }}
      runtime-image-node: ${{ inputs['runtime-image-node'] }}
      runtime-image-go: ${{ inputs['runtime-image-go'] }}
      runtime-image-android: ${{ inputs['runtime-image-android'] }}
      runtime-image-rust: ${{ inputs['runtime-image-rust'] }}
      sboms: ${{ inputs.sboms }}

  # ===== Stage 2: Publish =====
  execute-snapshot-publish-stage:
    name: Publish
    needs: [setup-snapshot, execute-snapshot-build-stage]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      actions: read
      contents: read
      packages: write
    # Most leaves here use only the auto-provided GITHUB_TOKEN. The
    # exceptions are the gradle snapshot legs, which are the sole
    # credentialed jobs in the snapshot flow — see publish-gradle above.
    # Bracket notation is required because GHA expressions parse `-` as
    # subtraction in dotted references.
    secrets:
      registry-password: ${{ secrets['registry-password'] }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
    uses: ./.github/workflows/release-snapshot-publish-stage.yml
    with:
      snapshot-release-plan-json: ${{ needs.setup-snapshot.outputs.snapshot-release-plan-json }}
      reusable-ci-binary-ref: ${{ inputs['reusable-ci-binary-ref'] }}
      runtime-image: ${{ inputs['runtime-image-full'] }}
      runtime-image-node: ${{ inputs['runtime-image-node'] }}
      runtime-image-rust: ${{ inputs['runtime-image-rust'] }}
      runtime-image-go: ${{ inputs['runtime-image-go'] }}
      runtime-image-java: ${{ inputs['runtime-image-java'] }}
      runtime-image-android: ${{ inputs['runtime-image-android'] }}
      snapshot-publish-stage-plan-json: ${{ needs.setup-snapshot.outputs.snapshot-publish-stage-plan-json }}
      artifact-transfer-plan-json: ${{ needs.setup-snapshot.outputs.artifact-transfer-plan-json }}
      build-result-json: ${{ needs.execute-snapshot-build-stage.outputs.result-json }}
      sboms: ${{ inputs.sboms }}

  # ===== Stage 3: Summary =====
  snapshot-release-summary:
    name: Snapshot Summary
    needs:
      - setup-snapshot
      - execute-snapshot-build-stage
      - execute-snapshot-publish-stage
    if: always()
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Generate Snapshot Release Summary
        env:
          # Snapshot release context.
          # `|| '{}'` so an upstream (setup-snapshot) failure — which leaves this
          # output empty — produces an empty PROJECT_TYPE instead of a fromJson
          # template crash. This job is `if: always()`; it must summarize failures.
          PROJECT_TYPE: ${{ fromJson(needs.setup-snapshot.outputs['snapshot-release-plan-json'] || '{}').context.project_type }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REPOSITORY: ${{ github.repository }}

          # Stage results and published artifacts.
          BUILD_STAGE_RESULT_JSON: ${{ needs.execute-snapshot-build-stage.outputs.result-json }}
          PUBLISH_STAGE_RESULT_JSON: ${{ needs.execute-snapshot-publish-stage.outputs.result-json }}
          SNAPSHOT_ARTIFACTS_JSON: ${{ needs.execute-snapshot-publish-stage.outputs.artifacts-json }}
        run: reusable-ci report snapshot-release
