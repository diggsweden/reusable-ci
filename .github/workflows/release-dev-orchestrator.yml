# Release Dev Orchestrator
# 
# Purpose: Lightweight orchestrator for development builds. Provides fast
# feedback loops during development by skipping production security features while
# maintaining basic functionality for testing and development environments.
#
# How it works:
# 1. Triggers on pushes to development branches (develop, feature/*)
# 2. Builds the project (Maven or NPM)
# 3. Creates container image with dev tag
# 4. Optionally publishes NPM package to GitHub Packages (dev tag)
# 5. Skips all production features (SLSA, SBOM, signing, releases)
#
# Security controls:
# - Minimal - focused on speed over security for development
# - Images/packages clearly marked with -dev suffix
# - No production attestations or signing
#
# Registry Authentication:
#   GitHub Packages (default): Uses GITHUB_TOKEN (no secrets needed)
#   Other registries: Set use-ci-token=false and provide registry-password secret
#
# Required Secrets:
#   registry-password: Required when use-ci-token=false (for npmjs.org, etc)
#
# Required Permissions:
#   contents: read   # Read source code
#   packages: write  # Push images to ghcr.io and packages to GitHub Packages
#
# Differences from Production:
#   - Dev tags (0.5.9-dev-feat-name-abc1234) vs version tags
#   - No SLSA attestation
#   - No SBOM generation
#   - No vulnerability scanning
#   - No artifact signing
#   - No GitHub release
#   - ~3-5 min vs ~12-15 min build time
name: Orchestrate Dev Release
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      artifacts-config:
        description: "Path to artifacts.yml. The dev release reads containers and per-artefact configuration from this file."
        required: true
        type: string
      project-type:
        description: "Project type override. Optional — defaults to the first artefact's project-type from artifacts.yml."
        required: false
        default: ""
        type: string
      registry:
        description: "Container registry"
        required: false
        default: "ghcr.io"
        type: string
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      java-version:
        description: "Java version (for maven/gradle)"
        required: false
        default: "25"
        type: string
      node-version:
        description: "Node.js version (for npm)"
        required: false
        default: "24"
        type: string
      rust-toolchain:
        description: "Rust toolchain (for cargo). Ignored when working-directory contains rust-toolchain.toml."
        required: false
        default: "stable"
        type: string
      publish-npm:
        description: "Publish NPM package to registry (npm projects only)"
        required: false
        default: true
        type: boolean
      npm-registry:
        description: "NPM registry URL"
        required: false
        default: "https://npm.pkg.github.com"
        type: string
      package-scope:
        description: "Required NPM package scope (e.g., @diggsweden)"
        required: false
        default: ""
        type: string
      use-ci-token:
        description: "Use GITHUB_TOKEN for NPM authentication (GitHub Packages only)"
        required: false
        default: true
        type: boolean
      scripts-ref:
        description: "Ref for reusable-ci helper scripts checkout (defaults to main)"
        required: false
        default: "main"
        type: string
      runtime-image:
        description: "reusable-ci runtime image. Pin to a digest or version tag; default tracks main."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:main"
        type: string
      sboms:
        description: "SBOMs to generate: all | none | comma-list of build,analyzed-artifact,analyzed-container (default: none for dev speed; set to 'all' to test SBOM wiring)"
        required: false
        default: "none"
        type: string
      publish-container:
        description: "Publish container image to registry (set false for repos without a Containerfile)"
        required: false
        default: true
        type: boolean
    secrets:
      registry-password:
        description: "NPM registry auth token (required when use-ci-token=false)"
        required: false
    outputs:
      npm-package-name:
        description: "Published NPM package name (if published)"
        value: ${{ fromJson(jobs.execute-dev-publish-stage.outputs['artifacts-json'] || '{}').npm_package_name }}
      npm-package-version:
        description: "Published NPM package version (if published)"
        value: ${{ fromJson(jobs.execute-dev-publish-stage.outputs['artifacts-json'] || '{}').npm_package_version }}
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  # ===== Stage 0: Configuration And Policy =====
  # Single Setup job mirroring release-orchestrator.yml's parse-config shape.
  # Conditionally parses artifacts.yml when `artifacts-config` is set
  # (multi-container path); always composes the dev control-plane interface
  # consumed by every later stage.
  setup-dev:
    name: Setup
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      containers: ${{ steps.parse.outputs.containers || '[]' }}
      has-containers: ${{ steps.plan.outputs.has-containers || 'false' }}
      dev-context-json: ${{ steps.interface.outputs.dev-context-json }}
      dev-policy-json: ${{ steps.interface.outputs.dev-policy-json }}
      # Per-ecosystem artifact arrays — fed into the dev build stage so the
      # matrix shape mirrors release-build-stage.yml. cargo is forwarded
      # to publish-stage (sbom-cargo-dev gate), not build-stage (cargo
      # is container-first; no build-stage work).
      maven-artifacts: ${{ steps.parse.outputs.maven-artifacts || '[]' }}
      npm-artifacts: ${{ steps.parse.outputs.npm-artifacts || '[]' }}
      gradle-artifacts: ${{ steps.parse.outputs.gradle-artifacts || '[]' }}
      gradleandroid-artifacts: ${{ steps.parse.outputs.gradleandroid-artifacts || '[]' }}
      xcodeios-artifacts: ${{ steps.parse.outputs.xcodeios-artifacts || '[]' }}
      cargo-artifacts: ${{ steps.parse.outputs.cargo-artifacts || '[]' }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Parse artifacts.yml
        id: parse
        run: reusable-ci config parse-artifacts
        env:
          ARTIFACTS_CONFIG: ${{ inputs['artifacts-config'] }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Compute has-containers for stage gating
        id: plan
        env:
          CONTAINERS: ${{ steps.parse.outputs.containers }}
        run: |
          if [[ -n "$CONTAINERS" && "$CONTAINERS" != "[]" ]]; then
            printf 'has-containers=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has-containers=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve fallback project-type from artifacts.yml
        id: fallback
        env:
          ARTIFACTS: ${{ steps.parse.outputs.artifacts }}
        run: |
          set -euo pipefail
          # When the dev caller didn't pass project-type, take the first
          # artefact's type as a convenience default. Multi-artifact
          # callers should set project-type explicitly.
          fallback=$(printf '%s' "$ARTIFACTS" | jq -r '.[0]["project-type"] // ""')
          printf 'project-type=%s\n' "$fallback" >>"$GITHUB_OUTPUT"
      - name: Compose dev control-plane interface
        id: interface
        env:
          PROJECT_TYPE: ${{ inputs['project-type'] }}
          FALLBACK_PROJECT_TYPE: ${{ steps.fallback.outputs.project-type }}
          BRANCH: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          JAVA_VERSION: ${{ inputs['java-version'] }}
          NODE_VERSION: ${{ inputs['node-version'] }}
          RUST_TOOLCHAIN: ${{ inputs['rust-toolchain'] }}
          REGISTRY: ${{ inputs.registry }}
          SCRIPTS_REF: ${{ inputs['scripts-ref'] }}
          NPM_REGISTRY: ${{ inputs['npm-registry'] }}
          PACKAGE_SCOPE: ${{ inputs['package-scope'] }}
          PUBLISH_NPM: ${{ inputs['publish-npm'] }}
          USE_CI_TOKEN: ${{ inputs['use-ci-token'] }}
        run: reusable-ci plan write-dev-release-interface

  # ===== Stage 1: Build =====
  execute-dev-build-stage:
    name: Build
    needs: [setup-dev]
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/release-dev-build-stage.yml
    with:
      dev-context-json: ${{ needs.setup-dev.outputs.dev-context-json }}
      scripts-ref: ${{ inputs['scripts-ref'] }}
      maven-artifacts: ${{ needs.setup-dev.outputs.maven-artifacts }}
      npm-artifacts: ${{ needs.setup-dev.outputs.npm-artifacts }}
      gradle-artifacts: ${{ needs.setup-dev.outputs.gradle-artifacts }}
      gradleandroid-artifacts: ${{ needs.setup-dev.outputs.gradleandroid-artifacts }}
      xcodeios-artifacts: ${{ needs.setup-dev.outputs.xcodeios-artifacts }}
      sboms: ${{ inputs.sboms }}

  # ===== Stage 2: Publish =====
  execute-dev-publish-stage:
    name: Publish
    needs: [setup-dev, execute-dev-build-stage]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/release-dev-publish-stage.yml
    with:
      dev-context-json: ${{ needs.setup-dev.outputs.dev-context-json }}
      scripts-ref: ${{ inputs['scripts-ref'] }}
      dev-policy-json: ${{ needs.setup-dev.outputs.dev-policy-json }}
      build-result-json: ${{ needs.execute-dev-build-stage.outputs.result-json }}
      sboms: ${{ inputs.sboms }}
      publish-container: ${{ inputs['publish-container'] }}
      # Containers JSON from setup-dev's parse step. Each entry becomes a
      # parallel matrix job in release-dev-publish-stage.yml.
      containers: ${{ needs.setup-dev.outputs.containers }}
      # Per-ecosystem arrays drive the publish-target gates.
      npm-artifacts: ${{ needs.setup-dev.outputs.npm-artifacts }}
      cargo-artifacts: ${{ needs.setup-dev.outputs.cargo-artifacts }}

  # ===== Stage 3: Summary =====
  dev-release-summary:
    name: Summary
    needs:
      - setup-dev
      - execute-dev-build-stage
      - execute-dev-publish-stage
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Generate Dev Release Summary
        env:
          # Dev release context.
          PROJECT_TYPE: ${{ inputs['project-type'] }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_REPOSITORY: ${{ github.repository }}

          # Stage results and published artifacts.
          BUILD_STAGE_RESULT_JSON: ${{ needs.execute-dev-build-stage.outputs.result-json }}
          PUBLISH_STAGE_RESULT_JSON: ${{ needs.execute-dev-publish-stage.outputs.result-json }}
          DEV_ARTIFACTS_JSON: ${{ needs.execute-dev-publish-stage.outputs.artifacts-json }}
        run: reusable-ci summary dev-release
