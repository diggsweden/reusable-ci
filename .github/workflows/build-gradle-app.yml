#
# Gradle JVM Builder
#
# Purpose: Builds Gradle JVM projects — libraries, applications, plugins —
# and uploads their JAR artifacts for subsequent publishing steps (Maven
# Central, container images, etc.).
#
# Android builds are handled by build-gradle-android.yml, which supports
# product flavors, AABs, Google Play artifact naming, and signing. This
# workflow is intentionally Android-free: no Android SDK setup, no APK/AAB
# globbing, no keystore decoding. Routing from artifacts.yml is by
# `project-type: gradle` (here) vs `project-type: gradle-android` (there).
#
# Build Process:
#   1. Set up JDK
#   2. Run the requested Gradle tasks
#   3. Generate a CycloneDX Build SBOM
#   4. Upload JAR artifacts and the build SBOM
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build Gradle
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      gradle-tasks:
        description: "Gradle tasks to run"
        required: false
        default: "assemble"
        type: string
      skip-tests:
        description: "Skip tests during build"
        required: false
        default: false
        type: boolean
      branch:
        description: "Branch to checkout"
        required: false
        default: "main"
        type: string
      artifact-name:
        description: "Logical artifact name for upload naming (defaults to 'gradle-build-artifacts' when empty)"
        required: false
        default: ""
        type: string
      enable-build-sbom:
        description: "Run the cyclonedx plugin step (false skips Build SBOM generation entirely; derived from per-artefact 'sboms' when called from release-build-stage)"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "reusable-ci runtime image carrying JDK + Gradle. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-java-25:v3.0.0"
        type: string
permissions:
  contents: read
jobs:
  build-gradle:
    name: Build Gradle Project
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles(format('{0}/gradle/wrapper/gradle-wrapper.properties', inputs['working-directory']), format('{0}/**/*.gradle*', inputs['working-directory']), format('{0}/**/gradle.properties', inputs['working-directory'])) }}
          restore-keys: gradle-
      - name: Make gradlew executable
        working-directory: ${{ inputs['working-directory'] }}
        run: chmod +x ./gradlew
      - name: Get version info
        id: version-info
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci build gradle metadata
      - name: Run Gradle build
        working-directory: ${{ inputs['working-directory'] }}
        env:
          GRADLE_TASKS: ${{ inputs['gradle-tasks'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
        run: reusable-ci build gradle application
      # Separate Gradle invocation so an SBOM-tool problem surfaces as
      # a distinct, named failure rather than masquerading as a build
      # regression. The step itself is mandatory: when enable-build-sbom
      # is true, an SBOM failure fails the workflow — adopters who want
      # to skip SBOM generation set enable-build-sbom: false explicitly.
      - name: Generate Build SBOM
        id: sbom
        if: ${{ inputs['enable-build-sbom'] }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-gradle-plugin
          CYCLONEDX_GRADLE_VERSION: "3.2.1"
        run: reusable-ci build gradle sbom
      - name: Upload Gradle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-artifacts', inputs['artifact-name']) || 'gradle-build-artifacts' }}
          # Root and subproject JARs. Single-module projects put jars under
          # `build/libs/`; multi-module projects put them under
          # `<subproject>/build/libs/`. Both globs cover the common layouts.
          path: |
            ${{ inputs['working-directory'] }}/build/libs/*.jar
            ${{ inputs['working-directory'] }}/**/build/libs/*.jar
          retention-days: 7
          if-no-files-found: error
      # SBOM artifact is paired with the build artifact name so parallel
      # matrix uploads (release-build-stage dispatches build-gradle per
      # artifact) don't collide on a single fixed SBOM name. Default falls
      # back to `gradle-build-sbom` when `artifact-name` is not overridden.
      # cyclonedx-gradle-plugin 3.x writes to build/reports/bom.json;
      # build/reports/cyclonedx/bom.json is retained for older plugin versions.
      - name: Upload Gradle Build SBOM
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-sbom', inputs['artifact-name']) || 'gradle-build-sbom' }}
          path: |
            ${{ inputs['working-directory'] }}/build/reports/bom.json
            ${{ inputs['working-directory'] }}/**/build/reports/bom.json
            ${{ inputs['working-directory'] }}/build/reports/cyclonedx/bom.json
            ${{ inputs['working-directory'] }}/**/build/reports/cyclonedx/bom.json
          retention-days: 7
          if-no-files-found: warn
      - name: Write SBOM status to step summary
        if: always()
        env:
          ECOSYSTEM: gradle
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: reusable-ci report status build-sbom
      - name: Generate build summary
        env:
          GRADLE_TASKS: ${{ inputs['gradle-tasks'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          VERSION: ${{ steps.version-info.outputs.version }}
          JAVA_VERSION: "25"
        run: reusable-ci report build gradle
