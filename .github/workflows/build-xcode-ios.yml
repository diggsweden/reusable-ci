# Xcode iOS Builder
# 
# Purpose: Builds iOS/macOS applications with Xcode, creating IPA files for
# distribution to TestFlight or App Store.
#
# Build Process:
#   1. Set up Xcode environment and select version
#   2. Configure code signing (certificates and provisioning profiles)
#   3. Archive application using xcodebuild
#   4. Export IPA with specified export method
#   5. Upload IPA artifacts with custom naming
#
# Features:
#   - Multiple Xcode versions support
#   - Configurable schemes and configurations
#   - iOS code signing with certificates and provisioning profiles
#   - IPA export with custom options
#   - Date-stamped artifact names
#   - Custom artifact naming (environment prefixes)
#   - Support for workspace or project files
#
# Outputs:
#   - IPA artifacts with custom names
#   - Examples: "2025-01-15 - demo_store - wallet-app-ios - Wallet Demo - IPA Release"
#
# Required Secrets (for signing):
#   IOS_SIGNING_CERTIFICATE_BASE64: Base64-encoded distribution certificate (.p12)
#   IOS_SIGNING_CERTIFICATE_PASSPHRASE: Certificate passphrase
#   PROVISIONING_PROFILE_BASE64: Base64-encoded provisioning profile
#   KEYCHAIN_PASSWORD: Temporary keychain password
#   EXPORT_OPTIONS_BASE64: Base64-encoded exportOptions.plist (optional, can use vars)
#   XCCONFIG_BASE64: Base64-encoded xcconfig file with build settings overrides (optional)
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build Xcode iOS
on:
  workflow_call:
    inputs:
      # === REQUIRED ===
      xcode-version:
        description: "Xcode version (e.g., 16.1, 15.4)"
        required: true
        type: string
      scheme:
        description: "Xcode scheme to build (e.g., 'Wallet Demo', 'MyApp')"
        required: true
        type: string
      # === XCODE PROJECT CONFIGURATION ===
      workspace:
        description: "Xcode workspace file (e.g., App.xcworkspace). Mutually exclusive with project."
        required: false
        type: string
      project:
        description: "Xcode project file (e.g., App.xcodeproj). Mutually exclusive with workspace."
        required: false
        type: string
      configuration:
        description: "Build configuration (Debug, Release)"
        required: false
        default: "Release"
        type: string
      # === CODE SIGNING ===
      enable-code-signing:
        description: "Enable iOS code signing with certificates and provisioning profiles"
        required: false
        default: true
        type: boolean
      # === EXPORT OPTIONS ===
      export-options-var:
        description: "Name of GitHub variable containing base64-encoded exportOptions.plist"
        required: false
        default: "EXPORT_OPTIONS_BASE64"
        type: string
      # === ARTIFACT NAMING ===
      artifact-name:
        description: "Exact artifact name (overrides auto-generated name if set)"
        required: false
        default: ""
        type: string
      include-tag:
        description: "Include git tag/ref in artifact name"
        required: false
        default: true
        type: boolean
      build-number:
        description: "Build number to set as CURRENT_PROJECT_VERSION"
        required: false
        default: ""
        type: string
      # === XCODEGEN ===
      use-xcodegen:
        description: "Run xcodegen to generate Xcode project before building"
        required: false
        default: false
        type: boolean
      xcodegen-spec:
        description: "Path to xcodegen spec file, relative to working-directory"
        required: false
        default: "project.yml"
        type: string
      # === BUILD CONFIGURATION ===
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch, tag, or SHA to checkout"
        required: false
        default: "main"
        type: string
      destination:
        description: "Build destination (default: generic/platform=iOS)"
        required: false
        default: "generic/platform=iOS"
        type: string
      # === MACOS RUNNER ===
      macos-version:
        description: "macOS runner version (macos-13, macos-14, macos-15, macos-26)"
        required: false
        default: "macos-26"
        type: string
      reusable-ci-binary-ref:
        description: "reusable-ci binary ref/version to install (branch, tag, or SHA). For branch testing, set this to the same reusable-ci revision as runtime image overrides on Linux jobs."
        required: false
        default: "v3.0.0"
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    secrets:
      IOS_SIGNING_CERTIFICATE_BASE64:
        description: "Base64-encoded .p12 code-signing certificate"
        required: false
      IOS_SIGNING_CERTIFICATE_PASSPHRASE:
        description: "Passphrase for IOS_SIGNING_CERTIFICATE_BASE64"
        required: false
      PROVISIONING_PROFILE_BASE64:
        description: "Base64-encoded provisioning profile (.mobileprovision)"
        required: false
      KEYCHAIN_PASSWORD:
        description: "Ephemeral macOS keychain password generated for this build"
        required: false
      XCCONFIG_BASE64:
        description: "Base64-encoded xcconfig file (signing team ID, bundle ID, etc.)"
        required: false
permissions:
  contents: read
jobs:
  build-variants:
    name: Build Xcode iOS
    runs-on: ${{ inputs.macos-version }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - name: Install reusable-ci binary
        # Same-repo action, resolved at the same release tag the consumer
        # already pinned; the tag is created once by the release flow and
        # never force-moved (tag-immutability policy).
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: diggsweden/reusable-ci/.github/actions/install-reusable-ci@v3.0.0
        with:
          ref: ${{ inputs['reusable-ci-binary-ref'] }}

      # Defense-in-depth: refuse PR-context triggers. IOS_SIGNING_*
      # and PROVISIONING_PROFILE_BASE64 land in env for this job;
      # must never run with PR-HEAD code.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context

      - name: Select Xcode version
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install build dependencies
        run: |
          if ! command -v xcbeautify &> /dev/null; then
            brew install xcbeautify
          fi
          printf "✓ xcbeautify installed\n"

      - name: Generate Xcode project with XcodeGen
        if: ${{ inputs['use-xcodegen'] }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          XCODEGEN_SPEC: ${{ inputs['xcodegen-spec'] }}
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec "$XCODEGEN_SPEC"
          printf "✓ Xcode project generated from %s\n" "$XCODEGEN_SPEC"

      - name: Build iOS app
        id: build
        # One step owns the reusable-ci build-logic core (artifact-name →
        # signing → metadata → xcconfig → archive → export → list); the binary
        # threads the xcconfig path internally and branches on
        # --enable-code-signing. The macOS host setup (xcode-select, brew,
        # xcodegen) stays above; only upload wraps this below.
        working-directory: ${{ inputs['working-directory'] }}
        env:
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          INCLUDE_TAG: ${{ inputs['include-tag'] }}
          REF_NAME: ${{ github.ref_name }}
          WORKSPACE: ${{ inputs.workspace }}
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          DESTINATION: ${{ inputs.destination }}
          BUILD_NUMBER: ${{ inputs['build-number'] }}
          ENABLE_CODE_SIGNING: ${{ inputs['enable-code-signing'] }}
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSPHRASE: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSPHRASE }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
          EXPORT_OPTIONS_BASE64: ${{ vars[inputs.export-options-var] }}
          EXPORT_OPTIONS_VAR: ${{ inputs.export-options-var }}
        run: reusable-ci build xcode-ios run

      - name: Upload IPA artifact
        if: ${{ inputs['enable-code-signing'] }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.ipa-name }}
          path: |
            ${{ inputs['working-directory'] }}/build/export/*.ipa
          retention-days: "7"
          if-no-files-found: error

      - name: Upload archive (unsigned builds)
        if: ${{ !inputs['enable-code-signing'] }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.ipa-name }}-archive
          path: |
            ${{ inputs['working-directory'] }}/build/app.xcarchive
          retention-days: "7"
          if-no-files-found: error

      - name: Generate build summary
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          DESTINATION: ${{ inputs.destination }}
          SIGNING: ${{ inputs['enable-code-signing'] }}
          VERSION: ${{ steps.build.outputs.version }}
          BUILD_NUMBER: ${{ steps.build.outputs.build }}
          IPA_NAME: ${{ steps.build.outputs.ipa-name }}
        run: reusable-ci report build xcode
