# Description:
# Runs OpenGrep SAST, emits portable JSON/SARIF/GitLab SAST outputs, and
# uploads SARIF to GitHub Code Scanning when CODE_SCANNING_TOKEN is configured.
#
# Runs inside the reusable-ci runtime container — scripts are baked at
# /opt/reusable-ci/scripts and `opengrep` is on PATH, so this workflow does
# not check out reusable-ci itself.
name: Analyze OpenGrep SAST
on:
  workflow_call:
    inputs:
      opengrep-rules:
        description: "OpenGrep rules path, registry pack, or comma-separated list"
        required: false
        default: "p/default"
        type: string
      fail-on-severity:
        description: "Fail on none, low, medium, or high findings"
        required: false
        default: "high"
        type: string
      runtime-image:
        description: "reusable-ci runtime image. Pin to a digest or version tag for reproducibility; default tracks main."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime:main"
        type: string
permissions:
  contents: read
jobs:
  analysis:
    name: OpenGrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run OpenGrep SAST
        env:
          OPENGREP_CONFIG: ${{ inputs['opengrep-rules'] }}
          OPENGREP_FAIL_ON_SEVERITY: ${{ inputs['fail-on-severity'] }}
          HAS_CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN != '' }}
        run: reusable-ci security run-opengrep
      - name: Enrich OpenGrep SARIF for GitHub
        if: always() && hashFiles('opengrep-results.sarif') != ''
        env:
          SARIF_FILE: opengrep-results.sarif
        run: reusable-ci security enrich-github-sarif
      - name: Archive OpenGrep outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengrep-results
          path: |
            opengrep-results.json
            opengrep-results.txt
            opengrep-results.sarif
            opengrep-results.gitlab-sast.json
          retention-days: 5
          if-no-files-found: ignore
      - name: Save OpenGrep SARIF artifact
        if: always() && hashFiles('opengrep-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-opengrep
          path: opengrep-results.sarif
          retention-days: 5
          if-no-files-found: ignore

  # Publishes SARIF to Code Scanning in a separate job. Marked
  # continue-on-error so a transient Code Scanning API failure doesn't
  # turn the workflow red — the SAST result itself is the primary signal.
  publish-sarif:
    name: Upload SARIF to Code Scanning
    needs: [analysis]
    if: always() && needs.analysis.result != 'cancelled' && needs.analysis.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Download OpenGrep SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-opengrep
        continue-on-error: true
      - name: Upload OpenGrep results to Code Scanning
        if: hashFiles('opengrep-results.sarif') != ''
        continue-on-error: true
        env:
          CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
          SARIF_FILE: opengrep-results.sarif
          SARIF_CATEGORY: opengrep-sast
        run: reusable-ci security upload-sarif
