# NPM Builder
#
# Purpose: Builds NPM projects and uploads artifacts for subsequent publishing steps.
# Separates build logic from registry-specific publishing.
#
# Runs inside the reusable-ci-runtime-node image. Node, npm, corepack, and the
# reusable-ci binary are baked in.
#
# Build Process:
#   1. Install dependencies (npm ci)
#   2. Run tests (if configured)
#   3. Build application (if build script exists)
#   4. Upload built artifacts
#
# Outputs:
#   - Artifacts uploaded as '<artifact-name>-build-artifacts' or 'npm-build-artifacts' for use by publish-* workflows
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build NPM
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      skip-tests:
        description: "Skip tests during build"
        required: false
        default: false
        type: boolean
      branch:
        description: "Branch to checkout"
        required: false
        default: "main"
        type: string
      artifact-name:
        description: "Logical artifact name for upload naming (defaults to 'npm-build-artifacts' when empty)"
        required: false
        default: ""
        type: string
      enable-build-sbom:
        description: "Run the cyclonedx-npm step (false skips Build SBOM generation entirely; derived from per-artefact 'sboms' when called from release-build-stage)"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "reusable-ci runtime image carrying Node. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-node-24:v3.0.0"
        type: string
permissions:
  contents: read
jobs:
  build-npm:
    name: Build NPM Project
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}
      - name: Get version info
        id: version-info
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci build npm metadata
      - name: Install dependencies
        working-directory: ${{ inputs['working-directory'] }}
        run: npm ci
      - name: Run tests
        if: ${{ !inputs['skip-tests'] }}
        working-directory: ${{ inputs['working-directory'] }}
        run: npm test || printf "::warning::No tests configured\n"
      - name: Build application
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci build npm application
      - name: Generate Build SBOM
        id: sbom
        if: ${{ inputs['enable-build-sbom'] }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          # renovate: datasource=npm depName=@cyclonedx/cyclonedx-npm
          CYCLONEDX_VERSION: "4.2.1"
        # One-shot npx runs the pinned version without mutating global state,
        # so a follow-up step can't inadvertently shadow the binary with a
        # different version.
        run: npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_VERSION}" --output-format json --output bom.json
      - name: Write SBOM status to step summary
        if: always()
        env:
          ECOSYSTEM: npm
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: reusable-ci report status build-sbom
      - name: Pack NPM tarball
        id: pack
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci build npm pack
      - name: Upload NPM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-artifacts', inputs['artifact-name']) || 'npm-build-artifacts' }}
          path: ${{ inputs['working-directory'] }}/${{ steps.pack.outputs.tarball }}
          retention-days: 7
          if-no-files-found: error
      # Build SBOM is a separate compliance deliverable; see build-maven.yml
      # for rationale.
      - name: Upload NPM Build SBOM
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] && format('{0}-build-sbom', inputs['artifact-name']) || 'npm-build-sbom' }}
          path: ${{ inputs['working-directory'] }}/bom.json
          retention-days: 7
          if-no-files-found: warn
      - name: Generate build summary
        env:
          PACKAGE_NAME: ${{ steps.version-info.outputs.name }}
          VERSION: ${{ steps.version-info.outputs.version }}
          NODE_VERSION: "24"
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
        run: reusable-ci report build npm
