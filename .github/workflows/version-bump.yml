# Version Bump
# 
# Purpose: Automates version management for releases. Updates version files,
# downloads generated changelogs, and commits all changes back to the repository
# with proper signing.
#
# How it works:
# 1. Detects current version from pom.xml or package.json
# 2. Determines new version based on tag and release type
# 3. Downloads pre-generated changelogs (full and minimal)
# 4. Updates version in project files
# 5. Commits and signs changes with GPG
# 6. Pushes changes back to repository
#
# Security controls:
# - GPG signing of commits for authenticity
# - Uses bot token with limited permissions
# - Validates version format before updating
#
# Required Secrets:
#   GITHUB_TOKEN: For repository operations (or custom bot token)
#   GPG_SECRET_KEY: GPG key for signing commits (optional)
#   GPG_PASSPHRASE: Passphrase for GPG key (optional)
#
# Required Permissions:
#   contents: write  # Update version files and push commits
#
# Changelog Formats:
#   - keepachangelog: Standard Keep a Changelog format
#   - minimal: Simplified format for quick reading
#   - conventional: Based on conventional commits
#
# Version Strategies:
#   - SemVer for stable releases (1.0.0)
#   - Pre-release for beta/rc (1.0.0-beta.1)
#   - SNAPSHOT for development (1.0.0-SNAPSHOT)
name: Bump Version
on:
  workflow_call: # yamllint disable-line rule:truthy
    secrets:
      RELEASE_GPG_PASSPHRASE:
        description: "Passphrase for RELEASE_GPG_PRIVATE_KEY"
        required: false
      RELEASE_GPG_PRIVATE_KEY:
        description: "GPG private key used to sign tags, commits and release artifacts"
        required: false
      RELEASE_TOKEN:
        description: "Token used to create GitHub releases and push release commits"
        required: false
    outputs:
      release-sha:
        description: "Commit SHA the release tag was moved to (the release commit)"
        value: ${{ jobs.bump-version.outputs.release-sha }}
    inputs:
      branch:
        description: "Branch to checkout and work on (default: main)"
        required: false
        default: "main"
        type: string
      project-type:
        description: "Project type: maven, npm, gradle, gradle-android, xcode-ios, cargo"
        required: true
        type: string
      java-version:
        description: "Java version for Maven projects (default: 25)"
        required: false
        default: '25'
        type: string
      node-version:
        description: "Node.js version for NPM projects (default: 24)"
        required: false
        default: '24'
        type: string
      gradle-version-file:
        description: "Path to Gradle version file (default: gradle.properties)"
        required: false
        default: 'gradle.properties'
        type: string
      xcode-version-file:
        description: "Path to Xcode version xcconfig file (default: versions.xcconfig)"
        required: false
        default: 'versions.xcconfig'
        type: string
      working-directory:
        description: "Working directory for the project"
        required: false
        default: '.'
        type: string
      minimal-changelog-config:
        description: "Configuration for the minimal changelog (default: minimal)"
        required: false
        default: ".github-templates/templates/gitcliff/minimal.toml"
        type: string
      file-pattern:
        description: 'Files to commit during version bump (auto-detected based on project-type if not provided)'
        required: false
        type: string
        default: ""
      egress-policy:
        description: "Egress policy for the Harden Runner step (e.g., audit, block)"
        required: false
        default: "audit"
        type: string
      reusable-ci-ref:
        description: "Ref for reusable-ci helper scripts checkout (defaults to main)"
        required: false
        default: "main"
        type: string
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  # Generate full changelog for committing to repository
  generate-full-changelog:
    name: Generate Full Changelog
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/generate-changelog.yml
    with:
      branch: ${{ inputs.branch }}
      upload-as-artifact: true
      changelog-config: ".github-templates/templates/gitcliff/keepachangelog.toml"
      git-cliff-args: "" # Empty means full history
      output-file: "CHANGELOG.md"
      artifact-name: "full-changelog"
      reusable-ci-ref: ${{ inputs['reusable-ci-ref'] }}
  # Generate minimal changelog for commit message
  generate-minimal-changelog:
    name: Generate Minimal Commit Changelog
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/generate-changelog.yml
    with:
      branch: ${{ inputs.branch }}
      upload-as-artifact: true
      changelog-config: ".github-templates/templates/gitcliff/minimal.toml"
      git-cliff-args: "--latest --strip header"
      output-file: "minimal-changelog.txt"
      artifact-name: "minimal-changelog"
      reusable-ci-ref: ${{ inputs['reusable-ci-ref'] }}
  bump-version:
    name: Bump Version and Commit
    needs: [generate-full-changelog, generate-minimal-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-sha: ${{ steps.move-tag.outputs.release-sha }}
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Checkout repository
        id: checkout-release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Checkout .github repository for scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-ref'] }}
          path: .github-shared
          sparse-checkout: scripts
      - name: Validate release tag before version changes
        id: release-base
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ inputs.branch }}
          CHECKOUT_SHA: ${{ steps.checkout-release.outputs.commit }}
        run: bash .github-shared/scripts/validate/tag-commit.sh "$TAG_NAME" "$TARGET_BRANCH" "$CHECKOUT_SHA"
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
      - name: Set project type
        id: project-type
        env:
          PROJECT_TYPE_INPUT: ${{ inputs['project-type'] }}
        run: |
          PROJECT_TYPE="$PROJECT_TYPE_INPUT"
          echo "Project type: ${PROJECT_TYPE}"
          echo "type=${PROJECT_TYPE}" >> "$GITHUB_OUTPUT"
      - name: Set up JDK for Maven
        if: &if_maven_project ${{ steps.project-type.outputs.type == 'maven' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ inputs['java-version'] }}
          distribution: 'temurin'
          # No cache here - we'll cache after version update
      - name: Update Maven version
        if: *if_maven_project
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
          WORKING_DIRECTORY_INPUT: ${{ inputs['working-directory'] }}
        run: |
          bash .github-shared/scripts/version/bump-version.sh \
            maven \
            "${GITHUB_REF_NAME#v}" \
            "$WORKING_DIRECTORY_INPUT"
      - name: Setup Java again with cache after version update
        if: *if_maven_project
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ inputs['java-version'] }}
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ inputs['working-directory'] }}/pom.xml
      - name: Pre-download dependencies with new version
        if: *if_maven_project
        working-directory: ${{ inputs['working-directory'] }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
        run: |
          echo "Pre-downloading dependencies with updated pom.xml..."
          # shellcheck disable=SC2086
          mvn $MAVEN_CLI_OPTS dependency:resolve || true
          # shellcheck disable=SC2086
          mvn $MAVEN_CLI_OPTS dependency:resolve-plugins || true
      - name: Set up Node.js for NPM
        if: &if_npm_project ${{ steps.project-type.outputs.type == 'npm' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs['node-version'] }}
          # No cache here - we'll cache after version update
      - name: Update NPM version
        if: *if_npm_project
        working-directory: ${{ inputs['working-directory'] }}
        env:
          WORKING_DIRECTORY_INPUT: ${{ inputs['working-directory'] }}
        run: |
          bash .github-shared/scripts/version/bump-version.sh \
            npm \
            "${GITHUB_REF_NAME#v}" \
            "$WORKING_DIRECTORY_INPUT"

          echo "Pre-installing dependencies..."
          npm ci --ignore-scripts || npm install --ignore-scripts || true
      - name: Save NPM cache
        if: *if_npm_project
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs['working-directory'])) }}
      - name: Set up JDK for Gradle
        if: &if_gradle_project ${{ steps.project-type.outputs.type == 'gradle' || steps.project-type.outputs.type == 'gradle-android' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ inputs['java-version'] }}
          distribution: 'temurin'
          cache: 'gradle'
      - name: Update Gradle version
        if: *if_gradle_project
        env:
          PROJECT_TYPE_OUTPUT: ${{ steps.project-type.outputs.type }}
          WORKING_DIRECTORY_INPUT: ${{ inputs['working-directory'] }}
          GRADLE_VERSION_FILE_INPUT: ${{ inputs['gradle-version-file'] }}
        run: |
          echo "::group::Update Gradle version"
          bash .github-shared/scripts/version/bump-version.sh \
            "$PROJECT_TYPE_OUTPUT" \
            "${GITHUB_REF_NAME#v}" \
            "$WORKING_DIRECTORY_INPUT" \
            "$GRADLE_VERSION_FILE_INPUT"
          echo "::endgroup::"
      - name: Update Xcode version
        if: ${{ steps.project-type.outputs.type == 'xcode-ios' }}
        env:
          XCODE_VERSION_FILE: ${{ inputs['xcode-version-file'] }}
          WORKING_DIRECTORY_INPUT: ${{ inputs['working-directory'] }}
        run: |
          echo "::group::Update Xcode version"
          bash .github-shared/scripts/version/bump-version.sh \
            xcode-ios \
            "${GITHUB_REF_NAME#v}" \
            "$WORKING_DIRECTORY_INPUT"
          echo "::endgroup::"
      - name: Update Rust version
        # cargo is pre-installed on ubuntu-latest GHA runners (rustup-managed).
        # bump-version.sh handles both Cargo.toml editing and Cargo.lock refresh
        # via `cargo update --workspace`.
        if: ${{ steps.project-type.outputs.type == 'cargo' }}
        env:
          WORKING_DIRECTORY_INPUT: ${{ inputs['working-directory'] }}
        run: |
          echo "::group::Update Rust version"
          bash .github-shared/scripts/version/bump-version.sh \
            cargo \
            "${GITHUB_REF_NAME#v}" \
            "$WORKING_DIRECTORY_INPUT"
          echo "::endgroup::"
      - name: Download Full Changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-changelog
          path: ${{ inputs['working-directory'] }}
      - name: Verify Full Changelog
        working-directory: ${{ inputs['working-directory'] }}
        run: bash .github-shared/scripts/version/validate-full-changelog.sh CHANGELOG.md
      - name: Download Minimal Changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minimal-changelog
          path: ${{ inputs['working-directory'] }}
      - name: Read Minimal Changelog
        id: minimal-changelog
        working-directory: ${{ inputs['working-directory'] }}
        run: bash .github-shared/scripts/version/read-minimal-changelog.sh minimal-changelog.txt
      - name: Determine file pattern
        id: file-pattern
        env:
          EXPLICIT_FILE_PATTERN: ${{ inputs['file-pattern'] }}
          PROJECT_TYPE: ${{ inputs['project-type'] }}
        run: bash .github-shared/scripts/config/get-file-pattern.sh
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          # Checkout already selected the release branch with full history.
          # The action's default git fetch --depth=1 would sever tag ancestry.
          skip_fetch: true
          skip_checkout: true
          commit_message: |
            chore(release): ${{ github.ref_name }}

            ${{ steps.minimal-changelog.outputs.content }}

            [skip ci]
          file_pattern: ${{ steps.file-pattern.outputs.pattern }}
          commit_author: "${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>"
          commit_user_name: ${{ steps.import-gpg.outputs.name }}
          commit_user_email: ${{ steps.import-gpg.outputs.email }}
          commit_options: " --signoff"
      - name: Move tag to current commit
        id: move-tag
        env:
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_BASE_SHA: ${{ steps.release-base.outputs.release-base-sha }}
          RELEASE_TAG_OBJECT: ${{ steps.release-base.outputs.release-tag-object }}
        run: bash .github-shared/scripts/version/move-tag.sh "$TAG_NAME" "$RELEASE_BASE_SHA" "$RELEASE_TAG_OBJECT"
