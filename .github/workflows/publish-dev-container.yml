# Development Container Image Publisher
#
# Purpose: Fast container builds for development and testing. Optimized for quick
# feedback loops by removing production security features while maintaining
# functionality for development environments.
#
# Supported Registries:
# - GitHub Container Registry (ghcr.io) - Default, uses GITHUB_TOKEN
# - Docker Hub (docker.io) - Set use-ci-token=false, provide registry-password
# - Quay.io (quay.io) - Set use-ci-token=false, provide registry-password
# - Any OCI-compatible registry
#
# How it works:
# 1. prep: compute the dev version + image coordinate once.
# 2. build-arch (matrix, fail-fast: false): one job per platform, native runner
#    (linux/amd64 -> ubuntu-24.04, linux/arm64 -> ubuntu-24.04-arm). Each leg
#    builds and pushes by digest only — no tag is applied at this stage.
# 3. merge: assembles the per-arch digests into a single manifest list with
#    `reusable-ci container manifest merge`, applying the dev tag. Single-arch
#    inputs go through the same pipeline (matrix-of-1 + 1-digest merge).
#
# No QEMU. Each runner builds its own architecture natively.
#
# Security controls:
# - Minimal - optimized for speed over security
# - Images clearly marked with -dev suffix
# - Basic authentication to registry
# - Namespace validation (enforces ghcr.io/OWNER/REPO[/<container>] pattern)
# - No production trust plane (no SLSA, no vulnerability scan)
# - SBOM generation is off by default; release-dev-publish-stage can opt into
#   per-arch analyzed-container SBOMs for wiring tests
#
# Registry Authentication:
#   GHCR (default): Uses GITHUB_TOKEN (no secrets needed)
#   Other registries: Set use-ci-token=false and provide registry-password secret
#
# Required Secrets:
#   registry-password: Required when use-ci-token=false (for Docker Hub, Quay, etc)
#
# Required Permissions:
#   contents: read   # Read source code and Containerfile
#   packages: write  # Push images to registry
#
# Differences from Production:
#   Production                    | Development
#   ----------------------------- | ---------------------------
#   Version tags (v1.0.0, latest) | Dev tags (0.5.9-dev-feat-name-abc1234)
#   SLSA attestation              | No attestation
#   SBOM generation               | Off by default; optional analyzed-container
#   Vulnerability scanning        | No scanning
#   Multiple tag strategies       | Branch-aware dev tags
#
# Outputs:
#   image: Full image name (registry/org/repo[/name]:0.5.9-dev-feat-name-abc1234)
#   digest: Manifest list digest
name: Publish Dev Container
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      container-file:
        description: "Containerfile path"
        required: false
        default: "Containerfile"
        type: string
      target:
        description: "Containerfile stage to build for the runtime image. Empty defaults to the last stage. Mirrors publish-container.yml's target input — used by container-first containers (cargo, etc.) where the runtime stage is named explicitly."
        required: false
        default: ""
        type: string
      name:
        description: "Container artefact name from artifacts.yml. When set, the published image becomes <registry>/<repository>/<name>:<dev-tag>, giving each container in a multi-container project its own GitHub Packages page. Empty preserves single-image behaviour (<registry>/<repository>:<dev-tag>). Mirrors publish-container.yml's name input."
        required: false
        default: ""
        type: string
      platforms:
        description: "Comma-separated list of platforms to build. Each platform builds natively on a runner of that architecture (linux/amd64 -> ubuntu-24.04, linux/arm64 -> ubuntu-24.04-arm). No QEMU emulation. Multi-platform inputs split across runners and are merged into a single manifest list. Default linux/amd64 — set linux/amd64,linux/arm64 to opt into native multi-arch."
        required: false
        default: "linux/amd64"
        type: string
      registry:
        description: "Container registry"
        required: false
        default: "ghcr.io"
        type: string
      artifact-types:
        description: "Comma-separated artifact types (maven,npm,gradle,cargo,go)"
        required: true
        type: string
      artifact-types-json:
        description: "JSON array of artifact types. Prefer this over artifact-types for exact membership checks."
        required: false
        default: "[]"
        type: string
      gradle-artifact-name:
        description: "Name of the uploaded Gradle build artifact to download. Default `gradle-build-artifacts`."
        required: false
        default: ""
        type: string
      maven-artifact-name:
        description: "Name of the uploaded Maven build artifact to download. Default `maven-build-artifacts`."
        required: false
        default: ""
        type: string
      npm-artifact-name:
        description: "Name of the uploaded NPM build artifact to download. Default `npm-build-artifacts`."
        required: false
        default: ""
        type: string
      go-artifact-name:
        description: "Name of the artifact-first Go build artifact to download. Empty means container-first Go, where the Containerfile compiles the binary."
        required: false
        default: ""
        type: string
      cargo-artifact-name:
        description: "Name of the artifact-first Cargo build artifact to download. Empty means container-first Cargo, where the Containerfile compiles the binary."
        required: false
        default: ""
        type: string
      build-args:
        description: "Build arguments (KEY=VALUE format, one per line). Mirrors publish-container.yml and is normally derived from containers[].build-args in artifacts.yml."
        required: false
        default: ""
        type: string
      build-secrets:
        description: |
          Newline/comma/space-separated list of BuildKit secret NAMES
          declared in containers[].build-secrets. Values come from the
          REUSABLE_CI_BUILD_SECRETS_JSON envelope secret. Mirrors
          publish-container.yml — see that workflow's input docs and
          docs/artifacts-reference.md for the full contract.
        required: false
        default: ""
        type: string
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch, tag, or SHA to checkout. Empty preserves actions/checkout's event default."
        required: false
        default: ""
        type: string
      extract-binary-target:
        description: "Containerfile stage to extract as a binary CI artefact. When set, a second buildx build runs per arch leg with --output type=local and the result is uploaded as ${name}-binaries-${arch}. Mirrors publish-container.yml's input — used by container-first ecosystems (cargo, go) where binaries are byproducts of the container build."
        required: false
        default: ""
        type: string
      extract-binary-names:
        description: "Comma-separated binary file names expected in the export-binary stage output. Used by suffix-extracted-binaries.sh and the step summary; not enforced."
        required: false
        default: ""
        type: string
      enable-analyzed-container-sbom:
        description: "Run syft on the pushed image and produce per-arch analyzed-container SBOMs. Mirrors publish-container.yml's sibling input. Caller (release-dev-publish-stage) derives this from sboms input."
        required: false
        default: false
        type: boolean
      registry-username:
        description: "Registry username (defaults to github.actor for GHCR)"
        required: false
        type: string
      use-ci-token:
        description: "Use GITHUB_TOKEN for authentication (GHCR only)"
        required: false
        default: true
        type: boolean
      reusable-ci-binary-ref:
        description: "reusable-ci ref/version to install on plain-runner jobs (defaults to v3.0.0)"
        required: false
        default: "v3.0.0"
        type: string
    secrets:
      registry-password:
        description: "Registry password/token (required when use-ci-token=false)"
        required: false
      REUSABLE_CI_BUILD_SECRETS_JSON:
        description: |
          JSON object of {name: value} for every entry in
          containers[].build-secrets. Packed by the caller workflow
          and unpacked into per-secret tmpfiles by `reusable-ci
          container materialize-build-secrets`. Mirrors
          publish-container.yml — see that workflow for the full
          contract.
        required: false
    outputs:
      image:
        description: "Full image name with registry"
        value: ${{ jobs.merge.outputs.image }}
      digest:
        description: "Manifest list digest"
        value: ${{ jobs.merge.outputs.digest }}
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  prep:
    name: Prepare Dev Build${{ inputs.name && format(' ({0})', inputs.name) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image-name: ${{ steps.image.outputs.name }}
      dev-version: ${{ steps.dev-version.outputs.dev-version }}
      platforms-json: ${{ steps.platforms.outputs.platforms-json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      # Defense-in-depth: refuse PR-context triggers — the dev publish
      # path uses GITHUB_TOKEN only, but a future addition of
      # adopter-controlled secrets (or a misconfigured direct caller)
      # would otherwise leak. Mirrors publish-container.yml.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context
      - name: Resolve image name
        id: image
        env:
          CONTAINER_REGISTRY: ${{ inputs.registry }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          CONTAINER_NAME: ${{ inputs.name }}
          # Dev releases push to `<repo>-dev` (e.g. ghcr.io/owner/repo-dev)
          # so they can't be mistaken for production releases in the
          # same GHCR namespace. Dev images carry no cosign signature,
          # no SBOM attestation, no SLSA provenance — the suffix is
          # the visual cue that this is the case. See
          # docs/verification.md#dev-release-trust-model.
          IMAGE_NAME_SUFFIX: "-dev"
        run: reusable-ci container resolve-name
      - name: Generate dev version
        id: dev-version
        run: reusable-ci version generate-dev
      - name: Compute platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: reusable-ci container platform-plan
      - name: Validate Image Namespace
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          REPOSITORY: ${{ github.repository }}
          CONTAINER_REGISTRY: ${{ inputs.registry }}
          ENFORCE_NAMESPACE: ${{ github.repository_owner }}
        run: reusable-ci container validate namespace

  build-arch:
    name: Build${{ inputs.name && format(' ({0})({1})', inputs.name, matrix.platform) || format(' ({0})', matrix.platform) }}
    needs: prep
    # linux/arm64 -> ubuntu-24.04-arm (native ARM hosted runner). Anything else
    # falls through to ubuntu-24.04. No QEMU emulation in either path.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prep.outputs.platforms-json) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      - name: Derive arch suffix
        id: arch
        env:
          PLATFORM: ${{ matrix.platform }}
        run: reusable-ci container platform-plan
      - name: Download Maven artifacts
        if: &if_has_maven_artifacts ${{ contains(fromJson(inputs['artifact-types-json']), 'maven') || contains(format(',{0},', inputs['artifact-types']), ',maven,') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['maven-artifact-name'] || 'maven-build-artifacts' }}
          path: ${{ inputs['working-directory'] }}
      - name: Verify Maven artifacts
        if: *if_has_maven_artifacts
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: |
          reusable-ci container validate artifacts \
            --project-type maven \
            --artifact-dir "$WORKING_DIRECTORY/target" \
            --containerfile "$WORKING_DIRECTORY/$CONTAINER_FILE"
      - name: Download NPM artifacts
        if: &if_has_npm_artifacts ${{ contains(fromJson(inputs['artifact-types-json']), 'npm') || contains(format(',{0},', inputs['artifact-types']), ',npm,') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['npm-artifact-name'] || 'npm-build-artifacts' }}
          path: ${{ inputs['working-directory'] }}
      - name: Extract NPM tarball
        if: *if_has_npm_artifacts
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci container extract-npm-tarball
      - name: Verify NPM artifacts
        if: *if_has_npm_artifacts
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: |
          reusable-ci container validate artifacts \
            --project-type npm \
            --artifact-dir "$WORKING_DIRECTORY/dist" \
            --containerfile "$WORKING_DIRECTORY/$CONTAINER_FILE"
      - name: Download Gradle artifacts
        if: &if_has_gradle_artifacts ${{ contains(fromJson(inputs['artifact-types-json']), 'gradle') || contains(format(',{0},', inputs['artifact-types']), ',gradle,') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['gradle-artifact-name'] || 'gradle-build-artifacts' }}
          path: ${{ inputs['working-directory'] }}
      - name: Verify Gradle artifacts
        if: *if_has_gradle_artifacts
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: |
          reusable-ci container validate artifacts \
            --project-type gradle \
            --artifact-dir "$WORKING_DIRECTORY/build/libs" \
            --containerfile "$WORKING_DIRECTORY/$CONTAINER_FILE"
      - name: Download Go artifacts
        if: &if_has_go_artifacts ${{ (contains(fromJson(inputs['artifact-types-json']), 'go') || contains(format(',{0},', inputs['artifact-types']), ',go,')) && inputs['go-artifact-name'] != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('{0}-go-build-artifacts', inputs['go-artifact-name']) }}
          path: ${{ inputs['working-directory'] }}/dist
      - name: Verify Go artifacts
        if: *if_has_go_artifacts
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: |
          reusable-ci container validate artifacts \
            --project-type go \
            --artifact-dir "$WORKING_DIRECTORY/dist" \
            --containerfile "$WORKING_DIRECTORY/$CONTAINER_FILE"
      - name: Download Cargo artifacts
        if: &if_has_cargo_artifacts ${{ (contains(fromJson(inputs['artifact-types-json']), 'cargo') || contains(format(',{0},', inputs['artifact-types']), ',cargo,')) && inputs['cargo-artifact-name'] != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('{0}-cargo-build-artifacts', inputs['cargo-artifact-name']) }}
          path: ${{ inputs['working-directory'] }}/dist
      - name: Verify Cargo artifacts
        if: *if_has_cargo_artifacts
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: |
          reusable-ci container validate artifacts \
            --project-type cargo \
            --artifact-dir "$WORKING_DIRECTORY/dist" \
            --containerfile "$WORKING_DIRECTORY/$CONTAINER_FILE"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Check registry authentication configuration
        env:
          USE_CI_TOKEN: ${{ inputs['use-ci-token'] }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PASSWORD: ${{ secrets['registry-password'] }}
        run: reusable-ci validate auth registry
      - name: Login to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs['registry-username'] || github.actor }}
          password: ${{ inputs['use-ci-token'] && secrets.GITHUB_TOKEN || secrets['registry-password'] }}
      # Mirrors publish-container.yml's materialize step. The dev path
      # carries no SLSA attestations, but adopter-controlled secrets
      # must still stay out of step inputs and workflow logs.
      - name: Materialize build secrets
        id: build-secrets
        env:
          BUILD_SECRET_NAMES: ${{ inputs['build-secrets'] }}
          REUSABLE_CI_BUILD_SECRETS_JSON: ${{ secrets.REUSABLE_CI_BUILD_SECRETS_JSON }}
        run: reusable-ci container materialize-build-secrets
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ inputs['working-directory'] }}
          file: ${{ inputs['working-directory'] }}/${{ inputs['container-file'] }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          # No tag at this stage. The merge job applies the dev tag once both
          # arches' digests exist, via `reusable-ci container manifest merge`.
          outputs: type=image,name=${{ needs.prep.outputs.image-name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ steps.arch.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.arch.outputs.suffix }}
          build-args: ${{ inputs['build-args'] }}
          secrets: ${{ steps['build-secrets'].outputs['buildx-secrets'] }}
          # Disable all security features for dev builds
          provenance: false
          sbom: false
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: reusable-ci container write-digest-marker
      # Artefact name MUST be unique across the entire workflow run, not
      # just within this workflow_call invocation: when multiple containers
      # are matrix-dispatched (release-dev-publish-stage's artifacts-config
      # path), each container's publish-dev-container call shares
      # github.run_id. Without the per-container scoping, hsm-worker's
      # digests-<run_id>-amd64 would collide with wallet-bff's; one upload
      # silently wins and the merge job downloads the wrong container's
      # digest. Same root cause as the image-name collision in 836cc3f.
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ github.run_id }}-${{ inputs.name || 'container' }}-${{ steps.arch.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
      # Analyzed-container SBOM (per arch). Mirrors publish-container.yml's
      # syft step, minus the attest-sbom call (dev has no SLSA trust plane).
      # Each leg's SBOM is uploaded as a separate artefact so generate-dev-sboms
      # — and downstream release attach — can pick them up by run-id pattern.
      - name: Generate Container SBOMs${{ inputs.name && format(' — {0}', inputs.name) || '' }} (SPDX + CycloneDX)
        if: &if_sbom_enabled ${{ inputs['enable-analyzed-container-sbom'] }}
        env:
          ARTIFACT_TYPES: ${{ inputs['artifact-types'] }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ needs.prep.outputs.image-name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: reusable-ci sbom generate container
      - name: Upload Analyzed-Container SBOMs
        if: *if_sbom_enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyzed-container-sbom-${{ github.run_id }}-${{ inputs.name || 'container' }}-${{ steps.arch.outputs.suffix }}
          path: |
            *-analyzed-container-sbom.spdx.json
            *-analyzed-container-sbom.cyclonedx.json
          retention-days: 7
      # Optional binary extraction (container-first / compiled-native ecosystems).
      # Each native arch leg extracts its own binary directly. No QEMU. Mirrors
      # publish-container.yml's extract-binary path.
      - name: Extract binaries${{ inputs.name && format(' ({0})', inputs.name) || '' }}
        if: &if_extract_binary ${{ inputs['extract-binary-target'] != '' }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ inputs['working-directory'] }}
          file: ${{ inputs['working-directory'] }}/${{ inputs['container-file'] }}
          target: ${{ inputs['extract-binary-target'] }}
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=local,dest=./extracted-binaries
          cache-from: type=gha,scope=build-${{ steps.arch.outputs.suffix }}
          build-args: ${{ inputs['build-args'] }}
          secrets: ${{ steps['build-secrets'].outputs['buildx-secrets'] }}
      - name: Suffix extracted binaries with arch
        if: *if_extract_binary
        env:
          SUFFIX: ${{ steps.arch.outputs.suffix }}
          EXPECTED_NAMES: ${{ inputs['extract-binary-names'] }}
        run: |
          reusable-ci container suffix-extracted-binaries \
            --dir ./extracted-binaries \
            --arch "$SUFFIX" \
            --expected-names "$EXPECTED_NAMES"
      - name: Upload extracted binaries${{ inputs.name && format(' ({0})', inputs.name) || '' }}
        if: *if_extract_binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name != '' && format('{0}-binaries-{1}', inputs.name, steps.arch.outputs.suffix) || format('container-binaries-{0}', steps.arch.outputs.suffix) }}
          path: ./extracted-binaries/**
          retention-days: 7
          if-no-files-found: error

  merge:
    name: Merge Manifest${{ inputs.name && format(' ({0})', inputs.name) || '' }}
    needs: [prep, build-arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.outputs.outputs.image }}
      digest: ${{ steps.outputs.outputs.digest }}
    steps:
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ github.run_id }}-${{ inputs.name || 'container' }}-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Check registry authentication configuration
        env:
          USE_CI_TOKEN: ${{ inputs['use-ci-token'] }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PASSWORD: ${{ secrets['registry-password'] }}
        run: reusable-ci validate auth registry
      - name: Login to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs['registry-username'] || github.actor }}
          password: ${{ inputs['use-ci-token'] && secrets.GITHUB_TOKEN || secrets['registry-password'] }}
      - name: Create manifest list and push
        env:
          IMAGE_NAME: ${{ needs.prep.outputs.image-name }}
          TAGS: ${{ needs.prep.outputs.image-name }}:${{ needs.prep.outputs.dev-version }}
          DIGESTS_DIR: /tmp/digests
        run: reusable-ci container manifest merge
      - name: Inspect manifest
        id: outputs
        env:
          CONTAINER_IMAGE: ${{ needs.prep.outputs.image-name }}:${{ needs.prep.outputs.dev-version }}
        run: reusable-ci container manifest inspect
