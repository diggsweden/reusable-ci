# Go Builder
#
# Builds artifact-first Go binaries and uploads them for release/container
# consumption. Output filenames include the platform suffix so GitHub Release
# assets have unique basenames. Tests remain caller-owned in pull-request
# quality flows, but this release build can optionally run `go test ./...`
# unless skip-tests is set.
name: Build Go
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch to checkout"
        required: false
        default: "main"
        type: string
      artifact-name:
        description: "Artifact name for uploads (defaults to 'go-build-artifacts')"
        required: false
        default: ""
        type: string
      main-package:
        description: "Go package to build"
        required: false
        default: "."
        type: string
      binary-name:
        description: "Output binary name (defaults to artifact-name, then go module basename)"
        required: false
        default: ""
        type: string
      platforms:
        description: "Comma-separated GOOS/GOARCH targets"
        required: false
        default: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64"
        type: string
      build-tags:
        description: "Optional Go build tags"
        required: false
        default: ""
        type: string
      ldflags:
        description: "Additional ldflags appended after reusable-ci version metadata"
        required: false
        default: ""
        type: string
      version:
        description: "Release version for ldflags (defaults to github.ref_name without leading v)"
        required: false
        default: ""
        type: string
      skip-tests:
        description: "Skip go test ./... during release build"
        required: false
        default: false
        type: boolean
      enable-build-sbom:
        description: "Generate CycloneDX Build SBOM with cyclonedx-gomod"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "reusable-ci runtime image carrying Go + cyclonedx-gomod. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-go-1.26:v3.0.0"
        type: string
permissions:
  contents: read
jobs:
  build-go:
    name: Build Go Project
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Cache Go modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles(format('{0}/go.sum', inputs['working-directory']), format('{0}/go.mod', inputs['working-directory'])) }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Resolve build metadata
        id: metadata
        working-directory: ${{ inputs['working-directory'] }}
        env:
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          BINARY_NAME: ${{ inputs['binary-name'] }}
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: reusable-ci build go metadata
      - name: Download dependencies
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: reusable-ci build go download
      - name: Run tests
        if: ${{ !inputs['skip-tests'] }}
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          BUILD_TAGS: ${{ inputs['build-tags'] }}
        run: reusable-ci build go test
      - name: Generate Build SBOM
        id: sbom
        if: ${{ inputs['enable-build-sbom'] }}
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          BINARY_NAME: ${{ steps.metadata.outputs.binary-name }}
        run: reusable-ci build go sbom
      - name: Build binaries
        env:
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
          BINARY_NAME: ${{ steps.metadata.outputs.binary-name }}
          BUILD_TAGS: ${{ inputs['build-tags'] }}
          LD_FLAGS: ${{ inputs.ldflags }}
          MAIN_PACKAGE: ${{ inputs['main-package'] }}
          PLATFORMS: ${{ inputs.platforms }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: reusable-ci build go compile
      - name: Upload Go artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] != '' && format('{0}-go-build-artifacts', inputs['artifact-name']) || 'go-build-artifacts' }}
          path: ${{ inputs['working-directory'] }}/dist/**
          retention-days: 7
          if-no-files-found: error
      - name: Upload Go Build SBOM
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs['artifact-name'] != '' && format('{0}-go-build-sbom', inputs['artifact-name']) || 'go-build-sbom' }}
          path: ${{ inputs['working-directory'] }}/.reusable-ci/go-build-sbom/**/bom.json
          retention-days: 7
          if-no-files-found: warn
      - name: Generate build summary
        env:
          BINARY_NAME: ${{ steps.metadata.outputs.binary-name }}
          MODULE: ${{ steps.metadata.outputs.module }}
          PLATFORMS: ${{ inputs.platforms }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
        run: reusable-ci report build go
