# GitHub Packages Publisher
# 
# Purpose: Publishes artifacts to GitHub Packages registry. Supports Maven and NPM
# from a unified interface. Downloads pre-built artifacts from workflow
# artifacts and publishes them to the appropriate GitHub Packages registry.
#
# Package Types Supported:
#   - maven: Publishes to GitHub Maven registry (maven.pkg.github.com)
#   - npm: Publishes to GitHub NPM registry (npm.pkg.github.com)
#
# Inputs:
#   - artifactSource: Name of workflow artifact containing built packages
#   - packageType: Type of package (maven|npm)
#
# Required Secrets:
#   GITHUB_TOKEN: Automatically provided by GitHub Actions
#
# Required Permissions:
#   contents: read   # Download artifacts
#   packages: write  # Publish to GitHub Packages
#
name: Publish Maven GitHub
on:
  workflow_call:
    inputs:
      artifact-source:
        description: "Name of workflow artifact containing built packages"
        required: true
        type: string
      package-type:
        description: "Package type: maven or npm"
        required: true
        type: string
      java-version:
        description: "Java version"
        required: false
        default: "25"
        type: string
      node-version:
        description: "Node.js version"
        required: false
        default: "24"
        type: string
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      attach-pattern:
        description: "Pattern for artifacts to attach to release"
        required: false
        default: ""
        type: string
      branch:
        description: "Branch to checkout (default: main)"
        required: false
        default: "main"
        type: string
      reusable-ci-binary-ref:
        description: "reusable-ci ref/version to install on plain-runner jobs (defaults to v3.0.0)"
        required: false
        default: "v3.0.0"
        type: string
permissions:
  contents: read
jobs:
  publish-maven-github:
    name: Publish to GitHub Packages (${{ inputs['package-type'] }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Least-privilege: publishes to GitHub Packages via GITHUB_TOKEN
      # (packages: write); no git write performed. Confirm on next release.
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      # Defense-in-depth: refuse PR-context triggers. GITHUB_PACKAGES
      # publish uses the auto GITHUB_TOKEN today; the gate prevents
      # any future secret addition (or a misconfigured direct caller)
      # from leaking via PR-HEAD code.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ inputs['artifact-source'] }}
          ARTIFACT_DIR: ${{ inputs['working-directory'] }}/
        run: reusable-ci artifact download
      # Maven publishing
      - name: Set up JDK for Maven
        if: ${{ inputs['package-type'] == 'maven' }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ inputs['java-version'] }}
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish Maven to GitHub Packages
        if: ${{ inputs['package-type'] == 'maven' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
        run: |
          printf "Publishing to GitHub Packages...\n"
          REPO="${{ github.repository }}"
          # Use mvn deploy to handle multi-module projects correctly
          # shellcheck disable=SC2086
          mvn $MAVEN_CLI_OPTS deploy -DskipTests -DaltDeploymentRepository="github::default::https://maven.pkg.github.com/${REPO}"
      # NPM publishing
      - name: Set up Node.js for NPM
        if: ${{ inputs['package-type'] == 'npm' }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ inputs['node-version'] }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'
      - name: Find NPM tarball
        if: ${{ inputs['package-type'] == 'npm' }}
        id: find-npm-tarball
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci publish npm find-tarball
      - name: Publish NPM to GitHub Packages
        if: ${{ inputs['package-type'] == 'npm' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf "Publishing to GitHub NPM registry...\n"
          npm publish "${{ steps.find-npm-tarball.outputs.tarball }}"
      # Optional: Attach artifacts to GitHub release
      - name: Upload artifacts to release
        if: ${{ inputs['attach-pattern'] != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTACH_PATTERN: ${{ inputs['attach-pattern'] }}
          REF_NAME: ${{ github.ref_name }}
          WORKING_DIRECTORY: ${{ inputs['working-directory'] }}
        run: reusable-ci release attachments upload
      - name: Generate publish summary
        env:
          REPOSITORY: ${{ github.repository }}
          PACKAGE_TYPE: ${{ inputs['package-type'] }}
        run: reusable-ci report publish github-packages
