# GitHub Packages Publisher
# 
# Purpose: Publishes artifacts to GitHub Packages registry. Supports multiple package types
# (Maven, NPM) from a unified interface. Downloads pre-built artifacts from workflow
# artifacts and publishes them to the appropriate GitHub Packages registry.
#
# Package Types Supported:
#   - maven: Publishes to GitHub Maven registry (maven.pkg.github.com)
#   - npm: Publishes to GitHub NPM registry (npm.pkg.github.com)
#
# Gradle projects publish from source through publish-gradle.yml.
#
# Inputs:
#   - artifactSource: Name of workflow artifact containing built packages
#   - packageType: Type of package (maven|npm)
#
# Required Secrets:
#   GITHUB_TOKEN: Automatically provided by GitHub Actions
#
# Required Permissions:
#   contents: read   # Download artifacts
#   packages: write  # Publish to GitHub Packages
#
name: Publish Maven GitHub
on:
  workflow_call:
    inputs:
      artifact-source:
        description: "Name of workflow artifact containing built packages"
        required: true
        type: string
      package-type:
        description: "Package type: maven or npm"
        required: true
        type: string
      java-version:
        description: "Java version"
        required: false
        default: "25"
        type: string
      node-version:
        description: "Node.js version"
        required: false
        default: "24"
        type: string
      npm-tag:
        description: "npm dist-tag to publish under. Empty means: `next` for a prerelease version (npm 11+ refuses to publish a prerelease without an explicit tag), otherwise npm's default `latest`. A prerelease version is never published as `latest`; `latest` on a prerelease fails the publish."
        required: false
        default: ""
        type: string
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      attach-pattern:
        description: "Pattern for artifacts to attach to release"
        required: false
        default: ""
        type: string
      branch:
        description: "Branch to checkout (default: main)"
        required: false
        default: "main"
        type: string
permissions:
  contents: read
jobs:
  publish-maven-github:
    name: Publish to GitHub Packages (${{ inputs['package-type'] }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      # Without this, an unsupported type would skip every publish step and
      # still pass. Gradle projects publish through publish-gradle.yml.
      - name: Check package type
        if: ${{ inputs['package-type'] != 'maven' && inputs['package-type'] != 'npm' }}
        env:
          PACKAGE_TYPE: ${{ inputs['package-type'] }}
        run: |
          printf "::error::Unsupported package-type '%s' (want maven or npm; Gradle uses publish-gradle.yml)\n" "$PACKAGE_TYPE"
          exit 1
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['artifact-source'] }}
          path: ${{ inputs['working-directory'] }}/
      - name: List downloaded artifacts
        working-directory: ${{ inputs['working-directory'] }}
        run: |
          printf "Downloaded artifacts:\n"
          find . -type f -name "*.jar" -path "*/target/*" ! -name "original-*.jar" -exec ls -lh {} \; || printf "No JAR artifacts found\n"
          find . -type f -name "*.tgz" -exec ls -lh {} \; || printf "No NPM tarball found\n"
      # Maven publishing
      - name: Set up JDK for Maven
        if: ${{ inputs['package-type'] == 'maven' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs['java-version'] }}
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish Maven to GitHub Packages
        if: ${{ inputs['package-type'] == 'maven' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
        run: |
          printf "Publishing to GitHub Packages...\n"
          REPO="${{ github.repository }}"
          # Use mvn deploy to handle multi-module projects correctly
          # shellcheck disable=SC2086
          mvn $MAVEN_CLI_OPTS deploy -DskipTests -DaltDeploymentRepository="github::default::https://maven.pkg.github.com/${REPO}"
      # NPM publishing
      - name: Set up Node.js for NPM
        if: ${{ inputs['package-type'] == 'npm' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs['node-version'] }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'
      - name: Publish NPM to GitHub Packages
        if: ${{ inputs['package-type'] == 'npm' }}
        working-directory: ${{ inputs['working-directory'] }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TAG: ${{ inputs['npm-tag'] }}
        run: |
          printf "Publishing to GitHub NPM registry...\n"
          TARBALL=$(find . -maxdepth 1 -name "*.tgz" -type f | head -n 1)
          if [ -z "$TARBALL" ]; then
            printf "::error::No tarball found. build-npm must create and upload a tarball.\n"
            exit 1
          fi
          # Resolve the dist-tag. npm 11+ (bundled with Node 24) refuses to
          # publish a prerelease version without an explicit --tag, and older
          # npm silently made the prerelease `latest`. Read the version from
          # the tarball itself so the decision follows semver, not the git tag.
          # A prerelease is never allowed to become `latest`: consumers that
          # install without a version must only ever get a stable release.
          VERSION=$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          DIST_TAG="$NPM_TAG"
          # Strip semver build metadata (1.0.0+sha.abc) before looking for a
          # prerelease hyphen, so metadata alone never counts as a prerelease.
          if [[ "${VERSION%%+*}" == *-* ]]; then
            if [ -z "$DIST_TAG" ]; then
              DIST_TAG="next"
            elif [ "$DIST_TAG" = "latest" ]; then
              printf "::error::Prerelease version %s cannot be published as 'latest'. Remove npm-tag or set it to next, beta, alpha or rc.\n" "$VERSION"
              exit 1
            fi
          fi
          PUBLISH_ARGS=()
          if [ -n "$DIST_TAG" ]; then
            PUBLISH_ARGS+=(--tag "$DIST_TAG")
          fi
          printf "Publishing tarball: %s (version %s, dist-tag %s)\n" "$TARBALL" "$VERSION" "${DIST_TAG:-latest}"
          npm publish "$TARBALL" "${PUBLISH_ARGS[@]}"
      # Optional: Attach artifacts to GitHub release
      - name: Upload artifacts to release
        if: ${{ inputs['attach-pattern'] != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTACH_PATTERN: ${{ inputs['attach-pattern'] }}
          REF_NAME: ${{ github.ref_name }}
        working-directory: ${{ inputs['working-directory'] }}
        run: |
          for file in $ATTACH_PATTERN; do
            if [ -f "$file" ]; then
              printf "Uploading %s to release...\n" "$file"
              gh release upload "$REF_NAME" "$file" --clobber || printf "::warning::Failed to upload %s\n" "$file"
            fi
          done
      - name: Generate publish summary
        env:
          REPOSITORY: ${{ github.repository }}
          PACKAGE_TYPE: ${{ inputs['package-type'] }}
        run: |
          print_repository_link() {
            local repo
            repo="$REPOSITORY"
            printf "%s **Repository:** [%s](https://github.com/%s/packages)\n" "-" "$repo" "$repo"
          }

          {
            printf "## Published to GitHub Packages 📦\n"
            printf "\n"
            printf "%s **Package Type:** %s\n" "-" "$PACKAGE_TYPE"
            printf "%s **Registry:** GitHub Packages\n" "-"
            print_repository_link
            printf "\n"
            printf "*Published at %s*\n" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
