#
# release-binary
#
# Runs after Self Release completes (workflow_run trigger) on every
# v* tag, OR manually via workflow_dispatch. The two-workflow split
# is intentional: Self Release drives the orchestrator (changelog,
# release notes, GitHub Release creation) while this workflow
# produces the multi-arch binary tarballs and uploads them to the
# already-existing release.
#
# Builds linux/darwin × amd64/arm64 archives via goreleaser and
# uploads them as a GitHub release with checksums.txt plus a Sigstore
# v3 bundle (checksums.txt.bundle). The bundle is produced by cosign
# keyless signing — no long-lived key — and is verified by
# scripts/bootstrap/install-reusable-ci.sh when cosign is on PATH.
#
# Reproducibility: SOURCE_DATE_EPOCH is set from the commit timestamp
# and goreleaser embeds {{.CommitDate}} into the binary's version
# string, making rebuilds of the same tag byte-identical.
name: Release binary
# workflow_run is the standard way to chain after Self Release.
# Authorisation is enforced by the goreleaser job's `if:` gate below
# (conclusion == 'success'), which requires the upstream Self Release
# to have completed successfully — that in turn only runs on signed
# tag pushes. See comment block in the goreleaser job.
on:
  workflow_run:
    workflows: ["Self Release"]
    types: [completed]
    # No `branches:` filter on purpose. Self Release is itself gated
    # to tag pushes (push: tags: [v*.*.*]), so a successful Self
    # Release run implies a tag context. A branches filter here would
    # match against workflow_run.head_branch, which is empty for
    # tag-triggered upstream workflows — silently blocking the
    # production tag-push path. The conclusion check in the goreleaser
    # job's `if:` is the actual gate.
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  goreleaser:
    name: GoReleaser
    # Only run when Self Release succeeded — failed/cancelled
    # orchestrator runs must not publish binaries to a half-built
    # release.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # release upload
      id-token: write # Sigstore keyless OIDC token
      attestations: write # SLSA build-provenance attestation
    steps:
      - name: Harden runner (egress=block, explicit allowlist)
        # release-binary is the highest-trust job in the project —
        # the binary uploaded here is what consumers download. Egress
        # is fully knowable in advance: github + goproxy + sigstore +
        # the goreleaser-action's curl download. Block everything else
        # so a compromised dependency in the Go module graph can't
        # quietly exfiltrate during the build.
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 uploads.github.com:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 ghcr.io:443
      # workflow_run context is safe here: the goreleaser job's `if:` only
      # proceeds when the upstream Self Release succeeded, which itself
      # only triggers on signed tag pushes (`push: tags: [v*.*.*]`). The
      # head_sha is from that tag-push commit, not contributor input.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # workflow_run does not set ref to the tag; pin to the
          # commit SHA the upstream workflow ran on so we tag the
          # right tree.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install cosign
        # goreleaser's signs: block shells out to cosign; install it
        # explicitly with version pinning rather than relying on a
        # runner-provided default. Renovate keeps the pin current.
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: 'v3.0.6'
      - name: Install syft
        # goreleaser's sboms: block shells out to syft. Same pin
        # rationale as cosign — explicit version is reviewable in
        # PR and gets caught by Renovate, not by surprise runner
        # rollouts.
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          syft-version: 'v1.37.0'
      - name: Set SOURCE_DATE_EPOCH from commit
        # Pins the binary's embedded date and the tarball mtimes to
        # the commit timestamp. Without this, two builds of the same
        # tag minutes apart would differ — sabotaging reproducibility
        # before any consumer can verify it.
        run: |
          source_date_epoch="$(git log -1 --format=%ct HEAD)"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest binary build provenance
        # SLSA v1.0 build provenance for every tarball produced by
        # goreleaser. Stored in GitHub's attestation database; the
        # consumer command `gh attestation verify --owner diggsweden
        # <file>` validates a downloaded tarball was built by THIS
        # workflow on a vN.N.N tag. Complements the cosign sign-blob
        # bundle attached to checksums.txt — the two answer different
        # questions: cosign says "the publisher asserts this is the
        # authentic release", provenance says "here's exactly which
        # workflow + commit produced it".
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: 'dist/reusable-ci_*.tar.gz'
