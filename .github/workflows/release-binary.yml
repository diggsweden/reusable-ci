#
# release-binary
#
# Triggered when a v* tag is pushed. Runs goreleaser to build
# linux/darwin × amd64/arm64 archives and publish them as a GitHub
# release with a checksums.txt. SBOM emission + cosign signing are
# deliberately omitted from the bootstrap config (see .goreleaser.yml).
#
# This workflow publishes the tagged reusable-ci release archives used by
# consumers that prefer release assets over building from source.
name: Release binary
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch: {}
permissions:
  contents: write   # release upload
jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      # The goreleaser-action SHA is intentionally left as a version tag
      # — Renovate will pin it on first run alongside the rest of the
      # repo's action-pinning policy. Until then it tracks the v2 line.
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
