# Maven Central Publisher
# 
# Purpose: Publishes Maven library artifacts to Maven Central (Sonatype OSSRH) repository.
# Downloads pre-built artifacts from workflow artifacts (must include sources and javadoc JARs)
# and deploys them to Maven Central with GPG signing.
#
# Requirements:
#   - Artifacts must be built with build-maven.yml using build-type: lib
#   - POM must have required Maven Central metadata (name, description, url, licenses, etc.)
#   - GPG signing credentials configured
#   - Maven Central (Sonatype) credentials configured
#
# Required Secrets:
#   MAVEN_CENTRAL_USERNAME: Sonatype OSSRH username
#   MAVEN_CENTRAL_PASSWORD: Sonatype OSSRH password or token
#   RELEASE_GPG_PRIVATE_KEY: GPG private key for signing
#   RELEASE_GPG_PASSPHRASE: GPG key passphrase
#
# Required Permissions:
#   contents: read   # Download artifacts
#   packages: write  # Backup publish to GitHub Packages
#
name: Publish Maven Central
on:
  workflow_call:
    inputs:
      artifact-source:
        description: "Name of workflow artifact containing built library JARs"
        required: true
        type: string
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      settings-path:
        description: "Path to Maven settings.xml (optional)"
        required: false
        type: string
      profile:
        description: "Maven profile to use for deployment"
        required: false
        default: "central-release"
        type: string
      branch:
        description: "Branch to checkout (default: main)"
        required: false
        default: "main"
        type: string
      runtime-image:
        description: "reusable-ci runtime image carrying JDK + Maven. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-java-25:v3.0.0"
        type: string
    # All secrets are declared `required: false` so callers using
    # `secrets: inherit` continue to work unchanged. The declarations
    # exist for discoverability (downstream adopters can see what
    # this workflow needs without grepping its body) and to let
    # actionlint / `reusable-ci doctor` validate caller bindings.
    secrets:
      MAVEN_CENTRAL_USERNAME:
        description: "Sonatype OSSRH portal username"
        required: false
      MAVEN_CENTRAL_PASSWORD:
        description: "Sonatype OSSRH portal token (NOT the account password)"
        required: false
      RELEASE_GPG_PRIVATE_KEY:
        description: "Armored OpenPGP private key used to sign published artefacts"
        required: false
      RELEASE_GPG_PASSPHRASE:
        description: "Passphrase for RELEASE_GPG_PRIVATE_KEY"
        required: false
permissions:
  contents: read
env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
jobs:
  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      # Least-privilege: Maven Central publishes externally to Sonatype and this
      # job performs no git write (no tag/commit/release). Confirm on next release.
      contents: read
      packages: write
      id-token: write
    steps:
      # Defense-in-depth: refuse PR-context triggers. Maven Central
      # credentials + GPG signing key live in env on this job and must
      # never run with PR-HEAD code. reusable-ci is pre-baked.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.branch }}
        run: reusable-ci platform checkout
      - name: Cache Maven dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles(format('{0}/pom.xml', inputs['working-directory'])) }}
          restore-keys: maven-
      - name: Import GPG key
        id: import-gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: reusable-ci release gpg import
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ inputs['artifact-source'] }}
          ARTIFACT_DIR: ${{ inputs['working-directory'] }}/
        run: reusable-ci artifact download
      - name: Verify artifacts for Maven Central
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci publish maven-central validate-artifacts
      - name: Get version info
        id: version-info
        working-directory: ${{ inputs['working-directory'] }}
        run: reusable-ci build maven metadata
      - name: Deploy to Maven Central
        # Deploy with profile (the profile drives GPG signing via maven-gpg-plugin).
        working-directory: ${{ inputs['working-directory'] }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SETTINGS_PATH: ${{ inputs['settings-path'] }}
          MAVEN_PROFILE: ${{ inputs.profile }}
        run: reusable-ci publish maven-central deploy
      - name: Generate publish summary
        env:
          IS_SNAPSHOT: ${{ steps.version-info.outputs.is-snapshot }}
          VERSION: ${{ steps.version-info.outputs.version }}
        run: reusable-ci report publish maven-central
      - name: Cleanup GPG key
        if: always()
        env:
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
        run: reusable-ci release gpg cleanup
