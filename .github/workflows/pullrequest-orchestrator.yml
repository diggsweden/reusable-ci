# Pull Request Orchestrator
# 
# Purpose: Orchestrates all quality checks for pull requests and pushes, ensuring
# code quality, security, and compliance before merging. Provides a configurable
# set of linters and security scanners that can be toggled per project needs.
#
# How it works:
# 1. Runs on every push to configured branches and on pull requests
# 2. Executes enabled linters in parallel for faster feedback
# 3. Performs security scanning (SAST, dependency checks, secret detection)
# 4. Validates licenses for compliance
# 5. Uploads results to GitHub Code Scanning for visibility
#
# Security controls:
# - Secret detection to prevent credential leaks
# - Dependency vulnerability scanning
# - License compliance validation
# - SAST (Static Application Security Testing)
# - Results uploaded to GitHub Code Scanning (requires CODE_SCANNING_TOKEN secret)
#
# Required Secrets:
#   None required - uses GITHUB_TOKEN for operations
#   Optional: CODE_SCANNING_TOKEN for uploading scan results to Code Scanning
#             (requires code_scanning_alerts:write — GitHub App or fine-grained PAT)
#   Optional: Organization secrets for private package access
#
# Required Permissions:
#   contents: read         # Read source code
#   packages: read         # Access private packages
#   secrets: inherit       # Pass CODE_SCANNING_TOKEN for Code Scanning upload
#
# Configurable Linters:
#   linters.dependencyreview: Dependency vulnerability scan (default: true)
#   linters.publiccodelint: Publiccode.yml validation (default: false)
#   linters.devbasecheck: devbase-check linting — covers commit lint,
#                         SPDX/license lint, and the filesystem checks
#                         that previously had separate toggles
# Configurable Security:
#   security.sast-opengrep: OpenGrep SAST with SARIF/GitLab SAST outputs (default: true, opt out with false)
name: Orchestrate Pull Request
on:
  workflow_call:
    inputs:
      # Project configuration
      project-type:
        description: "Project type: maven, npm, gradle, gradle-android, xcode-ios, cargo, python, go"
        required: true
        type: string
      base-branch:
        description: "Base branch (auto-detects PR target if empty)"
        required: false
        default: ""
        type: string
      # Linter toggles
      linters.dependencyreview:
        description: "Enable dependency vulnerability review"
        required: false
        default: true
        type: boolean
      linters.publiccodelint:
        description: "Enable publiccode.yml linting"
        required: false
        default: false
        type: boolean
      linters.devbasecheck:
        description: "Enable devbase-check linting — covers commit messages, SPDX/license headers, and filesystem checks (default: true)"
        required: false
        default: true
        type: boolean
      linters.swiftformat:
        description: "Enable swift-format (Google Swift Style Guide) for iOS/macOS projects"
        required: false
        default: false
        type: boolean
      linters.swiftlint:
        description: "Enable SwiftLint (comprehensive linting rules) for iOS/macOS projects"
        required: false
        default: false
        type: boolean
      security.sast-opengrep:
        description: "Enable OpenGrep SAST scanning"
        required: false
        default: true
        type: boolean
      security.sast-opengrep-rules:
        description: "OpenGrep rules path, registry pack, or comma-separated list"
        required: false
        default: "p/default"
        type: string
      security.sast-opengrep-fail-on-severity:
        description: "Fail OpenGrep on none, low, medium, or high findings"
        required: false
        default: "high"
        type: string
      scripts-ref:
        description: "Ref for reusable-ci helper scripts checkout (defaults to main)"
        required: false
        default: "main"
        type: string
      runtime-image:
        description: "reusable-ci runtime image. Pin to a digest or version tag; default tracks main."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:main"
        type: string
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  # ===== Stage 0: PR Interface =====
  compose-pr-interface:
    name: Setup
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      pr-context-json: ${{ steps.interface.outputs.pr-context-json }}
      pr-policy-json: ${{ steps.interface.outputs.pr-policy-json }}
    steps:
      - name: Compose PR control-plane interface
        id: interface
        env:
          PROJECT_TYPE: ${{ inputs['project-type'] }}
          BASE_BRANCH: ${{ inputs['base-branch'] }}
          SCRIPTS_REF: ${{ inputs['scripts-ref'] }}
          LINTER_DEPENDENCYREVIEW: ${{ inputs['linters.dependencyreview'] }}
          LINTER_PUBLICCODELINT: ${{ inputs['linters.publiccodelint'] }}
          LINTER_DEVBASECHECK: ${{ inputs['linters.devbasecheck'] }}
          LINTER_SWIFTFORMAT: ${{ inputs['linters.swiftformat'] }}
          LINTER_SWIFTLINT: ${{ inputs['linters.swiftlint'] }}
          SAST_OPENGREP: ${{ inputs['security.sast-opengrep'] }}
          SAST_OPENGREP_RULES: ${{ inputs['security.sast-opengrep-rules'] }}
          SAST_OPENGREP_FAIL_ON_SEVERITY: ${{ inputs['security.sast-opengrep-fail-on-severity'] }}
        run: reusable-ci plan write-pr-interface

  # ===== Stage 1: Quality =====
  execute-quality-stage:
    name: Quality
    needs: [compose-pr-interface]
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/pullrequest-quality-stage.yml
    with:
      pr-context-json: ${{ needs.compose-pr-interface.outputs.pr-context-json }}
      pr-policy-json: ${{ needs.compose-pr-interface.outputs.pr-policy-json }}

  # ===== Summary =====
  pr-summary:
    name: PR Summary
    needs: [compose-pr-interface, execute-quality-stage]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Download quality stage manifests
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-results-pr-quality
          path: .ci-results
      - name: Generate PR summary
        env:
          PROJECT_TYPE: ${{ inputs['project-type'] }}
          QUALITY_STAGE_RESULT_PATH: .ci-results/pr-quality-result.json
          HAS_CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN != '' }}
        run: reusable-ci summary pr
