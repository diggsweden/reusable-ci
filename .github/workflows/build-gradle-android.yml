# Gradle Android Builder
# 
# Purpose: Builds Android applications with multiple product flavors and build types,
# creating separate artifacts for debug/release APKs and AABs with custom naming.
#
# Build Process:
#   1. Set up JDK and Android SDK
#   2. Build specified product flavors and build types
#   3. Optional: Sign release builds
#   4. Upload separate artifacts for each variant with custom names
#
# Features:
#   - Multiple product flavors (demo, prod, staging, etc.)
#   - Multiple build types (debug, release)
#   - AAB (Android App Bundle) generation
#   - Date-stamped artifact names
#   - Custom artifact naming (playstore names, prefixes)
#   - Runtime image with pinned JDK, Gradle, and Android SDK tooling
#   - Android app signing
#
# Outputs:
#   - Separate artifacts per variant with custom names
#   - Examples: "2025-01-15 - testing_store - wallet-app - demo - APK debug"
#
# Required Secrets (for signing):
#   ANDROID_KEYSTORE: Base64-encoded keystore file
#   ANDROID_KEYSTORE_PASSWORD: Keystore password
#   ANDROID_KEY_ALIAS: Key alias
#   ANDROID_KEY_PASSWORD: Key password
#
# Required Permissions:
#   contents: read  # Checkout code
#
name: Build Gradle Android
on:
  workflow_call:
    inputs:
      # === REQUIRED ===
      build-module:
        description: "Gradle module to build (e.g., app)"
        required: true
        type: string
      # === VARIANT CONFIGURATION ===
      product-flavor:
        description: "Product flavor to build (e.g., demo, prod, staging). Leave empty for no flavor."
        required: false
        default: ""
        type: string
      build-types:
        description: "Build types to create (comma-separated: debug,release)"
        required: false
        default: "debug,release"
        type: string
      include-aab:
        description: "Also build AAB (Android App Bundle)"
        required: false
        default: true
        type: boolean
      gradle-tasks:
        description: "Override the derived gradle task list (e.g., 'assembleDemoRelease app:bundleDemoRelease'). When set, takes precedence over product-flavor/build-types/include-aab. Leave empty to derive tasks from those inputs."
        required: false
        default: ""
        type: string
      # === ARTIFACT NAMING ===
      artifact-name:
        description: "Override the derived artifact-name format. When set, the AAB is uploaded under this exact name and APK/SBOM variants get -debug/-release/-sbom suffixes. Used by the orchestrator (release-build-stage.yml) to align uploads with the artifacts.yml `name:` that release-publish-stage forwards to publish-google-play. Leave empty for date/prefix/repo/flavor-derived naming."
        required: false
        default: ""
        type: string
      artifact-name-prefix:
        description: "Prefix for derived artifact names (e.g., testing_store, production). Ignored when artifact-name is set."
        required: false
        default: ""
        type: string
      include-date-stamp:
        description: "Include date in derived artifact names. Ignored when artifact-name is set."
        required: false
        default: true
        type: boolean
      # === BUILD CONFIGURATION ===
      enable-signing:
        description: "Enable Android app signing"
        required: false
        default: false
        type: boolean
      working-directory:
        description: "Working directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch to checkout"
        required: false
        default: "main"
        type: string
      skip-tests:
        description: "Skip tests during build"
        required: false
        default: false
        type: boolean
      enable-build-sbom:
        description: "Run the cyclonedx plugin step (false skips Build SBOM generation entirely; derived from per-artefact 'sboms' when called from release-build-stage)"
        required: false
        default: true
        type: boolean
      runtime-image:
        description: "reusable-ci runtime image carrying JDK + Gradle + Android SDK. Optional override; default uses the matching v3.0.0 runtime image."
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-android-35:v3.0.0"
        type: string
    # All `required: false` — `secrets: inherit` callers unchanged.
    secrets:
      ANDROID_KEYSTORE:
        description: "Base64-encoded Android signing keystore (.jks/.keystore)"
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: "Password for ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_ALIAS:
        description: "Alias of the signing key inside ANDROID_KEYSTORE"
        required: false
      ANDROID_KEY_PASSWORD:
        description: "Password for the key referenced by ANDROID_KEY_ALIAS"
        required: false
      SECRETS_PROPERTIES_BASE64:
        description: "Base64-encoded secrets.properties file (Google Maps API keys, etc.)"
        required: false
    outputs:
      debug-name:
        description: "Uploaded artefact name for the debug APK"
        value: ${{ jobs.build-variants.outputs.debug-name }}
      release-name:
        description: "Uploaded artefact name for the release APK"
        value: ${{ jobs.build-variants.outputs.release-name }}
      aab-name:
        description: "Uploaded artefact name for the release AAB"
        value: ${{ jobs.build-variants.outputs.aab-name }}
      sbom-name:
        description: "Uploaded artefact name for the build SBOM"
        value: ${{ jobs.build-variants.outputs.sbom-name }}
permissions:
  contents: read
jobs:
  build-variants:
    name: Build Gradle Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      debug-name: ${{ steps.build.outputs.debug-name }}
      release-name: ${{ steps.build.outputs.release-name }}
      aab-name: ${{ steps.build.outputs.aab-name }}
      sbom-name: ${{ steps.build.outputs.sbom-name }}
    steps:
      # Defense-in-depth: refuse PR-context triggers. ANDROID_KEYSTORE +
      # SECRETS_PROPERTIES_BASE64 land in env for this job; must never
      # run with PR-HEAD code. reusable-ci is pre-baked.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ inputs.branch }}
          # All branch refs + tags needed: many Android build.gradle.kts files
          # read git history to derive versionCode (e.g.
          # `git rev-list --count origin/main`), which needs refs/remotes/origin/*.
          CHECKOUT_FETCH_ALL_REFS: "true"
        run: reusable-ci platform checkout
      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles(format('{0}/gradle/wrapper/gradle-wrapper.properties', inputs['working-directory']), format('{0}/**/*.gradle*', inputs['working-directory']), format('{0}/**/gradle.properties', inputs['working-directory'])) }}
          restore-keys: gradle-android-
      - name: Build Android project
        id: build
        # One step owns the whole build sequence (artifact-names → keystore →
        # metadata → tasks → secrets.properties → build → SBOM → status); the
        # binary threads the keystore path + tasks internally and branches on
        # --enable-signing, so the same `build gradle-android run` runs on
        # GitLab. Signing passwords stay env vars the gradle build reads; only
        # platform-transport (checkout, cache, upload) wraps it.
        working-directory: ${{ inputs['working-directory'] }}
        env:
          INCLUDE_DATE_STAMP: ${{ inputs['include-date-stamp'] }}
          ARTIFACT_NAME_PREFIX: ${{ inputs['artifact-name-prefix'] }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PRODUCT_FLAVOR: ${{ inputs['product-flavor'] }}
          ARTIFACT_NAME: ${{ inputs['artifact-name'] }}
          ENABLE_SIGNING: ${{ inputs['enable-signing'] }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_TASKS_OVERRIDE: ${{ inputs['gradle-tasks'] }}
          BUILD_TYPES: ${{ inputs['build-types'] }}
          INCLUDE_AAB: ${{ inputs['include-aab'] }}
          BUILD_MODULE: ${{ inputs['build-module'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          ENABLE_BUILD_SBOM: ${{ inputs['enable-build-sbom'] }}
          # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-gradle-plugin
          CYCLONEDX_GRADLE_VERSION: "3.2.1"
        run: reusable-ci build gradle-android run
      - name: Upload Build SBOM
        if: ${{ hashFiles(format('{0}/**/build/reports/bom.json', inputs['working-directory'])) != '' }}
        # Variant-scoped name (from generate-artifact-names.sh) so matrix
        # dispatch in release-build-stage.yml doesn't collide when multiple
        # flavors/modules build in parallel. Distinct from APK/AAB names so
        # the SBOM survives independently of app uploads.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.sbom-name }}
          path: |
            ${{ inputs['working-directory'] }}/build/reports/bom.json
            ${{ inputs['working-directory'] }}/**/build/reports/bom.json
          retention-days: "7"
          if-no-files-found: warn
      - name: List built artifacts
        working-directory: ${{ inputs['working-directory'] }}
        env:
          BUILD_MODULE: ${{ inputs['build-module'] }}
        run: reusable-ci build gradle-android list-artifacts
      - name: Upload Debug APK
        if: contains(inputs['build-types'], 'debug')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.debug-name }}
          path: |
            ${{ inputs['working-directory'] }}/${{ inputs['build-module'] }}/build/outputs/apk/**/debug/*.apk
          retention-days: "7"
          if-no-files-found: warn
      - name: Upload Release APK
        if: contains(inputs['build-types'], 'release')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.release-name }}
          path: |
            ${{ inputs['working-directory'] }}/${{ inputs['build-module'] }}/build/outputs/apk/**/release/*.apk
          retention-days: "7"
          if-no-files-found: warn
      - name: Upload AAB
        if: ${{ inputs['include-aab'] && contains(inputs['build-types'], 'release') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.aab-name }}
          path: |
            ${{ inputs['working-directory'] }}/${{ inputs['build-module'] }}/build/outputs/bundle/**/*.aab
          retention-days: "7"
          if-no-files-found: error
      - name: Generate build summary
        env:
          BUILD_MODULE: ${{ inputs['build-module'] }}
          FLAVOR: ${{ inputs['product-flavor'] }}
          BUILD_TYPES: ${{ inputs['build-types'] }}
          INCLUDE_AAB: ${{ inputs['include-aab'] }}
          SIGNING: ${{ inputs['enable-signing'] }}
          SKIP_TESTS: ${{ inputs['skip-tests'] }}
          VERSION: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version-code }}
          DEBUG_NAME: ${{ steps.build.outputs.debug-name }}
          RELEASE_NAME: ${{ steps.build.outputs.release-name }}
          AAB_NAME: ${{ steps.build.outputs.aab-name }}
          JAVA_VERSION: "25"
          JDK_DIST: "Temurin"
        run: reusable-ci report build android
