name: Dev Release Publish Stage
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      dev-release-plan-json:
        required: true
        type: string
      dev-publish-stage-plan-json:
        required: true
        type: string
      artifact-transfer-plan-json:
        required: true
        type: string
      build-result-json:
        required: true
        type: string
      reusable-ci-binary-ref:
        required: false
        default: "v3.0.0"
        type: string
      runtime-image:
        description: "reusable-ci runtime image (full — generate-dev-sboms needs syft)"
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime:v3.0.0"
        type: string
      runtime-image-node:
        description: "reusable-ci runtime image for dev NPM publish jobs"
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-node-24:v3.0.0"
        type: string
      runtime-image-rust:
        description: "reusable-ci runtime image for Cargo SBOM jobs"
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-rust-stable:v3.0.0"
        type: string
      runtime-image-go:
        description: "reusable-ci runtime image for Go SBOM jobs"
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-go-1.26:v3.0.0"
        type: string
      sboms:
        required: false
        default: "none"
        type: string
      registry-username:
        description: "Container registry username passed to publish-dev-container.yml"
        required: false
        default: ""
        type: string
      use-ci-token:
        description: "Use GITHUB_TOKEN for container registry authentication (GHCR only)"
        required: false
        default: true
        type: boolean
    secrets:
      registry-password:
        required: false
      REUSABLE_CI_BUILD_SECRETS_JSON:
        description: |
          JSON envelope of {name: value} for every name listed in
          containers[].build-secrets; forwarded to
          publish-dev-container.yml. Mirrors release-publish-stage.yml.
        required: false
    outputs:
      stage-ran:
        description: Dev publish stage ran
        value: ${{ jobs.summarize-dev-publish-stage.outputs.stage-ran }}
      stage-result:
        description: Normalized dev publish stage result
        value: ${{ jobs.summarize-dev-publish-stage.outputs.stage-result }}
      result-json:
        description: Dev publish stage result payload
        value: ${{ jobs.summarize-dev-publish-stage.outputs.result-json }}
      artifacts-json:
        description: Published dev artifact payload
        value: ${{ jobs.summarize-dev-publish-stage.outputs.artifacts-json }}
permissions:
  contents: read
jobs:
  # Matrix-dispatches one publish-dev-container.yml invocation per container
  # declared in artifacts.yml. Each leg is its own GHA job (visible separately
  # in the UI) and runs in parallel.
  # fail-fast: false — one container's build failure doesn't kill the others.
  containers:
    name: Build Container Dev - ${{ matrix.container.name }}
    # Build-stage is allowed to be 'skipped' for container-first ecosystems
    # (cargo/go container-first): no artefact-first build runs, but the
    # container itself can still be built here.
    if: ${{ fromJson(inputs['dev-publish-stage-plan-json']).targets.containers.runs && (fromJson(inputs['build-result-json']).result == 'success' || fromJson(inputs['build-result-json']).result == 'skipped') }}
    strategy:
      matrix:
        container: ${{ fromJson(inputs['dev-publish-stage-plan-json']).targets.containers.items }}
      fail-fast: false
    permissions:
      contents: read
      packages: write
    # publish-dev-container uses the auto-provided GITHUB_TOKEN for
    # registry auth; the only adopter-controlled secret it consumes is
    # REUSABLE_CI_BUILD_SECRETS_JSON when containers[].build-secrets is
    # non-empty.
    secrets:
      REUSABLE_CI_BUILD_SECRETS_JSON: ${{ secrets.REUSABLE_CI_BUILD_SECRETS_JSON }}
    uses: ./.github/workflows/publish-dev-container.yml
    with:
      working-directory: ${{ matrix.container.context || '.' }}
      branch: ${{ fromJson(inputs['dev-release-plan-json']).context.branch }}
      container-file: ${{ matrix.container.container_file }}
      registry: ${{ fromJson(inputs['dev-release-plan-json']).context.registry }}
      artifact-types: ${{ join(matrix.container.artifact_types, ',') }}
      artifact-types-json: ${{ toJson(matrix.container.artifact_types) }}
      maven-artifact-name: ${{ matrix.container.maven_artifact_name || '' }}
      npm-artifact-name: ${{ matrix.container.npm_artifact_name || '' }}
      gradle-artifact-name: ${{ matrix.container.gradle_artifact_name || '' }}
      go-artifact-name: ${{ matrix.container.go_artifact_name || '' }}
      cargo-artifact-name: ${{ matrix.container.cargo_artifact_name || '' }}
      target: ${{ matrix.container.target || '' }}
      name: ${{ matrix.container.name }}
      platforms: ${{ matrix.container.platforms || 'linux/amd64' }}
      extract-binary-target: ${{ matrix.container.extract_binary_target || '' }}
      extract-binary-names: ${{ matrix.container.extract_binary_names && join(matrix.container.extract_binary_names, ',') || '' }}
      build-args: ${{ matrix.container.build_args_string || '' }}
      # NAMES list; values come via the workflow secret packed at the
      # adopter's top-level dev-release caller.
      build-secrets: ${{ matrix.container.build_secrets && join(matrix.container.build_secrets, ' ') || '' }}
      # AND of per-container artifacts.yml flag (mirrors prod) AND the
      # orchestrator's dev-only sboms opt-in. Dev keeps `sboms: none` as a
      # fast path even when artifacts.yml would normally produce SBOMs.
      enable-analyzed-container-sbom: ${{ matrix.container.enable_analyzed_container_sbom && (contains(inputs.sboms, 'analyzed-container') || inputs.sboms == 'all') }}
      registry-username: ${{ inputs['registry-username'] }}
      use-ci-token: ${{ inputs['use-ci-token'] }}
      reusable-ci-binary-ref: ${{ inputs['reusable-ci-binary-ref'] }}
  npm:
    name: Publish Dev NPM Package
    if: ${{ fromJson(inputs['dev-publish-stage-plan-json']).targets.npm.runs && fromJson(inputs['build-result-json']).targets.npm == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-dev-npm.yml
    with:
      working-directory: ${{ fromJson(inputs['dev-publish-stage-plan-json']).inputs.npm_working_directory }}
      artifact-source: ${{ fromJson(inputs['dev-publish-stage-plan-json']).inputs.npm_build_artifact_name || 'npm-build-artifacts' }}
      branch: ${{ fromJson(inputs['dev-release-plan-json']).context.branch }}
      registry: ${{ fromJson(inputs['dev-release-plan-json']).context.npm_registry }}
      package-scope: ${{ fromJson(inputs['dev-release-plan-json']).context.package_scope }}
      use-ci-token: ${{ fromJson(inputs['dev-release-plan-json']).policy.use_ci_token }}
      runtime-image: ${{ inputs['runtime-image-node'] }}
    secrets:
      registry-password: ${{ secrets.registry-password }}
  # Container-first cargo's lockfile-derived "build" SBOM. Artefact-first
  # cargo emits its Build SBOM inline in build-cargo.yml at dev-build-stage,
  # so this job only fires for cargo artefacts with build-mode:
  # container-first — same split as the prod release-publish-stage.
  # Gated on the Build layer so dev's default fast path, and dev runs that
  # request only analyzed layers, don't pay for an unused Build SBOM.
  cargo-container-first:
    name: Cargo SBOM Dev
    if: ${{ fromJson(inputs['dev-publish-stage-plan-json']).targets.cargo_container_first.runs }}
    permissions:
      contents: read
    # sbom-cargo uses only auto-provided GITHUB_TOKEN.
    uses: ./.github/workflows/sbom-cargo.yml
    with:
      working-directory: ${{ fromJson(inputs['dev-publish-stage-plan-json']).inputs.cargo_working_directory }}
      branch: ${{ fromJson(inputs['dev-release-plan-json']).context.branch }}
      runtime-image: ${{ inputs['runtime-image-rust'] }}
  go-container-first:
    name: Go SBOM Dev
    # Dev SBOM aggregation follows the same single-project contract as
    # sbom-cargo-dev above. Multi-artifact release SBOM packaging is handled by
    # the production release orchestrator.
    if: ${{ fromJson(inputs['dev-publish-stage-plan-json']).targets.go_container_first.runs }}
    permissions:
      contents: read
    # sbom-go uses only auto-provided GITHUB_TOKEN.
    uses: ./.github/workflows/sbom-go.yml
    with:
      working-directory: ${{ fromJson(inputs['dev-publish-stage-plan-json']).inputs.go_sbom_working_directory }}
      branch: ${{ fromJson(inputs['dev-release-plan-json']).context.branch }}
      artifact-name: ${{ fromJson(inputs['dev-publish-stage-plan-json']).inputs.go_sbom_artifact_name }}
      runtime-image: ${{ inputs['runtime-image-go'] }}
  sbom:
    name: Generate Dev SBOMs
    needs: [containers, cargo-container-first, go-container-first]
    # Wait for the container matrix so container-first extracted binaries are
    # available before analyzed-artifact aggregation. Container-first Build
    # SBOM jobs are also listed in needs; needs[].result == 'skipped' means
    # the job was gated off (non-container-first project or no Build layer
    # requested), which is fine.
    if: ${{ inputs.sboms != 'none' && (fromJson(inputs['build-result-json']).result == 'success' || fromJson(inputs['build-result-json']).result == 'skipped') && !cancelled() && needs.containers.result != 'failure' && needs.cargo-container-first.result != 'failure' && needs.go-container-first.result != 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ fromJson(inputs['dev-release-plan-json']).context.branch }}
          fetch-depth: 0
      - name: Download planned dev artifacts
        env:
          ARTIFACT_TRANSFER_PLAN_JSON: ${{ inputs['artifact-transfer-plan-json'] }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: reusable-ci release download-artifacts
      - name: Resolve artifact SBOM layers
        id: artifact-sbom-layers
        env:
          SBOMS: ${{ inputs.sboms }}
        run: reusable-ci config expand-sboms --format comma --exclude analyzed-container "$SBOMS"
      - name: Generate CISA-layer SBOMs (dev)
        if: ${{ steps.artifact-sbom-layers.outputs.has-layers == 'true' }}
        env:
          PROJECT_TYPE: ${{ fromJson(inputs['dev-release-plan-json']).context.project_type }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          DEV_VERSION: dev-${{ github.sha }}
          LAYERS: ${{ steps.artifact-sbom-layers.outputs.layers }}
        run: >-
          reusable-ci sbom generate all --project-type "$PROJECT_TYPE" --layers "$LAYERS" --version "$DEV_VERSION" --name "$PROJECT_NAME"
      - name: Upload Dev SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-sboms-${{ github.run_id }}
          path: |
            *-sbom.cyclonedx.json
            *-sbom.spdx.json
          retention-days: 7
          if-no-files-found: warn
  summarize-dev-publish-stage:
    name: Summarize Dev Publish Stage
    needs: [containers, npm, cargo-container-first, go-container-first, sbom]
    if: always()
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      stage-ran: ${{ steps.summary.outputs.stage-ran }}
      stage-result: ${{ steps.summary.outputs.stage-result }}
      result-json: ${{ steps.summary.outputs.result-json }}
      artifacts-json: ${{ steps.summary.outputs.artifacts-json }}
    steps:
      - name: Normalize dev publish stage result
        id: summary
        env:
          STAGE_PLAN_JSON: ${{ inputs['dev-publish-stage-plan-json'] }}
          NEEDS_JSON: ${{ toJson(needs) }}
          # Materialise every dynamic field via env so the shell never
          # interpolates an attacker-controlled JSON value directly.
          PROJECT_TYPE: ${{ fromJson(inputs['dev-release-plan-json']).context.project_type }}
          NPM_PACKAGE_NAME: ${{ needs.npm.outputs.package-name }}
          NPM_PACKAGE_VERSION: ${{ needs.npm.outputs.package-version }}
          NPM_PUBLISH_STATUS: ${{ fromJson(inputs['dev-publish-stage-plan-json']).targets.npm.runs && (needs.npm.outputs.publish-status || 'published') || 'skipped' }}
        run: >-
          reusable-ci report status stage --extra "project_type=${PROJECT_TYPE}" --json-output-key artifacts-json --json-field "npm_package_name=${NPM_PACKAGE_NAME}" --json-field "npm_package_version=${NPM_PACKAGE_VERSION}" --json-field "npm_publish_status=${NPM_PUBLISH_STATUS}"
      - name: Upload dev publish stage manifests
        if: always() && hashFiles('.ci-results/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-dev-publish
          path: .ci-results/*.json
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: ignore
