name: Dev Release Publish Stage
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      dev-context-json:
        required: true
        type: string
      dev-policy-json:
        required: true
        type: string
      build-result-json:
        required: true
        type: string
      scripts-ref:
        required: false
        default: "main"
        type: string
      runtime-image:
        description: "reusable-ci runtime image (full — generate-dev-sboms needs syft)"
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime:main"
        type: string
      sboms:
        required: false
        default: "none"
        type: string
      publish-container:
        required: false
        default: true
        type: boolean
      containers:
        description: "JSON array of containers from artifacts.yml. Each entry becomes a parallel matrix job."
        required: false
        default: "[]"
        type: string
      npm-artifacts:
        description: "Per-ecosystem npm artifacts. publish-npm-dev fires when this array is non-empty."
        required: false
        default: "[]"
        type: string
      cargo-artifacts:
        description: "Per-ecosystem cargo artifacts. sbom-cargo-dev fires when this array is non-empty."
        required: false
        default: "[]"
        type: string
    secrets:
      registry-password:
        required: false
    outputs:
      stage-ran:
        description: Dev publish stage ran
        value: ${{ jobs.summarize-dev-publish-stage.outputs.stage-ran }}
      stage-result:
        description: Normalized dev publish stage result
        value: ${{ jobs.summarize-dev-publish-stage.outputs.stage-result }}
      result-json:
        description: Dev publish stage result payload
        value: ${{ jobs.summarize-dev-publish-stage.outputs.result-json }}
      artifacts-json:
        description: Published dev artifact payload
        value: ${{ jobs.summarize-dev-publish-stage.outputs.artifacts-json }}
permissions:
  contents: read
jobs:
  # Matrix-dispatches one publish-dev-container.yml invocation per container
  # declared in artifacts.yml. Each leg is its own GHA job (visible separately
  # in the UI) and runs in parallel.
  # fail-fast: false — one container's build failure doesn't kill the others.
  build-dev-container-matrix:
    name: Build Container Dev - ${{ matrix.container.name }}
    # Build-stage is allowed to be 'skipped' for container-first ecosystems
    # (e.g., cargo): no artefact-first build runs, but the container itself
    # can still be built here.
    if: ${{ inputs.containers != '[]' && inputs['publish-container'] && (fromJson(inputs['build-result-json']).result == 'success' || fromJson(inputs['build-result-json']).result == 'skipped') }}
    strategy:
      matrix:
        container: ${{ fromJson(inputs.containers) }}
      fail-fast: false
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/publish-dev-container.yml
    with:
      working-directory: ${{ matrix.container.context || '.' }}
      container-file: ${{ matrix.container['container-file'] }}
      registry: ${{ matrix.container.registry || fromJson(inputs['dev-context-json']).registry }}
      artifact-types: ${{ join(matrix.container['artifact-types'], ',') }}
      target: ${{ matrix.container.target || '' }}
      name: ${{ matrix.container.name }}
      platforms: ${{ matrix.container.platforms || 'linux/amd64' }}
      extract-binary-target: ${{ matrix.container.extract.binary.target || '' }}
      extract-binary-names: ${{ matrix.container.extract.binary.names && join(matrix.container.extract.binary.names, ',') || '' }}
      # AND of per-container artifacts.yml flag (mirrors prod) AND the
      # orchestrator's dev-only sboms opt-in. Dev keeps `sboms: none` as a
      # fast path even when artifacts.yml would normally produce SBOMs.
      enable-analyzed-container-sbom: ${{ matrix.container['enable-analyzed-container-sbom'] && (contains(inputs.sboms, 'analyzed-container') || inputs.sboms == 'all') }}
      scripts-ref: ${{ inputs['scripts-ref'] }}
  publish-npm-dev:
    name: Publish Dev NPM Package
    if: ${{ inputs['npm-artifacts'] != '[]' && fromJson(inputs['dev-policy-json']).publish_npm && fromJson(inputs['build-result-json']).targets.npm == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-dev-npm.yml
    with:
      working-directory: ${{ fromJson(inputs['dev-context-json']).working_directory }}
      registry: ${{ fromJson(inputs['dev-context-json']).npm_registry }}
      package-scope: ${{ fromJson(inputs['dev-context-json']).package_scope }}
      use-ci-token: ${{ fromJson(inputs['dev-policy-json']).use_ci_token }}
    secrets:
      registry-password: ${{ secrets.registry-password }}
  # Cargo's lockfile-derived "build" SBOM. container-first means cargo has
  # no build-stage; the SBOM and its corresponding container ship together,
  # so the SBOM lives in publish-stage alongside the container build.
  # Mirrors release-publish-stage.yml's `sbom-cargo` shape but without the
  # cargo-artifacts matrix (dev runs single-project, not multi-cargo).
  # Gated on sboms != 'none' so dev's default fast path doesn't pay for
  # SBOM generation it won't consume.
  sbom-cargo-dev:
    name: Cargo SBOM Dev
    if: ${{ inputs['cargo-artifacts'] != '[]' && inputs.sboms != 'none' }}
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/sbom-cargo.yml
    with:
      working-directory: ${{ fromJson(inputs['dev-context-json']).working_directory }}
      branch: ${{ fromJson(inputs['dev-context-json']).branch }}
  generate-dev-sboms:
    name: Generate Dev SBOMs
    needs: [sbom-cargo-dev]
    # Wait for cargo's build SBOM (when applicable) to upload before
    # downloading and aggregating. needs[].result == 'skipped' means the
    # cargo job was gated off (non-cargo project or sboms=none); that's
    # fine — generate-dev-sboms then aggregates whatever artefact-first
    # builders produced.
    if: ${{ inputs.sboms != 'none' && (fromJson(inputs['build-result-json']).result == 'success' || fromJson(inputs['build-result-json']).result == 'skipped') && !cancelled() && needs.sbom-cargo-dev.result != 'failure' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Resolve upload names via the same script prod uses
      # (release-create-github.yml). Single source of truth for
      # ecosystem -> upload-name mapping; new ecosystems extend
      # resolve-artifact-name.sh and dev/prod both pick them up.
      - name: Determine artefact upload names
        id: artefact-names
        env:
          PROJECT_TYPE: ${{ fromJson(inputs['dev-context-json']).project_type }}
        run: reusable-ci release resolve-artifact-name "$PROJECT_TYPE" >> "$GITHUB_OUTPUT"
      # Download by exact name (mirrors prod). Avoids pulling
      # multi-arch noise (per-arch digests, .dockerbuild auto-uploads,
      # per-arch container SBOMs) that an unfiltered download would
      # try to pull.
      - name: Download build artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ steps.artefact-names.outputs.name }}
          path: ./release-artifacts
      # Skip the second download for cargo (name == sbom-name) and
      # when the build layer wasn't requested.
      - name: Download Build SBOM
        if: ${{ (contains(inputs.sboms, 'build') || inputs.sboms == 'all') && steps.artefact-names.outputs.sbom-name != steps.artefact-names.outputs.name }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ steps.artefact-names.outputs.sbom-name }}
          path: ./release-artifacts
      # Pull container-extracted binaries (cargo, go) so the analyzed-artifact
      # layer can scan the actual produced binaries. publish-dev-container.yml
      # uploads these as ${name}-binaries-${arch}; pattern-match to grab every
      # leg without enumerating containers/arches here.
      - name: Download extracted container binaries
        if: ${{ contains(inputs.sboms, 'analyzed-artifact') || inputs.sboms == 'all' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: "*-binaries*"
          path: ./release-artifacts/binaries
          merge-multiple: true
      - name: Generate CISA-layer SBOMs (dev)
        env:
          PROJECT_TYPE: ${{ fromJson(inputs['dev-context-json']).project_type }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          DEV_VERSION: dev-${{ github.sha }}
          SBOMS: ${{ inputs.sboms }}
        run: |
          # analyzed-container is scanned at container-publish time, not here —
          # feed generate-sboms.sh only the artifact-level layers.
          layers=$(reusable-ci config expand-sboms \
            --format comma --exclude analyzed-container "$SBOMS")
          if [[ -n "$layers" ]]; then
            reusable-ci sbom generate \
              --project-type "$PROJECT_TYPE" \
              --layers "$layers" \
              --version "$DEV_VERSION" \
              --name "$PROJECT_NAME"
          else
            printf "No artifact-level SBOM layers requested (sboms=%s).\n" "$SBOMS"
          fi
      - name: Upload Dev SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-sboms-${{ github.run_id }}
          path: |
            *-sbom.cyclonedx.json
            *-sbom.spdx.json
          retention-days: 7
          if-no-files-found: warn
  summarize-dev-publish-stage:
    name: Summarize Dev Publish Stage
    needs: [build-dev-container-matrix, publish-npm-dev, sbom-cargo-dev, generate-dev-sboms]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      stage-ran: ${{ steps.summary.outputs.stage-ran }}
      stage-result: ${{ steps.summary.outputs.stage-result }}
      result-json: ${{ steps.summary.outputs.result-json }}
      artifacts-json: ${{ steps.summary.outputs.artifacts-json }}
    steps:
      - name: Normalize dev publish stage result
        id: summary
        env:
          PROJECT_TYPE: ${{ fromJson(inputs['dev-context-json']).project_type }}
          PUBLISH_NPM: ${{ fromJson(inputs['dev-policy-json']).publish_npm }}
          BUILD_DEV_CONTAINER_RESULT: ${{ needs.build-dev-container-matrix.result }}
          PUBLISH_NPM_DEV_RESULT: ${{ needs.publish-npm-dev.result }}
          CARGO_SBOM_DEV_RESULT: ${{ needs.sbom-cargo-dev.result }}
          GENERATE_DEV_SBOMS_RESULT: ${{ needs.generate-dev-sboms.result }}
          NPM_PACKAGE_NAME: ${{ needs.publish-npm-dev.outputs.package-name }}
          NPM_PACKAGE_VERSION: ${{ needs.publish-npm-dev.outputs.package-version }}
          NPM_PUBLISH_STATUS: ${{ needs.publish-npm-dev.outputs.publish-status }}
        run: reusable-ci summary dev-publish-stage-result
      - name: Upload dev publish stage manifests
        if: always() && hashFiles('.ci-results/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-dev-publish
          path: .ci-results/*.json
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: ignore
