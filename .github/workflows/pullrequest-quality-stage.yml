name: Pull Request Quality Stage
on:
  workflow_call:
    inputs:
      pr-context-json:
        required: true
        type: string
      pr-policy-json:
        required: true
        type: string
      runtime-image:
        description: "reusable-ci runtime image for the status/summary jobs (base is sufficient)"
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:main"
        type: string
permissions:
  contents: read
jobs:
  dependency-review:
    name: Dependency Review
    if: ${{ fromJson(inputs['pr-policy-json']).dependencyreview }}
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/security-dependency-review.yml
  sast-opengrep:
    name: OpenGrep SAST
    if: ${{ fromJson(inputs['pr-policy-json']).sastopengrep }}
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/security-opengrep.yml
    with:
      opengrep-rules: ${{ fromJson(inputs['pr-context-json']).sast_opengrep_rules }}
      fail-on-severity: ${{ fromJson(inputs['pr-context-json']).sast_opengrep_fail_on_severity }}
  publiccode-lint:
    name: Publiccode Lint
    if: ${{ fromJson(inputs['pr-policy-json']).publiccodelint }}
    uses: ./.github/workflows/lint-publiccode.yml
    with:
      runtime-image: ${{ inputs['runtime-image'] }}
  devbase-check-lint:
    name: Devbase Check
    if: ${{ fromJson(inputs['pr-policy-json']).devbasecheck }}
    permissions:
      contents: read
    uses: ./.github/workflows/lint-devbase.yml
  swift-lint:
    name: Swift Lint
    if: ${{ fromJson(inputs['pr-policy-json']).swift }}
    permissions:
      contents: read
    uses: ./.github/workflows/lint-swift.yml
    with:
      enable-swiftformat: ${{ fromJson(inputs['pr-policy-json']).swiftformat }}
      enable-swiftlint: ${{ fromJson(inputs['pr-policy-json']).swiftlint }}
  quality-status:
    name: Status
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    if: always()
    needs: [dependency-review, sast-opengrep, publiccode-lint, devbase-check-lint, swift-lint]
    steps:
      - name: Check quality results
        env:
          CHECK_DEPENDENCYREVIEW: Dependency Review|${{ fromJson(inputs['pr-policy-json']).dependencyreview }}|${{ needs.dependency-review.result }}
          CHECK_SASTOPENGREP: OpenGrep SAST|${{ fromJson(inputs['pr-policy-json']).sastopengrep }}|${{ needs.sast-opengrep.result }}
          CHECK_PUBLICCODELINT: Publiccode Lint|${{ fromJson(inputs['pr-policy-json']).publiccodelint }}|${{ needs.publiccode-lint.result }}
          CHECK_DEVBASECHECK: Devbase Check|${{ fromJson(inputs['pr-policy-json']).devbasecheck }}|${{ needs.devbase-check-lint.result }}
          CHECK_SWIFT: Swift Lint|${{ fromJson(inputs['pr-policy-json']).swift }}|${{ needs.swift-lint.result }}
        run: |
          reusable-ci summary quality-check-status \
            "$CHECK_DEPENDENCYREVIEW" \
            "$CHECK_SASTOPENGREP" \
            "$CHECK_PUBLICCODELINT" \
            "$CHECK_DEVBASECHECK" \
            "$CHECK_SWIFT"
  summarize-quality-stage:
    name: Summary
    needs: [dependency-review, sast-opengrep, publiccode-lint, devbase-check-lint, swift-lint, quality-status]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    steps:
      - name: Normalize PR quality stage result
        id: summary
        env:
          DEPENDENCYREVIEW_ENABLED: ${{ fromJson(inputs['pr-policy-json']).dependencyreview }}
          SASTOPENGREP_ENABLED: ${{ fromJson(inputs['pr-policy-json']).sastopengrep }}
          PUBLICCODELINT_ENABLED: ${{ fromJson(inputs['pr-policy-json']).publiccodelint }}
          DEVBASECHECK_ENABLED: ${{ fromJson(inputs['pr-policy-json']).devbasecheck }}
          SWIFT_ENABLED: ${{ fromJson(inputs['pr-policy-json']).swift }}
          DEPENDENCYREVIEW_RESULT: ${{ needs.dependency-review.result }}
          SASTOPENGREP_RESULT: ${{ needs.sast-opengrep.result }}
          PUBLICCODELINT_RESULT: ${{ needs.publiccode-lint.result }}
          DEVBASECHECK_RESULT: ${{ needs.devbase-check-lint.result }}
          SWIFT_RESULT: ${{ needs.swift-lint.result }}
        run: reusable-ci summary pr-quality-stage-result
      - name: Upload quality stage manifests
        if: always() && hashFiles('.ci-results/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-pr-quality
          path: .ci-results/*.json
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: ignore
