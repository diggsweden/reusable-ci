# Description:
# Default PR lint surface — runs `nanolinter verify` against the consumer
# repository and uploads nanolinter's security findings (OpenGrep SAST, OSV
# dependency scan, secrets, trivy-fs) to GitHub Code Scanning as SARIF.
#
# Runs inside a nanolinter FLAVOUR image (e.g. codeberg.org/itiquette/nanolinter:java),
# which bakes nanolinter + its whole check toolchain (xmllint, opengrep,
# osv-scanner, java checkstyle/pmd/spotbugs, …). reusable-ci is installed at
# runtime via the image's mise (github: backend) only for the SARIF
# enrich/upload glue. The image is non-root and its $HOME / /opt/mise are
# read-only, so the reusable-ci install redirects HOME + XDG_* + MISE_*_DIR to a
# workspace-temp dir (it doesn't need the baked tools, so the redirect is safe).
#
# Note: the reusable-ci install here is TLS-verified (mise github:), not
# cosign-identity-pinned — acceptable for the lint helper (it only processes
# SARIF). Consumers that *run* reusable-ci pipelines install it cosign-verified
# via install-reusable-ci.sh elsewhere.
#
# How to use:
# 1. Ensure your project has a nanolinter.toml verify plan and sets
#    `nanolinter-image` to the flavour matching its ecosystem.
# 2. It is called automatically by pullrequest-orchestrator.yml when
#    linters.nanolinter is enabled (the default).
name: Lint Nanolinter
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      nanolinter-image:
        description: "nanolinter flavour image to lint in (pin by @sha256). e.g. codeberg.org/itiquette/nanolinter:java"
        required: false
        default: "codeberg.org/itiquette/nanolinter:full"
        type: string
      reusable-ci-binary-ref:
        description: "reusable-ci version installed (via mise github:) for the SARIF enrich/upload commands"
        required: false
        default: "v3.0.0"
        type: string
      upload-sarif:
        description: "Upload nanolinter's security SARIF to GitHub Code Scanning"
        required: false
        default: true
        type: boolean
      sarif-category:
        description: "Code Scanning category label for the nanolinter security SARIF"
        required: false
        default: "nanolinter-security"
        type: string
    secrets:
      CODE_SCANNING_TOKEN:
        description: "Token with security-events:write for SARIF upload"
        required: false
permissions:
  contents: read
jobs:
  nanolinter-lint:
    name: Nanolinter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs['nanolinter-image'] }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # git binary (baked in the image) — not actions/checkout (a Node JS
        # action; the image ships no node). Full history (no --depth) so
        # nanolinter's git-based checks (commit range, version-control) have the
        # merge-base. Token auth via http.extraheader keeps the credential out
        # of the remote URL. safe.directory covers the host-UID-vs-container-UID
        # ownership mismatch on the workspace mount.
        env:
          GIT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "${SERVER_URL}/${REPO}.git"
          hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$hdr" fetch --prune origin "$SHA"
          if [ -n "${BASE_REF:-}" ]; then
            git -c http.extraheader="$hdr" fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          git checkout -q --detach "$SHA"
      - name: Run nanolinter (gate + security SARIF)
        id: lint
        # nanolinter + every check tool are baked in the flavour image (default
        # env → MISE_DATA_DIR=/opt/mise shims). --report sarif-security is a
        # report filter only: verify still runs the full plan and gates on every
        # check; the SARIF carries just the CheckClass::Security findings.
        run: |
          set +e
          nanolinter verify --report sarif-security --out nanolinter-security.sarif
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install reusable-ci (SARIF tooling, via mise github)
        # Only the SARIF glue. The image's $HOME and /opt/mise are read-only for
        # the non-root user, so redirect HOME + XDG_* + MISE_*_DIR to a writable
        # temp. github: avoids the baked /opt/mise tools, so the redirect is
        # safe (this step doesn't use them). Copies the binary onto PATH for the
        # enrich/upload steps. TLS-verified (not cosign) — see the file header.
        if: always() && inputs.upload-sarif && hashFiles('nanolinter-security.sarif') != ''
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          BINARY_REF: ${{ inputs.reusable-ci-binary-ref }}
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:-/tmp}/rcinstall"
          mkdir -p "$base"/cache "$base"/config "$base"/data "$base"/mise "$base"/misecache "$base"/state "$base"/bin
          export HOME="$base" \
                 XDG_CACHE_HOME="$base/cache" XDG_CONFIG_HOME="$base/config" XDG_DATA_HOME="$base/data" \
                 MISE_DATA_DIR="$base/mise" MISE_CACHE_DIR="$base/misecache" MISE_STATE_DIR="$base/state"
          mise use -g "github:diggsweden/reusable-ci@${BINARY_REF}"
          install -m0755 "$(mise which reusable-ci)" "$base/bin/reusable-ci"
          printf '%s\n' "$base/bin" >> "$GITHUB_PATH"
          "$base/bin/reusable-ci" --version
      - name: Enrich nanolinter SARIF for GitHub dedupe
        if: always() && inputs.upload-sarif && hashFiles('nanolinter-security.sarif') != ''
        env:
          SARIF_FILE: nanolinter-security.sarif
        run: reusable-ci security report enrich-sarif
      - name: Save nanolinter SARIF artifact
        if: always() && hashFiles('nanolinter-security.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-nanolinter
          path: nanolinter-security.sarif
          retention-days: 5
          if-no-files-found: ignore
      - name: Upload nanolinter SARIF to Code Scanning
        # Uses CODE_SCANNING_TOKEN (not GITHUB_TOKEN); continue-on-error so a
        # transient Code Scanning API failure doesn't turn the lint gate red.
        if: always() && inputs.upload-sarif && hashFiles('nanolinter-security.sarif') != ''
        continue-on-error: true
        env:
          CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
          SARIF_FILE: nanolinter-security.sarif
          SARIF_CATEGORY: ${{ inputs.sarif-category }}
        run: reusable-ci security report upload-sarif
      - name: Gate on nanolinter result
        if: steps.lint.outputs.status != '0'
        run: |
          printf '::error::nanolinter verify failed (status %s)\n' "${{ steps.lint.outputs.status }}"
          exit 1
