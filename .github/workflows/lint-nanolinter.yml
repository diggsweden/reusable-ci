# Description:
# Default PR lint surface — runs `nanolinter verify` against the consumer
# repository and uploads nanolinter's security findings (OpenGrep SAST, OSV
# dependency scan, secrets, trivy-fs) to GitHub Code Scanning as SARIF.
#
# Runs inside a nanolinter FLAVOUR image (e.g. codeberg.org/itiquette/nanolinter:java),
# which bakes nanolinter + its whole check toolchain (xmllint, opengrep,
# osv-scanner, java checkstyle/pmd/spotbugs, …) plus curl + cosign. reusable-ci
# is installed at runtime via the canonical cosign-verified bootstrap installer
# (scripts/bootstrap/install-reusable-ci.sh) only for the SARIF enrich/upload
# glue — the same fail-closed, identity-pinned install path the rest of the suite
# uses.
#
# Non-root image notes: the flavour image runs as a non-root user, and in a
# GitHub job $GITHUB_WORKSPACE and RUNNER_TEMP are runner-owned mounts the user
# can't write, $HOME is the read-only /github/home mount, AND the runner
# file-command files ($GITHUB_ENV/$GITHUB_OUTPUT/$GITHUB_PATH, all under
# RUNNER_TEMP) are unwritable too. So this job touches none of them: it does the
# checkout, lint, SARIF and reusable-ci install under static paths in the
# container-writable /tmp, redirects HOME/XDG there (cosign's sigstore cache
# needs a writable HOME), and shares state between steps via a status file + an
# absolute binary path instead of step outputs / env exports / PATH appends.
# No root, no workspace writes.
#
# How to use:
# 1. Ensure your project has a nanolinter.toml verify plan and sets
#    `nanolinter-image` to the flavour matching its ecosystem.
# 2. It is called automatically by pullrequest-orchestrator.yml when
#    linters.nanolinter is enabled (the default).
name: Lint Nanolinter
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      nanolinter-image:
        description: "nanolinter flavour image to lint in (pin by @sha256). e.g. codeberg.org/itiquette/nanolinter:java"
        required: false
        default: "codeberg.org/itiquette/nanolinter:full"
        type: string
      reusable-ci-binary-ref:
        description: "reusable-ci version installed (cosign-verified) for the SARIF enrich/upload commands. Use a published release tag (vN.N.N or vN.N.N-pre) so the bootstrap scripts + signature resolve."
        required: false
        default: "v3.0.0"
        type: string
      upload-sarif:
        description: "Upload nanolinter's security SARIF to GitHub Code Scanning"
        required: false
        default: true
        type: boolean
      sarif-category:
        description: "Code Scanning category label for the nanolinter security SARIF"
        required: false
        default: "nanolinter-security"
        type: string
    secrets:
      CODE_SCANNING_TOKEN:
        description: "Token with security-events:write for SARIF upload"
        required: false
permissions:
  contents: read
jobs:
  nanolinter-lint:
    name: Nanolinter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ inputs['nanolinter-image'] }}
    permissions:
      contents: read
    env:
      # Trust the worktree for git without writing a config file: the image is
      # non-root with a read-only $HOME, so `git config --global` fails.
      # GIT_CONFIG_* is read by every git invocation (our checkout + nanolinter's
      # own git-based checks).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # Restore the image's intended writable home. GitHub forces HOME=/github/home
      # (a read-only mount) for container jobs, overriding the image's own
      # /home/nanolinter (owned by the non-root user). opengrep hardcodes
      # `mkdir $HOME/.opengrep` on startup with no env override, so it crashes the
      # SAST check under the read-only /github/home; pointing HOME back at the
      # image home (where the baked tool caches/config already live) fixes it.
      # Other tools use the baked XDG_CACHE_HOME, and mvn already doesn't need a
      # writable HOME, so this only helps.
      HOME: /home/nanolinter
      # The non-root image user (uid 65532) cannot write the runner file-command
      # files: $GITHUB_ENV/$GITHUB_OUTPUT/$GITHUB_PATH all live under RUNNER_TEMP
      # (/__w/_temp), a runner-owned mount. So steps must NOT use them — they
      # share state through these static paths under the container-writable /tmp
      # (workdir + SARIF) and an absolute binary path instead of step outputs /
      # env exports / PATH appends.
      WORKDIR: /tmp/nl-src
      SARIF_FILE: /tmp/nl-src/nanolinter-security.sarif
      RC_BIN: /tmp/nl-bin/reusable-ci
    steps:
      - name: Checkout repository (writable workdir)
        # The non-root user can't write $GITHUB_WORKSPACE / RUNNER_TEMP (runner-
        # owned mounts), so check out into the static $WORKDIR under /tmp (the
        # container's /tmp is user-writable). git binary, not actions/checkout
        # (the image ships no node). Full history so nanolinter's git-based checks
        # have the merge-base; token auth via http.extraheader.
        env:
          GIT_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git init -q .
          git remote add origin "${SERVER_URL}/${REPO}.git"
          hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$hdr" fetch --prune origin "$SHA"
          if [ -n "${BASE_REF:-}" ]; then
            git -c http.extraheader="$hdr" fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          git checkout -q --detach "$SHA"
      - name: Run nanolinter (security gate)
        # nanolinter + check tools are baked (default env → /opt/mise shims).
        # --report sarif-security is a report filter only: verify runs the full
        # plan and gates on every check. This step fails directly on a blocking
        # finding (with a clear message) so the red lands HERE, next to the
        # per-check summary — not on a separate "gate" step that reads like a
        # workflow glitch. The SARIF steps below still run via `if: always()`, so
        # the report is produced + uploaded even though this step failed.
        #
        # nanolinter auto-writes its rich "Linting Results" panel to
        # $GITHUB_STEP_SUMMARY, but the non-root user can't write the real runner
        # summary file (it lives under RUNNER_TEMP). So redirect it to a writable
        # /tmp file; the next step ships it to the runtime-base Summary job, which
        # renders it as the GitHub job-summary panel for end users.
        run: |
          set +e
          # Redirect the summary to a writable file. This MUST be a shell export,
          # not a step `env:` — the runner re-injects its own GITHUB_STEP_SUMMARY
          # per step (a step `env:` override is ignored), but a shell export wins
          # for the nanolinter child process.
          export GITHUB_STEP_SUMMARY=/tmp/nl-step-summary.md
          cd "$WORKDIR"
          nanolinter verify --report sarif-security --out "$SARIF_FILE"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            printf '::error::nanolinter found blocking lint issues — see the per-check summary above (this is a lint gate on your code, not a workflow error).\n'
          fi
          exit "$rc"
      - name: Upload nanolinter summary panel
        # The non-root, node-less job can't write the real $GITHUB_STEP_SUMMARY,
        # so ship nanolinter's panel markdown to the runtime-base Summary job
        # (pullrequest-quality-stage.yml), which CAN write the panel.
        #
        # continue-on-error: the artifact upload itself SUCCEEDS, but upload-artifact
        # then fails writing its (unused) step outputs to $GITHUB_OUTPUT — another
        # runner file-command file the non-root user can't write (EACCES). That
        # cosmetic failure must not red the job. This does NOT weaken the lint gate:
        # the gate is the separate "Run nanolinter" step. If the upload ever truly
        # failed, the missing panel downstream ("Artifact not found") signals it.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nanolinter-step-summary
          path: /tmp/nl-step-summary.md
          if-no-files-found: ignore
          retention-days: 5
      - name: Install reusable-ci (cosign-verified, SARIF tooling)
        id: install
        # SARIF glue only, installed via the canonical bootstrap installer (curl +
        # cosign, both baked into the flavour image). curl-fetches the two scripts
        # at $BINARY_REF (no node for actions/checkout), then runs them fail-closed
        # (REUSABLE_CI_REQUIRE_COSIGN=1 → SHA-256 + cosign build-identity, or the
        # step fails). cosign keyless writes its sigstore TUF cache under $HOME/XDG
        # (both read-only in the image) so point them at a writable mktemp dir.
        # GITHUB_PATH is set empty so the installer skips the PATH append the
        # non-root user can't write — it installs to the static $RC_BIN and later
        # steps call it by absolute path.
        if: always() && inputs.upload-sarif
        env:
          BINARY_REF: ${{ inputs.reusable-ci-binary-ref }}
        run: |
          set -euo pipefail
          [ -f "$SARIF_FILE" ] || { echo "no SARIF produced; skipping reusable-ci install"; exit 0; }
          home="$(mktemp -d)"
          mkdir -p "$home"/cache "$home"/config "$home"/data
          export HOME="$home" \
                 XDG_CACHE_HOME="$home/cache" XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data"
          work="$(mktemp -d)"
          raw="https://raw.githubusercontent.com/diggsweden/reusable-ci/${BINARY_REF}/scripts/bootstrap"
          # -f → fail loudly on any HTTP error (never run a half-downloaded
          # script); --retry rides out transient 5xx/timeouts (e.g. raw CDN 504s).
          curl --retry 5 --retry-delay 3 --retry-connrefused -sSfL -o "$work/install-common.sh" "$raw/install-common.sh"
          curl --retry 5 --retry-delay 3 --retry-connrefused -sSfL -o "$work/install-reusable-ci.sh" "$raw/install-reusable-ci.sh"
          GITHUB_PATH="" REUSABLE_CI_REQUIRE_COSIGN=1 REUSABLE_CI_INSTALL_DIR="$(dirname "$RC_BIN")" \
            bash "$work/install-reusable-ci.sh" "$BINARY_REF"
      - name: Enrich nanolinter SARIF for GitHub dedupe
        # Gated on the install step succeeding: if reusable-ci couldn't be installed
        # (e.g. a transient release 504), this skips honestly instead of faking
        # success — the install step's own red surfaces the failure. SARIF_FILE
        # comes from the job env; reusable-ci reads it.
        if: always() && inputs.upload-sarif && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          [ -f "$SARIF_FILE" ] || exit 0
          "$RC_BIN" security report enrich-sarif
      - name: Upload nanolinter SARIF to Code Scanning
        # Gated on install success (see enrich step). Uses CODE_SCANNING_TOKEN
        # (not GITHUB_TOKEN); continue-on-error so a transient Code Scanning API
        # failure doesn't turn the lint gate red.
        if: always() && inputs.upload-sarif && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
          SARIF_CATEGORY: ${{ inputs.sarif-category }}
        run: |
          set -euo pipefail
          [ -f "$SARIF_FILE" ] || exit 0
          "$RC_BIN" security report upload-sarif
