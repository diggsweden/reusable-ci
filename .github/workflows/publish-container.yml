# Container Image Publisher
#
# Purpose: Builds and publishes production-grade container images to any
# OCI-compatible registry with security features including multi-platform
# support, vulnerability scanning, SBOM generation, and SLSA attestation
# (GHCR only).
#
# Supported Registries:
# - GitHub Container Registry (ghcr.io) - Full SLSA support
# - Docker Hub (docker.io) - No SLSA support
# - Quay.io (quay.io) - No SLSA support
# - Any OCI-compatible registry - No SLSA support
#
# How it works:
# 1. prep: compute image coordinate, tags, and labels once via reusable-ci.
#    Validate namespace early.
# 2. build-arch (matrix, fail-fast: false): per-platform native runner
#    (linux/amd64 -> ubuntu-24.04, linux/arm64 -> ubuntu-24.04-arm).
#    Each leg builds and pushes by digest only — no tag is applied yet.
#    Within the same job: per-arch Trivy scan (SARIF category-suffixed),
#    per-arch syft SBOM (artefact upload suffixed), per-arch attest-sbom
#    against the per-arch digest, per-arch extract-binary. Buildkit
#    provenance attaches to each platform digest via `provenance: mode=max`.
# 3. merge: assembles the per-arch digests into a single manifest list
#    via `reusable-ci container manifest merge`, applying all tags from
#    `reusable-ci container metadata`. Single-arch inputs go through the same pipeline
#    (matrix-of-1 + one-entry manifest list).
# 4. provenance (separate workflow_call): SLSA L3 generator attests the
#    manifest list digest. Same as today's behaviour, just consuming
#    merge's output instead of build-and-push's.
#
# No QEMU. Each runner builds its own architecture natively.
#
# Security controls:
# - SLSA Level 3 provenance attestation against the manifest list (GHCR only)
# - Per-platform buildkit provenance (provenance: mode=max) attached to each
#   platform digest
# - Per-platform vulnerability scan with Trivy; per-arch SARIF category
#   suffixing keeps both arches visible in Code Scanning
# - Per-platform SBOM generation (analyzed-container layer) with attest-sbom
#   against the per-arch digest
# - Signed attestations attached to image
# - Security scan results uploaded to Code Scanning (when CODE_SCANNING_TOKEN
#   is configured)
# - Namespace validation (enforces ghcr.io/OWNER/REPO pattern)
#
# Registry Authentication:
#   GHCR (default): Uses GITHUB_TOKEN (no secrets needed)
#   Other registries: Set use-ci-token=false and provide registry-password secret
#
# Required Secrets:
#   registry-password: Required when use-ci-token=false (for Docker Hub, Quay, etc)
#   CODE_SCANNING_TOKEN: Optional — uploads Trivy scan results to Code Scanning;
#                        without it, the SARIF artifact is still saved
#   secrets: inherit: Pass CODE_SCANNING_TOKEN for Code Scanning upload
#
# Required Permissions:
#   contents: read         # Read Containerfile and context
#   packages: write        # Push images to registry
#   id-token: write        # Generate OIDC token for SLSA (GHCR only)
#   attestations: write    # Attach SBOM attestation
#   actions: read          # Read workflow for provenance
#
# Outputs:
#   image: Full image name with primary tag
#   digest: Manifest list digest
#   metadata: Image metadata JSON (tags + labels)
#
# Tagging Strategy (applied to the manifest list, not per-arch):
#   - semver: Version-based tags (v1.0.0, v1, v1.0)
#   - branch: Branch-based tags (main, develop)
#   - sha: SHA-based tags (main-abc1234)
name: Publish Container
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      container-file:
        description: "Containerfile path"
        required: false
        default: "Containerfile"
        type: string
      context:
        description: "Build context directory"
        required: false
        default: "."
        type: string
      branch:
        description: "Branch to checkout (default: main)"
        required: false
        default: "main"
        type: string
      platforms:
        description: "Comma-separated list of platforms to build. Each platform builds natively on a runner of that architecture (linux/amd64 -> ubuntu-24.04, linux/arm64 -> ubuntu-24.04-arm). No QEMU emulation. Multi-platform inputs split across runners and are merged into a single manifest list."
        required: false
        default: "linux/amd64"
        type: string
      artifact-types:
        description: "Comma-separated artifact types (maven,npm,gradle,cargo,go)"
        required: true
        type: string
      artifact-types-json:
        description: "JSON array of artifact types. Prefer this over artifact-types for exact membership checks."
        required: false
        default: "[]"
        type: string
      gradle-artifact-name:
        description: "Name of the uploaded Gradle build artifact to download. Default `gradle-build-artifacts`."
        required: false
        default: ""
        type: string
      maven-artifact-name:
        description: "Name of the uploaded Maven build artifact to download. Default `maven-build-artifacts`."
        required: false
        default: ""
        type: string
      npm-artifact-name:
        description: "Name of the uploaded NPM build artifact to download. Default `npm-build-artifacts`."
        required: false
        default: ""
        type: string
      go-artifact-name:
        description: "Name of the artifact-first Go build artifact to download. Empty means container-first Go, where the Containerfile compiles the binary."
        required: false
        default: ""
        type: string
      cargo-artifact-name:
        description: "Name of the artifact-first Cargo build artifact to download. Empty means container-first Cargo, where the Containerfile compiles the binary."
        required: false
        default: ""
        type: string
      enable-slsa:
        description: "Generate SLSA provenance"
        required: false
        default: true
        type: boolean
      enable-analyzed-container-sbom:
        description: "Run syft on the pushed image and produce the analyzed-container SBOM. Sibling of enable-slsa/enable-scan. When called from release-publish-stage this is derived from source artefacts' sboms; direct callers default to true."
        required: false
        default: true
        type: boolean
      enable-scan:
        description: "Enable vulnerability scanning (gates the publish on finding count — set to false to skip both scan and gate)"
        required: false
        default: true
        type: boolean
      scan-severity:
        description: "Trivy --severity filter; any finding at this level or above fails the publish. Narrow the filter to relax the gate (e.g. 'CRITICAL'); set enable-scan=false to skip entirely. Default 'CRITICAL,HIGH'."
        required: false
        default: "CRITICAL,HIGH"
        type: string
      registry:
        description: "Container registry"
        required: false
        default: "ghcr.io"
        type: string
      image-name:
        description: "Custom image name (defaults to repository name)"
        required: false
        type: string
      build-args:
        description: "Build arguments (KEY=VALUE format, one per line)"
        required: false
        type: string
      target:
        description: "Containerfile stage to build for the runtime image. Empty defaults to the last stage (current docker behavior). Useful for multi-stage Containerfiles where the deployable image is not the last stage."
        required: false
        default: ""
        type: string
      name:
        description: "Container artefact name from artifacts.yml. Namespaces the optional binary upload artefact (extract-binary) AND the published image — when set, the image becomes <registry>/<repository>/<name>:<tag>, giving each container in a multi-container project its own GitHub Packages page. Empty (or set to the repo's short name — the common single-container case) preserves single-image behaviour (<registry>/<repository>:<tag>). Overridden by `image-name` if both are set."
        required: false
        default: ""
        type: string
      extract-binary-target:
        description: "Containerfile stage to extract as a binary CI artefact (typically `FROM scratch AS export-binary` with COPY --from=builder). When set, a second buildx build runs per arch leg with --output type=local and the result is uploaded as ${name}-binaries-${arch}. Used by compiled-native ecosystems (cargo, go) where binaries are byproducts of the container build."
        required: false
        default: ""
        type: string
      extract-binary-names:
        description: "Comma-separated binary file names expected in the export-binary stage output. Used in the step summary for visibility; not enforced."
        required: false
        default: ""
        type: string
      build-secrets:
        description: |
          Newline/comma/space-separated list of BuildKit secret NAMES
          declared in containers[].build-secrets. The values are pulled
          from the REUSABLE_CI_BUILD_SECRETS_JSON envelope secret and
          materialized as tmpfile mounts at build time so they never
          appear in SLSA provenance, workflow logs, or step inputs.
          Pass NAMES only, never KEY=VALUE pairs.
        required: false
        default: ""
        type: string
      push-image:
        description: "Push image to registry"
        required: false
        default: true
        type: boolean
      cache-from:
        description: "Cache sources for build. Honoured on the single-arch path. The multi-arch matrix uses per-arch GHA cache scoping internally; a custom cache-from is ignored on that path. Multi-arch callers needing non-default caches should file an issue."
        required: false
        default: "type=gha"
        type: string
      cache-to:
        description: "Cache destinations for build. Honoured on the single-arch path. The multi-arch matrix uses per-arch GHA cache scoping internally; a custom cache-to is ignored on that path."
        required: false
        default: "type=gha,mode=max"
        type: string
      egress-policy:
        description: "Egress policy for the Harden Runner step"
        required: false
        default: "audit"
        type: string
      registry-username:
        description: "Registry username (defaults to github.actor for GHCR)"
        required: false
        type: string
      use-ci-token:
        description: "Use GITHUB_TOKEN for authentication (GHCR only)"
        required: false
        default: true
        type: boolean
      enforce-namespace:
        description: "Enforce namespace validation (defaults to repository owner)"
        required: false
        type: string
      reusable-ci-binary-ref:
        description: "reusable-ci ref/version to install on plain-runner jobs (defaults to v3.0.0)"
        required: false
        default: "v3.0.0"
        type: string
      sign-image:
        description: "Sign the pushed image with cosign. Method controlled by sign-method (sigstore | kms). false skips the signing step entirely; gpg method is rejected (OpenPGP cannot sign OCI manifests)."
        required: false
        default: false
        type: boolean
      sign-method:
        description: "Cosign backend for image signing: sigstore (keyless OIDC) or kms (cosign + sign-key). Required when sign-image=true. gpg is not a valid choice for image signing."
        required: false
        default: ""
        type: string
      sign-key:
        description: "cosign --key URI for sign-method=kms (awskms://, gcpkms://, hashivault://, pkcs11:, file:). Forbidden for sign-method=sigstore."
        required: false
        default: ""
        type: string
      sign-oidc-issuer:
        description: "OIDC issuer URL for sign-method=sigstore (default: cosign auto-detect). Forbidden for sign-method=kms."
        required: false
        default: ""
        type: string
    secrets:
      registry-password:
        description: "Registry password/token (required when use-ci-token=false)"
        required: false
      CODE_SCANNING_TOKEN:
        description: "Token with code_scanning_alerts:write for uploading SARIF to Code Scanning"
        required: false
      REUSABLE_CI_BUILD_SECRETS_JSON:
        description: |
          JSON object of {name: value} for every entry in
          containers[].build-secrets. Stored as a single pre-packed
          repo/org secret by the adopter (see
          docs/artifacts-reference.md `build-secrets` for the recipe)
          so the value stays inside the secrets channel end-to-end.
          Unpacked into per-secret mode-0600 tmpfiles by `reusable-ci
          container materialize-build-secrets` and mounted into
          BuildKit via --mount=type=secret so values stay out of
          provenance attestations and step inputs.
        required: false
    outputs:
      image:
        description: "Full image name with primary tag"
        value: ${{ jobs.merge.outputs.image }}
      digest:
        description: "Manifest list digest"
        value: ${{ jobs.merge.outputs.digest }}
      metadata:
        description: "Image metadata JSON (tags + labels)"
        value: ${{ jobs.prep.outputs.metadata }}
permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed
jobs:
  prep:
    name: Prepare Build${{ inputs.name && format(' ({0})', inputs.name) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image-name: ${{ steps.image-name.outputs.name }}
      tags: ${{ steps.metadata.outputs.tags }}
      labels: ${{ steps.metadata.outputs.labels }}
      metadata: ${{ steps.metadata.outputs.json }}
      platforms-json: ${{ steps.platforms.outputs.platforms-json }}
      # Unix-epoch seconds of the resolved HEAD commit. Propagated to
      # the build job as SOURCE_DATE_EPOCH (reproducible-builds.org
      # convention) so BuildKit pins the image-config `created`
      # field and every layer entry's mtime. Without this, two
      # builds of the same source produce different image-config
      # digests — verifiers comparing tag re-issues would see drift.
      source-date-epoch: ${{ steps.source-date.outputs.epoch }}
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      # Defense-in-depth gate: refuse to run when the workflow trigger
      # exposes adopter-controlled commit context to signing/package
      # secrets (most importantly pull_request*). All downstream jobs
      # depend on this prep job via `needs:`, so a refusal here skips
      # the entire publish.
      - name: Refuse PR-context trigger (publish/release secrets in scope)
        run: reusable-ci validate event-context
      - name: Determine Image Name
        id: image-name
        env:
          CONTAINER_REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs['image-name'] }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.name }}
        run: reusable-ci container resolve-name
      - name: Validate Image Namespace
        if: ${{ inputs['push-image'] }}
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          REPOSITORY: ${{ github.repository }}
          CONTAINER_REGISTRY: ${{ inputs.registry }}
          ENFORCE_NAMESPACE: ${{ inputs['enforce-namespace'] || github.repository_owner }}
        run: reusable-ci container validate namespace
      - name: Extract Image Metadata
        id: metadata
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          FLAVOR: latest=false
          EMIT_LABELS: "true"
          TAG_RULES: |
            # Always include the ref as-is (branch name, tag name, or PR number)
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

            # For version tags only (v1.0.0, v2.3.4, etc)
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}

            # For stable versions only (no dash in tag name like -beta, -rc)
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

            # SHA-based tags for non-tag refs (branches, PRs) for traceability
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type != 'tag' }}
        run: reusable-ci container metadata
      - name: Compute platforms JSON
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: reusable-ci container platform-plan
      # Reproducible-builds anchor. `git log -1 --format=%ct` returns
      # the committer-date of HEAD as Unix epoch seconds. Passed to
      # BuildKit on the build step as SOURCE_DATE_EPOCH; BuildKit
      # then writes that value into the image-config `created`
      # timestamp AND clamps every layer-tar entry's mtime to it. A
      # rebuild of the same tag therefore produces the same
      # image-config digest. Reference:
      # https://docs.docker.com/build/ci/github-actions/reproducible-builds/
      - name: Compute SOURCE_DATE_EPOCH
        id: source-date
        env:
          # Avoid GitHub's masking on output: `git log` is a local
          # filesystem read, no secrets involved.
          GIT_PAGER: cat
        run: |
          epoch="$(git log -1 --format=%ct HEAD)"
          printf 'epoch=%s\n' "$epoch" >> "$GITHUB_OUTPUT"
          printf '::notice::SOURCE_DATE_EPOCH=%s (commit %s)\n' "$epoch" "$(git rev-parse --short HEAD)"

  build-arch:
    name: Build${{ inputs.name && format(' ({0})({1})', inputs.name, matrix.platform) || format(' ({0})', matrix.platform) }}
    needs: prep
    # linux/arm64 -> ubuntu-24.04-arm (native ARM hosted runner). Anything
    # else falls through to ubuntu-24.04. No QEMU emulation in either path.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prep.outputs.platforms-json) }}
    permissions:
      contents: read
      packages: write
      id-token: write # Required for SLSA provenance + attest-sbom
      attestations: write # Required for SBOM attestation
      actions: read # Required for SLSA provenance v2
    env:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.branch }}
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      - name: Derive arch suffix
        id: arch
        env:
          PLATFORM: ${{ matrix.platform }}
        run: reusable-ci container platform-plan
      - name: Download Maven artifacts
        if: &if_has_maven_artifacts ${{ contains(fromJson(inputs['artifact-types-json']), 'maven') || contains(format(',{0},', inputs['artifact-types']), ',maven,') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['maven-artifact-name'] || 'maven-build-artifacts' }}
          path: ./
      - name: Verify Maven artifacts
        if: *if_has_maven_artifacts
        run: reusable-ci container validate artifacts --project-type maven --artifact-dir target
      - name: Download NPM artifacts
        if: &if_has_npm_artifacts ${{ contains(fromJson(inputs['artifact-types-json']), 'npm') || contains(format(',{0},', inputs['artifact-types']), ',npm,') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['npm-artifact-name'] || 'npm-build-artifacts' }}
          path: ./
      - name: Extract NPM tarball
        if: *if_has_npm_artifacts
        run: reusable-ci container extract-npm-tarball
      - name: Verify NPM artifacts
        if: *if_has_npm_artifacts
        env:
          CONTAINER_CONTEXT: ${{ inputs.context }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: reusable-ci container validate artifacts --project-type npm --artifact-dir dist --containerfile "$CONTAINER_CONTEXT/$CONTAINER_FILE"
      - name: Download Gradle artifacts
        if: &if_has_gradle_artifacts ${{ contains(fromJson(inputs['artifact-types-json']), 'gradle') || contains(format(',{0},', inputs['artifact-types']), ',gradle,') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['gradle-artifact-name'] || 'gradle-build-artifacts' }}
          path: build/libs/
      - name: Verify Gradle artifacts
        if: *if_has_gradle_artifacts
        run: reusable-ci container validate artifacts --project-type gradle --artifact-dir build/libs
      - name: Download Go artifacts
        if: &if_has_go_artifacts ${{ (contains(fromJson(inputs['artifact-types-json']), 'go') || contains(format(',{0},', inputs['artifact-types']), ',go,')) && inputs['go-artifact-name'] != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('{0}-go-build-artifacts', inputs['go-artifact-name']) }}
          path: ${{ inputs.context }}/dist/
      - name: Verify Go artifacts
        if: *if_has_go_artifacts
        env:
          CONTAINER_CONTEXT: ${{ inputs.context }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: reusable-ci container validate artifacts --project-type go --artifact-dir "$CONTAINER_CONTEXT/dist" --containerfile "$CONTAINER_CONTEXT/$CONTAINER_FILE"
      - name: Download Cargo artifacts
        if: &if_has_cargo_artifacts ${{ (contains(fromJson(inputs['artifact-types-json']), 'cargo') || contains(format(',{0},', inputs['artifact-types']), ',cargo,')) && inputs['cargo-artifact-name'] != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('{0}-cargo-build-artifacts', inputs['cargo-artifact-name']) }}
          path: ${{ inputs.context }}/dist/
      - name: Verify Cargo artifacts
        if: *if_has_cargo_artifacts
        env:
          CONTAINER_CONTEXT: ${{ inputs.context }}
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: reusable-ci container validate artifacts --project-type cargo --artifact-dir "$CONTAINER_CONTEXT/dist" --containerfile "$CONTAINER_CONTEXT/$CONTAINER_FILE"
      - name: Verify Containerfile
        id: containerfile
        env:
          CONTAINER_FILE: ${{ inputs['container-file'] }}
        run: reusable-ci container validate containerfile --path "$CONTAINER_FILE"
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Check registry authentication configuration
        if: &if_push_image ${{ inputs['push-image'] }}
        env:
          USE_CI_TOKEN: ${{ inputs['use-ci-token'] }}
          REGISTRY: ${{ inputs.registry }}
          CI_REGISTRY: ghcr.io
          REGISTRY_PASSWORD: ${{ secrets['registry-password'] }}
        run: reusable-ci validate auth registry
      - name: Log in to Container Registry
        if: *if_push_image
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs['registry-username'] || github.actor }}
          password: ${{ inputs['use-ci-token'] && secrets.GITHUB_TOKEN || secrets['registry-password'] }}
      # Unpacks the REUSABLE_CI_BUILD_SECRETS_JSON envelope into per-secret
      # mode-0600 tmpfiles under $RUNNER_TEMP/buildkit-secrets and emits
      # the `secrets:` payload for docker/build-push-action below. Values
      # never enter the workflow log, step inputs, or SLSA provenance —
      # BuildKit mounts them as tmpfs into the RUN steps that opt in via
      # `--mount=type=secret,id=<name>`.
      - name: Materialize build secrets
        id: build-secrets
        env:
          BUILD_SECRET_NAMES: ${{ inputs['build-secrets'] }}
          REUSABLE_CI_BUILD_SECRETS_JSON: ${{ secrets.REUSABLE_CI_BUILD_SECRETS_JSON }}
        run: reusable-ci container materialize-build-secrets
      - name: Build by digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          # BuildKit reads SOURCE_DATE_EPOCH from the runner env and
          # clamps the image-config `created` timestamp plus every
          # layer-tar mtime to this value. Computed once in `prep`
          # from `git log -1 --format=%ct` of the resolved HEAD.
          SOURCE_DATE_EPOCH: ${{ needs.prep.outputs.source-date-epoch }}
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.containerfile.outputs.containerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          # No tag at this stage. The merge job applies all tags from
          # `reusable-ci container metadata` via `reusable-ci container manifest merge` once both
          # arches' digests exist. push-by-digest pushes the image without
          # tagging; name-canonical=true ensures the digest reference uses
          # the canonical image name.
          outputs: ${{ inputs['push-image'] && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.prep.outputs.image-name) || format('type=image,name={0}', needs.prep.outputs.image-name) }}
          labels: ${{ needs.prep.outputs.labels }}
          # Per-arch GHA cache scope keeps the matrix legs from evicting
          # each other. Custom cache-from/cache-to inputs are not threaded
          # into the multi-arch matrix today (documented on the input).
          cache-from: type=gha,scope=build-${{ steps.arch.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.arch.outputs.suffix }}
          build-args: ${{ inputs['build-args'] }}
          secrets: ${{ steps['build-secrets'].outputs['buildx-secrets'] }}
          provenance: ${{ inputs['enable-slsa'] && 'mode=max' || 'false' }}
          sbom: ${{ inputs['enable-analyzed-container-sbom'] }}
      - name: Check SLSA compatibility
        if: ${{ inputs['push-image'] && inputs['enable-slsa'] && inputs.registry != 'ghcr.io' }}
        env:
          CONTAINER_REGISTRY: ${{ inputs.registry }}
        run: |
          printf "::notice::SLSA provenance generation only supports ghcr.io registry\n"
          printf "::notice::Current registry: %s\n" "$CONTAINER_REGISTRY"
          printf "::notice::SLSA provenance attestation will be skipped\n"
          printf "::notice::To enable SLSA: Use registry: ghcr.io or set enable-slsa: false\n"
      - name: Export digest
        if: *if_push_image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: reusable-ci container write-digest-marker
      # Artefact names MUST be unique across the entire workflow run, not
      # just within this workflow_call invocation: when multiple containers
      # are matrix-dispatched (release-publish-stage's per-container
      # matrix), each container's publish-container call shares
      # github.run_id. Without per-container scoping, hsm-worker's
      # digests-<run_id>-amd64 would collide with wallet-bff's; one upload
      # silently wins and the merge job downloads the wrong container's
      # digest. Same root cause applies to SARIF + SBOM uploads below.
      - name: Upload digest
        if: *if_push_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ github.run_id }}-${{ inputs.name || 'container' }}-${{ steps.arch.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Install trivy
        if: &if_scan_enabled ${{ inputs['enable-scan'] && inputs['push-image'] }}
        run: |
          # shellcheck disable=SC1091
          source .github-shared/scripts/bootstrap/install-trivy.sh
          install_trivy
      - name: Scan container image and derive reports${{ inputs.name && format(' ({0})', inputs.name) || '' }}
        if: *if_scan_enabled
        env:
          # The image was pushed by digest only — never loaded into the local
          # docker daemon — so trivy falls through to remote pull. In remote
          # mode trivy's default target platform is linux/amd64, which works
          # accidentally on the amd64 leg but fails on every other arch with
          # "no child with platform linux/amd64 in index" (buildkit's
          # provenance: mode=max + sbom: true wraps the per-arch image in an
          # OCI index alongside attestations). Pin the platform per leg so
          # each scan resolves to its own child manifest.
          TRIVY_PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: ${{ needs.prep.outputs.image-name }}@${{ steps.build.outputs.digest }}
          SCAN_SEVERITY: ${{ inputs['scan-severity'] }}
        run: reusable-ci security scan container --severity "$SCAN_SEVERITY"
      - name: Save container scan SARIF artifact
        if: *if_scan_enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-container-scan-${{ inputs.name || 'container' }}-${{ steps.arch.outputs.suffix }}
          path: trivy-results.sarif
          retention-days: 5
          if-no-files-found: ignore
      - name: Save GitLab container-scanning report
        if: ${{ inputs['enable-scan'] && inputs['push-image'] && hashFiles('gl-container-scanning-report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitlab-container-scanning-report-${{ inputs.name || 'container' }}-${{ steps.arch.outputs.suffix }}
          path: gl-container-scanning-report.json
          retention-days: 5
          if-no-files-found: ignore
      - name: Upload container scan results to Code Scanning
        if: *if_scan_enabled
        env:
          SARIF_FILE: trivy-results.sarif
          # Per-(container, arch) category keeps every leg visible in Code
          # Scanning; GitHub dedupes per (category, file). Without the
          # per-container scoping, two containers' amd64 scans share a
          # category and one silently overwrites the other.
          SARIF_CATEGORY: container-scan-${{ inputs.name || 'container' }}-${{ steps.arch.outputs.suffix }}
        run: reusable-ci security report upload-sarif
      - name: Generate Container SBOMs${{ inputs.name && format(' — {0}', inputs.name) || '' }} (SPDX + CycloneDX)
        if: &if_sbom_enabled ${{ inputs['enable-analyzed-container-sbom'] && inputs['push-image'] }}
        env:
          ARTIFACT_TYPES: ${{ inputs['artifact-types'] }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ needs.prep.outputs.image-name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: reusable-ci sbom generate container
      - name: Upload Analyzed-Container SBOMs
        if: *if_sbom_enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-(container, arch) suffix avoids upload-artifact name
          # collision across the workflow run; every leg's SBOM lands as
          # a separate release-attached artefact.
          name: analyzed-container-sbom-${{ github.run_id }}-${{ inputs.name || 'container' }}-${{ steps.arch.outputs.suffix }}
          path: |
            *-analyzed-container-sbom.spdx.json
            *-analyzed-container-sbom.cyclonedx.json
          retention-days: 30
      - name: Find Container SBOM file
        if: &if_sbom_and_slsa_enabled ${{ inputs['enable-analyzed-container-sbom'] && inputs['push-image'] && inputs['enable-slsa'] }}
        id: find-sbom
        run: reusable-ci sbom find container
      - name: Attest Container SBOM${{ inputs.name && format(' — {0}', inputs.name) || '' }}
        if: *if_sbom_and_slsa_enabled
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ needs.prep.outputs.image-name }}
          # Per-arch digest: each platform image gets its own SBOM
          # attestation. cosign verify-attestation against the per-arch
          # digest succeeds for the corresponding platform.
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ steps.find-sbom.outputs.sbom-file }}
          push-to-registry: true
      # Optional binary extraction (container-first / compiled-native ecosystems).
      # Each native arch leg extracts its own binary directly. No QEMU.
      # Per-arch artefact name avoids upload-artifact collision.
      - name: Extract binaries${{ inputs.name && format(' ({0})', inputs.name) || '' }}
        if: ${{ inputs['extract-binary-target'] != '' }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          # Match the main build step. The binary extracted here is
          # used as a release asset; pinning the build timestamp
          # makes its SHA stable across rebuilds of the same tag.
          SOURCE_DATE_EPOCH: ${{ needs.prep.outputs.source-date-epoch }}
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.containerfile.outputs.containerfile }}
          target: ${{ inputs['extract-binary-target'] }}
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=local,dest=./extracted-binaries
          cache-from: type=gha,scope=build-${{ steps.arch.outputs.suffix }}
          build-args: ${{ inputs['build-args'] }}
          secrets: ${{ steps['build-secrets'].outputs['buildx-secrets'] }}
      # Suffix each extracted binary's basename with -linux-${arch} so that
      # when the GitHub Release attach step pulls per-arch artefacts together,
      # they don't collide on the same basename. Convention matches Go's
      # release-asset naming (e.g., hsm-worker-linux-amd64,
      # hsm-worker-linux-arm64).
      - name: Suffix extracted binaries with arch
        if: ${{ inputs['extract-binary-target'] != '' }}
        env:
          SUFFIX: ${{ steps.arch.outputs.suffix }}
          EXPECTED_NAMES: ${{ inputs['extract-binary-names'] }}
        run: |
          reusable-ci container suffix-extracted-binaries \
            --dir ./extracted-binaries \
            --arch "$SUFFIX" \
            --expected-names "$EXPECTED_NAMES"
      - name: Upload extracted binaries${{ inputs.name && format(' ({0})', inputs.name) || '' }}
        if: ${{ inputs['extract-binary-target'] != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name != '' && format('{0}-binaries-{1}', inputs.name, steps.arch.outputs.suffix) || format('container-binaries-{0}', steps.arch.outputs.suffix) }}
          path: ./extracted-binaries/**
          retention-days: 30
          if-no-files-found: error
      - name: Write binary extraction summary
        if: ${{ inputs['extract-binary-target'] != '' }}
        env:
          ARTIFACT_NAME: ${{ inputs.name != '' && format('{0}-binaries-{1}', inputs.name, steps.arch.outputs.suffix) || format('container-binaries-{0}', steps.arch.outputs.suffix) }}
          DISPLAY_NAME: ${{ inputs.name || 'container' }}
          EXTRACT_TARGET: ${{ inputs['extract-binary-target'] }}
          EXPECTED_NAMES: ${{ inputs['extract-binary-names'] }}
          PLATFORM: ${{ matrix.platform }}
        run: reusable-ci report extracted-binaries

  merge:
    name: Merge Manifest${{ inputs.name && format(' ({0})', inputs.name) || '' }}
    needs: [prep, build-arch]
    if: ${{ inputs['push-image'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # id-token is required only for the keyless Sigstore signing
      # step below (--method=sigstore). Granting it here doesn't
      # leak — the token is only minted when an OIDC-requesting step
      # actually runs, and the only such step is gated on
      # sign-image + sign-method == sigstore.
      id-token: write
    outputs:
      image: ${{ steps.outputs.outputs.image }}
      digest: ${{ steps.outputs.outputs.digest }}
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ github.run_id }}-${{ inputs.name || 'container' }}-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Check registry authentication configuration
        env:
          USE_CI_TOKEN: ${{ inputs['use-ci-token'] }}
          REGISTRY: ${{ inputs.registry }}
          CI_REGISTRY: ghcr.io
          REGISTRY_PASSWORD: ${{ secrets['registry-password'] }}
        run: reusable-ci validate auth registry
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs['registry-username'] || github.actor }}
          password: ${{ inputs['use-ci-token'] && secrets.GITHUB_TOKEN || secrets['registry-password'] }}
      - name: Create manifest list and push
        env:
          IMAGE_NAME: ${{ needs.prep.outputs.image-name }}
          TAGS: ${{ needs.prep.outputs.tags }}
          DIGESTS_DIR: /tmp/digests
        run: reusable-ci container manifest merge
      - name: Inspect manifest and emit outputs
        id: outputs
        env:
          TAGS: ${{ needs.prep.outputs.tags }}
        run: reusable-ci container manifest inspect
      - name: Sign image (cosign)
        # Image signing runs against the manifest list digest produced
        # by the merge step above. --recursive (default true) walks
        # the manifest list and signs each per-arch child digest too,
        # so consumers pulling for any single platform get a verified
        # signature.
        #
        # gpg method is rejected by `container sign` — OpenPGP signs
        # blobs, not OCI manifests. Use sigstore or kms.
        if: ${{ inputs['sign-image'] && inputs['sign-method'] != '' && inputs['sign-method'] != 'gpg' }}
        env:
          SIGN_METHOD: ${{ inputs['sign-method'] }}
          SIGN_KEY: ${{ inputs['sign-key'] }}
          SIGN_OIDC_ISSUER: ${{ inputs['sign-oidc-issuer'] }}
        run: |
          reusable-ci container sign "${{ steps.outputs.outputs.image-digest-ref }}"

  # SLSA L3 provenance attestation against the manifest list digest.
  # actions/attest-build-provenance is a SHA-pinnable first-party
  # action producing the SLSA v1.0 predicate. Per-platform buildkit
  # provenance attached by build-push-action covers the platform-
  # level attestation; this job attests the manifest list itself.
  provenance:
    needs: [prep, merge]
    if: ${{ inputs['push-image'] && inputs['enable-slsa'] && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Sigstore keyless OIDC for the attestation
      packages: write # push-to-registry uploads the attestation
      attestations: write # GitHub attestation store record
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs['registry-username'] || github.actor }}
          password: ${{ inputs['use-ci-token'] && secrets.GITHUB_TOKEN || secrets['registry-password'] }}
      - name: Attest manifest-list build provenance
        # subject-name uses prep.outputs.image-name (the bare ref,
        # no tag) because attest-build-provenance binds attestations
        # to immutable refs — combining a bare image with the
        # manifest-list digest is the canonical form.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ needs.prep.outputs.image-name }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true
