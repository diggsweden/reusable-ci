# Promote Stage
#
# Purpose: one rung of the build-once / promote-many image ladder. Takes the
# release-image ledger emitted by publish-container.yml at build time and
# promotes the SAME immutable digest to a stage's tag(s) — dev → staging →
# release — by a verified tag-move, never a rebuild.
#
# How it works:
# 1. Downloads the run-scoped `release-images-ledger` artifact (the ledger the
#    build job wrote with `container ledger add`).
# 2. `container ledger promote --stage <name>` re-validates each entry for the
#    stage, re-checks the candidate digest BEFORE the copy and the destination
#    digest AFTER it (the trust boundary), and copies via:
#      - same registry/path  → in-process OCI tag-move via go-containerregistry
#                               (daemonless; the shared digest carries the sig)
#      - different registry   → `cosign copy` (signature travels)  [--stage-repo]
# 3. On failure, `container ledger rollback` deletes any promoted tag that still
#    serves the entry's digest (never touches a pre-existing/third-party tag).
#
# Gating: the caller passes `environment` so each stage can require approval
# (e.g. dev = auto, staging = reviewers, release/prod = reviewers). The job
# pauses on the GitHub Environment's protection rules before any tag-move.
#
# Evidence model: the SLSA provenance, SBOM and cosign ORIGIN signature are
# attestations of FACT created ONCE at build and inherited by every stage; this
# workflow VERIFIES and carries them, it never re-signs. Release-time GPG /
# prod-key signing is an APPROVAL and lives in the release-create stage, not
# here. See docs reusable-ci-release-flow-architecture.md §7–§8.
#
# Required permissions:
#   contents: read   # checkout bootstrap installer
#   packages: write  # tag-move / delete on ghcr.io
#   id-token: write  # keyless cosign for cross-registry copy (--stage-repo)
#
# Required secrets:
#   registry-password: token for a non-ghcr source registry (use-ci-token=false)
#
# NOTE (cross-registry): a `--stage-repo` on a *different* registry requires
# cosign on the runner and push credentials for the destination registry. The
# same-registry dev → staging → release path (the common case) needs neither.
name: Promote Stage
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      stage:
        description: "Promotion stage: dev | staging | release. Every stage adds one moving pointer <base>:<stage> on the same digest; the immutable :<version> tag is build-only. Release also enforces release scope."
        required: true
        type: string
      stage-repo:
        description: "Optional destination PREFIX (typically the registry host, optionally + a new namespace) for cross-registry / sovereignty promotion. Each image's SOURCE PATH is preserved beneath it — <prefix>/<source-path-after-host> (e.g. codeberg.org + ghcr.io/org/app → codeberg.org/org/app) — so a multi-container release maps to distinct paths by construction; a cross-registry release also carries the immutable :<version> tag. Empty keeps the image's own registry."
        required: false
        default: ""
        type: string
      release-tag:
        description: "Release tag the final_tag (and candidate_tag) must be scoped to. Required for the release stage; ignored by named stages."
        required: false
        default: ""
        type: string
      environment:
        description: "GitHub Environment to gate this promotion on (its protection rules pause the job until approved). Empty = no gate."
        required: false
        default: ""
        type: string
      ledger-artifact-pattern:
        description: "Glob matching the run-scoped ledger artifacts uploaded by publish-container.yml (one per container, named release-images-ledger-<name>). All matches are downloaded and merged into one ledger, so a multi-container release promotes as a single unit."
        required: false
        default: "release-images-ledger*"
        type: string
      registry:
        description: "Source container registry to authenticate to."
        required: false
        default: "ghcr.io"
        type: string
      registry-username:
        description: "Registry username (defaults to github.actor for ghcr)."
        required: false
        default: ""
        type: string
      use-ci-token:
        description: "Use GITHUB_TOKEN for ghcr authentication. Set false to use registry-password for an external registry."
        required: false
        default: true
        type: boolean
      # === CROSS-REGISTRY DESTINATION (sovereignty promotion) ===
      # Only used when stage-repo points at a DIFFERENT registry than the
      # source. cosign copy then carries the image + signature across, and it
      # needs a second login to the destination registry.
      stage-registry:
        description: "Destination registry host to authenticate to for a cross-registry promotion (e.g. codeberg.org, harbor.example.com). Empty = same-registry promotion (no second login)."
        required: false
        default: ""
        type: string
      stage-registry-username:
        description: "Username for the destination registry login (cross-registry only)."
        required: false
        default: ""
        type: string
      dry-run:
        description: "Preview the tag-moves without performing them."
        required: false
        default: false
        type: boolean
      egress-policy:
        description: "harden-runner egress policy (audit | block)."
        required: false
        default: "audit"
        type: string
      reusable-ci-binary-ref:
        description: "reusable-ci ref/version to install on the runner."
        required: false
        default: "v3.0.0"
        type: string
    secrets:
      registry-password:
        description: "External registry token (required when use-ci-token=false)."
        required: false
      stage-registry-password:
        description: "Destination-registry token for a cross-registry (sovereignty) promotion — cosign copy authenticates the push with it. Required when stage-repo targets a different registry."
        required: false
permissions:
  contents: read # Base least-privilege; the job adds what it needs.
jobs:
  promote:
    name: Promote to ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Stage gate: the Environment's protection rules (required reviewers, wait
    # timer, branch policy) pause this job before any tag-move. Empty = no gate.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign for the cross-registry (--stage-repo) copy
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      # Defense-in-depth: refuse a PR-context trigger before any registry
      # mutation, matching the orchestrators' top-of-pipeline gate.
      - name: Refuse PR-context trigger (registry-write secrets in scope)
        run: reusable-ci validate event-context
      # Downloads every per-container ledger artifact (release-images-ledger-<name>)
      # into its own subdirectory under ledgers/, then merges them into one
      # dist/release-images.json — the CLI's default ledger path. This is what
      # makes a multi-container release promote as a single gated unit.
      #
      # Each stage job re-downloads + re-merges rather than threading a merged
      # artifact forward: GHA jobs are stateless (no shared filesystem), and the
      # per-container artifacts are the clean hand-off, so this keeps the
      # workflow self-contained and usable standalone. The cost (a few KB of
      # JSON, an instant merge) is negligible. `ledger merge` no-ops gracefully
      # if no ledger artifacts exist (best-effort build emission).
      - name: Download release-image ledgers
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATTERN: ${{ inputs['ledger-artifact-pattern'] }}
          ARTIFACT_DIR: ledgers
        run: reusable-ci artifact download
      - name: Merge ledgers
        run: reusable-ci container ledger merge ledgers
      - name: Check registry authentication configuration
        env:
          USE_CI_TOKEN: ${{ inputs['use-ci-token'] }}
          REGISTRY: ${{ inputs.registry }}
          CI_REGISTRY: ghcr.io
          REGISTRY_PASSWORD: ${{ secrets['registry-password'] }}
        run: reusable-ci validate auth registry
      - name: Log in to Container Registry
        env:
          CONTAINER_REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ inputs['registry-username'] || github.actor }}
          REGISTRY_PASSWORD: ${{ inputs['use-ci-token'] && secrets.GITHUB_TOKEN || secrets['registry-password'] }}
        run: reusable-ci container login
      # Cross-registry (sovereignty) promotion only: a second login so cosign
      # copy can push the image + signature to a different registry, and cosign
      # itself on the runner. Both are skipped for the same-registry path, which
      # promotes with the daemonless in-process OCI client (go-containerregistry)
      # and needs neither.
      - name: Log in to destination registry (cross-registry)
        if: ${{ inputs['stage-repo'] != '' && inputs['stage-registry'] != '' }}
        env:
          CONTAINER_REGISTRY: ${{ inputs['stage-registry'] }}
          REGISTRY_USERNAME: ${{ inputs['stage-registry-username'] }}
          REGISTRY_PASSWORD: ${{ secrets['stage-registry-password'] }}
        run: reusable-ci container login
      - name: Install cosign (cross-registry copy)
        if: ${{ inputs['stage-repo'] != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Release stage only: offline schema/scope re-validation against the tag.
      # Named stages (dev/staging) are validated stage-aware inside `promote`.
      - name: Validate ledger (release scope)
        if: ${{ inputs.stage == 'release' }}
        env:
          PROMOTE_TAG: ${{ inputs['release-tag'] }}
        run: reusable-ci container ledger validate --tag "$PROMOTE_TAG"
      # The promote verb is the trust boundary: it re-checks the candidate
      # digest before the copy and the destination digest after it, failing
      # loud on any mismatch. Same-registry → in-process tag-move via
      # go-containerregistry (daemonless); cross-registry (--stage-repo) →
      # cosign copy carrying the signature.
      - name: Promote digest to ${{ inputs.stage }}
        env:
          PROMOTE_STAGE: ${{ inputs.stage }}
          PROMOTE_STAGE_REPO: ${{ inputs['stage-repo'] }}
          PROMOTE_TAG: ${{ inputs['release-tag'] }}
          DRY_RUN: ${{ inputs['dry-run'] }}
        run: |
          reusable-ci container ledger promote \
            --stage "$PROMOTE_STAGE" \
            ${PROMOTE_STAGE_REPO:+--stage-repo "$PROMOTE_STAGE_REPO"} \
            ${PROMOTE_TAG:+--tag "$PROMOTE_TAG"} \
            ${DRY_RUN:+--dry-run}
      # Release stage only: after a successful promotion, drop the staging
      # candidate tag (its job — being the promotion source — is done). The
      # pre-check inside `cleanup` refuses to delete unless the digest is still
      # served. Tag deletion is forge-API-specific and forge-aware ON PURPOSE:
      # Forgejo's package API deletes a single tag, but ghcr can only delete a
      # package *version* — which the staging and release tags SHARE — so
      # deleting the staging tag there would delete the released image. Hence
      # best-effort: it cleans on forges that can do it safely and leaves the
      # staging tag in place where it can't (a harmless immutable record),
      # never failing the release.
      - name: Clean up staging candidate (release)
        if: ${{ inputs.stage == 'release' && !inputs['dry-run'] }}
        continue-on-error: true
        env:
          PROMOTE_TAG: ${{ inputs['release-tag'] }}
        run: reusable-ci container ledger cleanup ${PROMOTE_TAG:+--tag "$PROMOTE_TAG"}
      # Undo this stage's partial promotion: delete the stage's pointer tag(s)
      # (:dev/:staging/:release) that still serve the entry's digest — never the
      # immutable :<version>. Stage-aware so it targets exactly what promote
      # wrote. Best-effort for the same reason cleanup is (no-op where the forge
      # can't delete); the promote verb's pre/post digest checks are the primary
      # safety. Skipped on dry-run (nothing was moved).
      - name: Roll back on failure
        if: ${{ failure() && !inputs['dry-run'] }}
        continue-on-error: true
        env:
          PROMOTE_STAGE: ${{ inputs.stage }}
          PROMOTE_STAGE_REPO: ${{ inputs['stage-repo'] }}
          PROMOTE_TAG: ${{ inputs['release-tag'] }}
        run: |
          reusable-ci container ledger rollback \
            --stage "$PROMOTE_STAGE" \
            ${PROMOTE_STAGE_REPO:+--stage-repo "$PROMOTE_STAGE_REPO"} \
            ${PROMOTE_TAG:+--tag "$PROMOTE_TAG"}
