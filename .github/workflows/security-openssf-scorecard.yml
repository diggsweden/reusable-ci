# Description:
# This workflow runs OpenSSF Scorecard to analyze your repository for security best practices.
# It uploads the results as artifacts and integrates with GitHub's code scanning dashboard.
#
# How to use:
# 1. Add the following to your workflow file:
#    jobs:
#      scorecard-analysis:
#        uses: <orgname>/<reponame>/.github/workflows/<workflowname>.yml@72b9c326139080c9a9c91999ada2d62d19e7ee54 # v2.7.0
#        with:
#          cron-schedule: "30 1 * * 6" # Optional, default is "30 1 * * 5" (weekly on Fridays at 01:30 UTC)
#          publish-results: true # Optional, default is true
#
# 2. The results will be available as artifacts and in the GitHub Code Scanning dashboard.
#
# Note: This workflow is repository-general. The reusable-ci-ref input is only
#       used for the SARIF upload script checkout.
name: Analyze OpenSSF Scorecard
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      cron-schedule:
        description: "Cron schedule for the workflow (default: '30 1 * * 5' - weekly on Fridays at 01:30 UTC)"
        required: false
        default: "30 1 * * 5"
        type: string
      publish-results:
        description: "Whether to publish the results to the OpenSSF Scorecard API (default: true)"
        required: false
        default: true
        type: boolean
      egress-policy:
        description: "Egress policy for the Harden Runner step (e.g., audit, block)"
        required: false
        default: "audit"
        type: string
      reusable-ci-ref:
        description: "Ref for reusable-ci helper scripts checkout (defaults to main)"
        required: false
        default: "main"
        type: string
    secrets:
      SARIF_UPLOAD_TOKEN:
        description: "Token with code_scanning_alerts:write for uploading SARIF to Code Scanning"
        required: false
permissions:
  contents: read
jobs:
  # The scorecard publish webapp rejects any job whose steps aren't all `uses:`.
  # We keep this job strictly pure-actions and hand off SARIF to a separate
  # `publish-sarif` job via an artifact.
  # See https://github.com/ossf/scorecard-action#workflow-restrictions
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed for GitHub OIDC token if publish_results is true
      id-token: write
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}
      - name: Save scorecard SARIF artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-scorecard
          path: results.sarif
          retention-days: 5
          if-no-files-found: ignore

  # Runs in a separate job so the `analysis` job stays pure-actions (required
  # by the scorecard publish webapp). Downloads the SARIF artifact produced
  # above and uploads it to Code Scanning via the shared helper script.
  publish-sarif:
    name: Upload SARIF to Code Scanning
    needs: [analysis]
    if: always() && needs.analysis.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Download scorecard SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-scorecard
        continue-on-error: true
      - name: Checkout reusable-ci scripts
        if: hashFiles('results.sarif') != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-ref'] }}
          path: .github-shared
          sparse-checkout: scripts
      - name: Upload scorecard results to Code Scanning
        if: hashFiles('results.sarif') != ''
        continue-on-error: true
        env:
          SARIF_UPLOAD_TOKEN: ${{ secrets.SARIF_UPLOAD_TOKEN }}
          SARIF_FILE: results.sarif
          SARIF_CATEGORY: scorecard
        run: bash .github-shared/scripts/security/upload-sarif.sh
