# Description:
# This workflow runs OpenSSF Scorecard to analyze your repository for security best practices.
# It uploads the results as artifacts and integrates with GitHub's code scanning dashboard.
#
# How to use:
# 1. Add the following to your workflow file:
#    jobs:
#      scorecard-analysis:
#        uses: <orgname>/<reponame>/.github/workflows/<workflowname>.yml@v3.0.0
#        with:
#          cron-schedule: "30 1 * * 6" # Optional, default is "30 1 * * 5" (weekly on Fridays at 01:30 UTC)
#          publish-results: true # Optional, default is true
#
# 2. The results will be available as artifacts and in the GitHub Code Scanning dashboard.
#
# Note: This workflow is repository-general. The reusable-ci-binary-ref input is only
#       used to install the reusable-ci binary for SARIF upload.
name: Analyze OpenSSF Scorecard
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      cron-schedule:
        description: "Cron schedule for the workflow (default: '30 1 * * 5' - weekly on Fridays at 01:30 UTC)"
        required: false
        default: "30 1 * * 5"
        type: string
      publish-results:
        description: "Whether to publish the results to the OpenSSF Scorecard API (default: true)"
        required: false
        default: true
        type: boolean
      egress-policy:
        description: "Egress policy for the Harden Runner step (e.g., audit, block)"
        required: false
        default: "audit"
        type: string
      reusable-ci-binary-ref:
        description: "reusable-ci ref/version to install for SARIF upload (defaults to v3.0.0)"
        required: false
        default: "v3.0.0"
        type: string
    secrets:
      CODE_SCANNING_TOKEN:
        description: "Token with security-events:write for SARIF upload"
        required: false
permissions:
  contents: read
jobs:
  # The scorecard publish webapp rejects any job whose steps aren't all `uses:`.
  # We keep this job strictly pure-actions and hand off SARIF to a separate
  # `publish-sarif` job via an artifact.
  # See https://github.com/ossf/scorecard-action#workflow-restrictions
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed for GitHub OIDC token if publish_results is true
      id-token: write
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}
      - name: Save scorecard SARIF artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-scorecard
          path: results.sarif
          retention-days: 5
          if-no-files-found: ignore

  # Runs in a separate job so the `analysis` job stays pure-actions (required
  # by the scorecard publish webapp). Downloads the SARIF artifact produced
  # above and uploads it to Code Scanning via reusable-ci.
  publish-sarif:
    name: Upload SARIF to Code Scanning
    needs: [analysis]
    if: always() && needs.analysis.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Harden GitHub runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.egress-policy }}
      # Install reusable-ci first so the artifact download below can use the
      # node-less verb. Unconditional (the download result isn't known yet); the
      # cost on a no-SARIF run is one bootstrap install.
      - name: Checkout reusable-ci bootstrap installers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci
          ref: ${{ inputs['reusable-ci-binary-ref'] }}
          path: .github-shared
          sparse-checkout: scripts/bootstrap
      # Tagged refs (vN.N.N) install from GitHub Releases with SHA-256
      # verification — no Go toolchain needed. Branch/SHA refs require Go on
      # the runner; the install script errors with an actionable message if
      # absent.
      - name: Install reusable-ci binary
        env:
          REUSABLE_CI_BINARY_REF: ${{ inputs['reusable-ci-binary-ref'] }}
        run: bash .github-shared/scripts/bootstrap/install-reusable-ci.sh "$REUSABLE_CI_BINARY_REF"
      - name: Download scorecard SARIF artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: sarif-scorecard
          ARTIFACT_DIR: .
        run: reusable-ci artifact download
      - name: Upload scorecard results to Code Scanning
        if: hashFiles('results.sarif') != ''
        continue-on-error: true
        env:
          CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
          SARIF_FILE: results.sarif
          SARIF_CATEGORY: scorecard
        run: reusable-ci security report upload-sarif
