# ⚠️ INTERNAL USE ONLY - Release workflow for reusable-ci itself
# This workflow manages reusable-ci's own releases using release-orchestrator.
# For templates to use in YOUR project, see examples/ directory.
name: Self Release
on:
  push:
    tags:
      - "release-request/v*"
concurrency:
  group: self-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  blackbox:
    name: Strict companion black-box gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: reusable-ci
      - name: Checkout companion testsuite (pinned)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: diggsweden/reusable-ci-blackbox-tests
          ref: b9f7ab2a22c2fae30ec8df5194c64ff094ff0843
          path: reusable-ci-blackbox-tests
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: reusable-ci/go.mod
          check-latest: true
      - name: Validate strict companion behavioral contract
        working-directory: reusable-ci-blackbox-tests
        run: ./scripts/validate-strict-profile-contract.sh
      - name: Ensure distro toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq buildah maven
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: "v1.49.0"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: Run strict black-box release gate
        working-directory: reusable-ci-blackbox-tests
        env:
          REUSABLE_CI_BLACKBOX_PROFILE: strict
          REUSABLE_CI_PROC_SWAPS: "/dev/null"
        run: go test -tags=blackbox -count=1 -timeout 45m ./tests/blackbox/...

  release:
    needs: blackbox
    uses: ./.github/workflows/release-orchestrator.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    # Own-repo orchestrator call (dogfooding the release flow); the
    # orchestrator declares its enumerated secrets at the workflow_call
    # boundary, and this repo holds no unrelated secrets to overshare.
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit
    with:
      branch: ${{ github.event.repository.default_branch }}
      artifacts-config: .reusable-ci/artifacts.yml
      reusable-ci-binary-ref: ${{ github.sha }}
      changelog-creator: git-cliff
      changelog.config: templates/gitcliff/default.toml
      release-publisher: github-cli
