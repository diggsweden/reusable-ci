# ⚠️ INTERNAL USE ONLY - Release workflow for reusable-ci itself
# This workflow manages reusable-ci's own releases using release-orchestrator.
# For templates to use in YOUR project, see examples/ directory.
name: Self Release
on:
  push:
    tags:
      - "release-request/v*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/release-orchestrator.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    # Own-repo orchestrator call (dogfooding the release flow); the
    # orchestrator declares its enumerated secrets at the workflow_call
    # boundary, and this repo holds no unrelated secrets to overshare.
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit
    with:
      artifacts-config: .reusable-ci/artifacts.yml
      reusable-ci-binary-ref: ${{ github.sha }}
      changelog-creator: git-cliff
      changelog.config: templates/gitcliff/default.toml
      release-publisher: github-cli
