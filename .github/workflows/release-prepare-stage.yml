name: Release Prepare Stage
on:
  workflow_call: # yamllint disable-line rule:truthy
    inputs:
      branch:
        required: true
        type: string
      runtime-image:
        description: "reusable-ci runtime image for the summarize job (base is sufficient)"
        required: false
        default: "ghcr.io/diggsweden/reusable-ci-runtime-base:main"
        type: string
      artifacts:
        required: true
        type: string
      should-run-version-bump:
        required: true
        type: string
      file-pattern:
        required: true
        type: string
    outputs:
      stage-ran:
        description: Prepare stage ran at least one version bump path
        value: ${{ jobs.summarize-prepare-stage.outputs.stage-ran }}
      stage-result:
        description: Normalized prepare stage result
        value: ${{ jobs.summarize-prepare-stage.outputs.stage-result }}
      result-json:
        description: Prepare stage result payload
        value: ${{ jobs.summarize-prepare-stage.outputs.result-json }}
      release-sha:
        description: Commit SHA the release tag was moved to
        value: ${{ jobs.execute-version-bump.outputs.release-sha }}
permissions:
  contents: read
jobs:
  execute-version-bump:
    name: Prepare Release - ${{ matrix.artifact.name }}
    if: ${{ inputs['should-run-version-bump'] == 'true' && inputs.artifacts != '[]' }}
    strategy:
      matrix:
        artifact: ${{ fromJson(inputs.artifacts) }}
      fail-fast: false
    permissions:
      contents: write
      packages: read
    secrets: inherit
    uses: ./.github/workflows/version-bump.yml
    with:
      branch: ${{ inputs.branch }}
      project-type: ${{ matrix.artifact['project-type'] }}
      file-pattern: ${{ inputs['file-pattern'] }}
      gradle-version-file: ${{ matrix.artifact.config['gradle-version-file'] }}
      working-directory: ${{ matrix.artifact['working-directory'] }}
      # Pick the runtime image that matches the project-type's bump
      # tooling: maven/gradle/gradle-android need JDK + Maven; npm needs
      # Node; cargo needs cargo for Cargo.lock refresh; xcode-ios is
      # sed-only and uses base.
      runtime-image: >-
        ${{ (contains(fromJson('["maven","gradle","gradle-android"]'), matrix.artifact['project-type']) && 'ghcr.io/diggsweden/reusable-ci-runtime-java-25:main') || (matrix.artifact['project-type'] == 'npm' && 'ghcr.io/diggsweden/reusable-ci-runtime-node-24:main') || (matrix.artifact['project-type'] == 'cargo' && 'ghcr.io/diggsweden/reusable-ci-runtime-rust-stable:main') || 'ghcr.io/diggsweden/reusable-ci-runtime-base:main' }}
  summarize-prepare-stage:
    name: Summarize Prepare Stage
    needs: [execute-version-bump]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs['runtime-image'] }}
    permissions:
      contents: read
    outputs:
      stage-ran: ${{ steps.summary.outputs.stage-ran }}
      stage-result: ${{ steps.summary.outputs.stage-result }}
      result-json: ${{ steps.summary.outputs.result-json }}
    steps:
      - name: Normalize prepare stage result
        id: summary
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          SHOULD_RUN_VERSION_BUMP: ${{ inputs['should-run-version-bump'] }}
          PREPARE_RELEASE_RESULT: ${{ needs.execute-version-bump.result }}
        run: reusable-ci summary prepare-stage-result
      - name: Upload prepare stage manifests
        if: always() && hashFiles('.ci-results/*.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-results-prepare
          path: .ci-results/*.json
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: ignore
