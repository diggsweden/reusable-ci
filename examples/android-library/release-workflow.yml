# Example: Android Library Release Workflow
#
# Identical to the Android *app* release workflow — the difference between
# publishing an AAR to Maven Central and an AAB to Google Play lives
# entirely in artifacts.yml (`build-type: library`), not here.
name: Release Workflow
on:
  push:
    tags:
      - "v*.*.*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: diggsweden/reusable-ci/.github/workflows/release-orchestrator.yml@v3.0.0
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    secrets: inherit
    with:
      reusable-ci-binary-ref: v3.0.0
      artifacts-config: .reusable-ci/artifacts.yml
      release-publisher: github-cli
