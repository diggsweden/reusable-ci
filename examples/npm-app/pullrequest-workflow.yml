name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@v3.0.0
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      reusable-ci-binary-ref: v3.0.0
      project-type: npm
      # Default lint route: nanolinter (just+mise-based; runs your `just lint`)
      linters.nanolinter: true

  # Optional: Add project-specific tests
  # test:
  #   needs: [pr-checks]
  #   if: always()
  #   permissions:
  #     contents: read
  #     packages: read
  #   uses: ./.github/workflows/test.yml
