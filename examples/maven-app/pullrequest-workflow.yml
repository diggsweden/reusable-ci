name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@v3.0.0
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      reusable-ci-binary-ref: v3.0.0
      project-type: maven
      # Recommended: Use devbase-check (lightweight, just+mise-based)
      linters.nanolinter: true
      # OpenGrep SAST is enabled by default. Opt out if needed:
      # security.sast-opengrep: false
      # security.sast-opengrep-rules: p/default
      # security.sast-opengrep-fail-on-severity: high

  # Optional: Add project-specific tests
  # test:
  #   needs: [pr-checks]
  #   if: always()
  #   permissions:
  #     contents: read
  #     packages: read
  #   uses: ./.github/workflows/test.yml
