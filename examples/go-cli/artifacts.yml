# Example: Go CLI shipped as standalone release binaries.
#
# artifact-first: build-go.yml compiles dist/<goos>-<goarch>/<binary>-<goos>-<goarch> and
# uploads those files as <name>-go-build-artifacts. The GitHub release step can
# attach them via release.attachartifacts.
artifacts:
  - name: my-cli
    project-type: go
    working-directory: .
    config:
      build-mode: artifact-first
      main-package: ./cmd/my-cli
      binary-name: my-cli
      platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
      skip-tests: false
