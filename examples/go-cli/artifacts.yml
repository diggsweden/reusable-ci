# Example: Go CLI shipped as standalone release binaries.
#
# artifact-first: build-go.yml compiles dist/<goos>-<goarch>/<binary>-<goos>-<goarch> and
# uploads those files as <name>-go-build-artifacts. The GitHub release step can
# attach them via release.attachartifacts.
artifacts:
  - name: my-cli
    project-type: go
    working-directory: .
    config:
      build-mode: artifact-first
      main-package: ./cmd/my-cli
      binary-name: my-cli
      platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
      skip-tests: false

# Recommended default for new projects on a keyless-capable forge (GitHub /
# GitLab): Sigstore-keyless. No signing key on the runner, no secret to manage,
# and `reusable-ci validate artifact-signature` derives the verification
# identity from the forge in CI (no flags). Switch to `gpg` for PGP-native
# ecosystems (Maven Central, apt/rpm) or `kms` for an HSM/Vault trust anchor —
# see docs/verification.md → "Choosing a method". Omitting this block entirely
# defaults to gpg, preserving the pre-cosign contract for existing repos.
sign:
  method: sigstore
