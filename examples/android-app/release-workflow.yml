# Example: Android App Release Workflow
name: Release Workflow
on:
  push:
    tags:
      - "v*.*.*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    uses: diggsweden/reusable-ci/.github/workflows/release-orchestrator.yml@v3.0.0
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    secrets: inherit
    with:
      reusable-ci-binary-ref: v3.0.0
      artifacts-config: .reusable-ci/artifacts.yml
      release-publisher: github-cli
