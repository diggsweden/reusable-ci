# Release Dev Workflow
#
# This workflow builds the Android app and uploads to Google Play internal track for testing.
# Triggered manually via workflow_dispatch (GitHub Actions UI).
#
# How to use:
# 1. Go to Actions tab in GitHub
# 2. Select "Release Dev Workflow"
# 3. Click "Run workflow"
# 4. Select branch to build from
# 5. Click "Run workflow"
#
# Created artifacts:
# - AAB uploaded to Google Play internal track
#
# This mirrors the iOS release-dev-workflow which uploads to TestFlight.
# For Android, the equivalent is Google Play's internal testing track.

name: Release Dev Workflow

on:
  workflow_dispatch:

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: diggsweden/reusable-ci/.github/workflows/build-gradle-android.yml@747ac6d4ff82d409a48c125266939a15df9a3270 # Migration baseline
    permissions:
      contents: read
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }} # Optional Gradle configuration
    with:
      reusable-ci-ref: 747ac6d4ff82d409a48c125266939a15df9a3270
      java-version: "21"
      build-module: app
      product-flavor: demo
      build-types: release
      include-aab: true
      enable-signing: true
      artifact-name-prefix: dev
      include-date-stamp: false

  upload-play-store:
    needs: build
    uses: diggsweden/reusable-ci/.github/workflows/publish-google-play.yml@747ac6d4ff82d409a48c125266939a15df9a3270 # Migration baseline
    permissions:
      contents: read
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    with:
      reusable-ci-ref: 747ac6d4ff82d409a48c125266939a15df9a3270
      # Pull the AAB upload name straight from the build job's output instead
      # of duplicating the derived format string. Stays correct if the format
      # ever changes.
      aab-artifact-name: ${{ needs.build.outputs.aab-name }}
      package-name: com.example.myapp
      track: internal
      status: completed
