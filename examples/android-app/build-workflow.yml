# Example: Android App Build Workflow (for development/CI builds)
# This builds Android variants during development
name: Build Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: diggsweden/reusable-ci/.github/workflows/build-gradle-android.yml@747ac6d4ff82d409a48c125266939a15df9a3270 # Migration baseline
    permissions:
      contents: read
      packages: write
    secrets:
      SECRETS_PROPERTIES_BASE64: ${{ secrets.SECRETS_PROPERTIES_BASE64 }} # Optional Gradle configuration
      # When enabling signing, also map ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; see release-dev-workflow.yml.
    with:
      reusable-ci-ref: 747ac6d4ff82d409a48c125266939a15df9a3270
      java-version: "25"
      jdk-distribution: "zulu"
      build-module: "app"
      product-flavor: "demo"
      build-types: "debug,release"
      include-aab: true
      artifact-name-prefix: "testing_store"
      include-date-stamp: true
      enable-signing: false # Set to true for signed builds
