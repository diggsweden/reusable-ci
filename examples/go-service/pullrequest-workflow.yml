name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@v3.0.0
    secrets: inherit
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      reusable-ci-binary-ref: v3.0.0
      project-type: go
      linters.nanolinter: true

  # Keep project-specific Go tests and govulncheck in the caller repository.
  # Uncomment once .github/workflows/test.yml runs `go test ./...`, `go vet`,
  # and any org-specific govulncheck policy.
  # test:
  #   permissions:
  #     contents: read
  #   uses: ./.github/workflows/test.yml
