# Example: Gradle JVM library (publishes to Maven Central).
#
# For Android applications, see examples/android-app/ — that path uses
# `project-type: gradle-android` and routes to build-gradle-android.yml,
# which understands product flavors, AABs, and Google Play publishing.
artifacts:
  - name: my-gradle-lib
    project-type: gradle
    working-directory: .
    build-type: library
    publish-to:
      - maven-central
    config:
      java-version: 25
      gradle-tasks: build
      # Publishing runs in the publish stage through publish-gradle.yml with
      # Gradle's maven-publish and signing plugins, not in the build. Maven
      # Central gets a signed bundle through the Central Portal API; see
      # docs/publishing.md#gradle-publishing for the build script.
