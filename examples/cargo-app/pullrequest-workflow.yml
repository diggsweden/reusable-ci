name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@747ac6d4ff82d409a48c125266939a15df9a3270 # Migration baseline
    secrets:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }} # Optional Code Scanning upload
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      reusable-ci-ref: 747ac6d4ff82d409a48c125266939a15df9a3270
      project-type: cargo
      linters.devbasecheck: true
      linters.commitlint: false
      linters.licenselint: false
      linters.megalint: false
      # Configure clippy, rustfmt and cargo-audit in the project's devbase-check
      # setup or a caller-owned test job; they are not orchestrator inputs.

  # Workspace-level tests (testcontainers, workspace features) live in the
  # caller. sbom-cargo.yml does not run cargo test — that path is per-artefact
  # and can't express workspace features. Uncomment once you've added
  # .github/workflows/test.yml that runs `cargo test --workspace`.
  # test:
  #   permissions:
  #     contents: read
  #     packages: read
  #   uses: ./.github/workflows/test.yml
