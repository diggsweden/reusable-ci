# Example: Go CLI artifacts signed with Sigstore keyless.
#
# `sign.method: sigstore` tells `release sign` (and container image
# signing) to use cosign with the runner's OIDC token. There is no
# long-lived artifact-signing key to manage — Fulcio issues a 10-minute
# certificate bound to the workflow identity for each release.
#
# Git commits and tags are a separate trust domain. This example selects
# git-native SSH signing, which requires RELEASE_SSH_SIGNING_KEY and a matching
# principal in .reusable-ci/allowed_signers. reusable-ci does not currently
# support keyless Git-object signing.
#
# Requirements on the caller workflow:
#   permissions:
#     id-token: write   # required to request the OIDC token
#     contents: write   # required to create the release
#
# See docs/verification.md#signing-methods-for-release-artefacts.
artifacts:
  - name: my-cli
    project-type: go
    working-directory: .
    config:
      build-mode: artifact-first
      main-package: ./cmd/my-cli
      binary-name: my-cli
      platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64

sign:
  method: sigstore
  # oidc-issuer is auto-detected from the runner (GitHub Actions →
  # https://token.actions.githubusercontent.com). Set it explicitly
  # only for self-hosted Fulcio or non-default platforms.

git-signing:
  method: ssh
