# Example: Multiple artifacts building into ONE combined container
# Use case: Monorepo with Maven + Gradle services and 1 NPM frontend → 1 combined container image
artifacts:
  # Backend API (Maven) - built for the combined container
  - name: api
    project-type: maven
    working-directory: services/api
    build-type: application
    config:
      java-version: 25
  # Background worker (Gradle JVM) - built for the combined container
  - name: worker
    project-type: gradle
    working-directory: services/worker
    config:
      java-version: 25
      gradle-tasks: build
  # Web frontend (NPM) - built for the combined container
  - name: web
    project-type: npm
    working-directory: apps/web
    config:
      node-version: 24
# ONE container containing all three artifacts
# Multi-stage Containerfile at repo root uses all three build outputs
containers:
  - name: combined-app
    from: [api, worker, web]
    container-file: Containerfile
    context: .
    platforms: linux/amd64,linux/arm64
